<svg width="280" height="480" viewBox="0 0 280 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d7b8"/>
      <stop offset="1" stop-color="#d8c09a"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4a58f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f4a58f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="280" height="480" fill="url(#bg)"/>
  <!-- bookshelf hint -->
  <rect x="150" y="20" width="130" height="230" fill="#a9855c" opacity="0.55"/>
  <g opacity="0.75">
    <rect x="170" y="35" width="16" height="70" rx="2" fill="#7c9e8e"/>
    <rect x="190" y="30" width="14" height="75" rx="2" fill="#b5544e"/>
    <rect x="208" y="40" width="16" height="65" rx="2" fill="#c9a24b"/>
    <rect x="228" y="34" width="14" height="71" rx="2" fill="#5f7f9e"/>
    <rect x="170" y="150" width="15" height="70" rx="2" fill="#5f7f9e"/>
    <rect x="188" y="145" width="15" height="75" rx="2" fill="#c9a24b"/>
    <rect x="207" y="155" width="15" height="65" rx="2" fill="#7c9e8e"/>
  </g>

  <!-- floor book (standing on) -->
  <g>
    <rect x="70" y="430" width="150" height="26" rx="4" fill="#c98a3c"/>
    <rect x="70" y="426" width="150" height="10" rx="4" fill="#e0a856"/>
    <rect x="78" y="431" width="134" height="4" fill="#f0e4c8"/>
  </g>

  <!-- ===== CHARACTER ===== -->
  <g>
    <!-- legs -->
    <rect x="112" y="372" width="20" height="46" rx="9" fill="#f4e3c8"/>
    <rect x="148" y="372" width="20" height="46" rx="9" fill="#f4e3c8"/>
    <!-- socks -->
    <rect x="111" y="398" width="22" height="22" rx="7" fill="#fffaf0"/>
    <rect x="147" y="398" width="22" height="22" rx="7" fill="#fffaf0"/>
    <!-- shoes -->
    <path d="M108 418 h30 a8 8 0 0 1 8 8 v6 h-46 v-6 a8 8 0 0 1 8 -8 z" fill="#7a4a2b"/>
    <path d="M144 418 h30 a8 8 0 0 1 8 8 v6 h-46 v-6 a8 8 0 0 1 8 -8 z" fill="#7a4a2b"/>
    <rect x="100" y="430" width="46" height="6" rx="3" fill="#5f3820"/>
    <rect x="136" y="430" width="46" height="6" rx="3" fill="#5f3820"/>

    <!-- skirt -->
    <path d="M96 320 q44 20 88 0 l14 60 q-58 22 -116 0 z" fill="#e8a92e"/>
    <path d="M96 320 q44 20 88 0 l4 18 q-48 18 -96 0 z" fill="#f2bd4a"/>
    <g stroke="#cf8f1f" stroke-width="2" opacity="0.6">
      <line x1="118" y1="332" x2="112" y2="378"/>
      <line x1="140" y1="336" x2="140" y2="382"/>
      <line x1="162" y1="332" x2="168" y2="378"/>
    </g>

    <!-- arms (white sleeves) -->
    <path d="M92 232 q-14 30 -8 62 l16 -2 q-2 -30 8 -56 z" fill="#fdfdf8"/>
    <path d="M188 232 q14 30 8 62 l-16 -2 q2 -30 -8 -56 z" fill="#fdfdf8"/>
    <!-- hands -->
    <circle cx="96" cy="298" r="9" fill="#f6d9b8"/>
    <circle cx="184" cy="298" r="9" fill="#f6d9b8"/>

    <!-- torso: white blouse -->
    <path d="M100 218 q40 -14 80 0 l6 108 q-46 16 -92 0 z" fill="#fdfdf8"/>

    <!-- vest (teal) -->
    <path d="M104 224 q36 -10 72 0 l6 100 q-42 14 -84 0 z" fill="#1f8a86"/>
    <!-- vest open front (blouse showing) -->
    <path d="M140 220 l-14 106 q14 5 28 0 z" fill="#fdfdf8"/>
    <!-- vest collar -->
    <path d="M112 222 l28 16 -6 12 -26 -20 z" fill="#176e6b"/>
    <path d="M168 222 l-28 16 6 12 26 -20 z" fill="#176e6b"/>
    <!-- vest emblem -->
    <circle cx="160" cy="262" r="9" fill="#f2bd4a"/>
    <path d="M160 256 l2 4 4 0 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 0 z" fill="#176e6b"/>

    <!-- red ribbon bow -->
    <path d="M140 236 l-16 -8 4 16 z" fill="#d64c46"/>
    <path d="M140 236 l16 -8 -4 16 z" fill="#d64c46"/>
    <circle cx="140" cy="236" r="4" fill="#b53a35"/>

    <!-- satchel strap -->
    <path d="M112 226 q30 40 62 96" stroke="#c98a3c" stroke-width="6" fill="none"/>
    <!-- satchel bag -->
    <rect x="168" y="300" width="34" height="40" rx="6" fill="#e0a856"/>
    <rect x="168" y="300" width="34" height="12" rx="6" fill="#cf8f1f"/>
    <rect x="181" y="312" width="8" height="8" rx="2" fill="#7a4a2b"/>

    <!-- neck -->
    <rect x="130" y="200" width="20" height="22" rx="8" fill="#f2cba6"/>

    <!-- head -->
    <circle cx="140" cy="164" r="52" fill="#f8ddbb"/>
    <!-- cheeks -->
    <ellipse cx="112" cy="176" rx="12" ry="8" fill="url(#cheek)"/>
    <ellipse cx="168" cy="176" rx="12" ry="8" fill="url(#cheek)"/>

    <!-- hair back -->
    <path d="M86 168 q-8 -78 54 -80 q62 2 54 80 q0 20 -8 30 l-10 -6 q6 -40 -8 -58 q-28 -22 -56 0 q-14 18 -8 58 l-10 6 q-8 -10 -8 -30 z" fill="#20222b"/>
    <!-- bangs -->
    <path d="M92 150 q6 -46 48 -48 q42 2 48 48 q-14 -20 -30 -18 q4 12 -6 20 q-4 -14 -14 -14 q-8 0 -12 12 q-8 -8 -6 -18 q-16 -2 -28 18 z" fill="#20222b"/>
    <!-- side hair -->
    <path d="M88 158 q-6 34 8 52 l10 -6 q-10 -22 -6 -48 z" fill="#191b22"/>
    <path d="M192 158 q6 34 -8 52 l-10 -6 q10 -22 6 -48 z" fill="#191b22"/>

    <!-- star hairclips -->
    <g transform="translate(104,120)">
      <path d="M0 -7 L2 -2 7 -2 3 1 4 6 0 3 -4 6 -3 1 -7 -2 -2 -2 z" fill="#4fd0c8"/>
    </g>
    <g transform="translate(118,112)">
      <path d="M0 -6 L1.7 -1.7 6 -1.7 2.6 0.8 3.4 5 0 2.6 -3.4 5 -2.6 0.8 -6 -1.7 -1.7 -1.7 z" fill="#7fe0d8"/>
    </g>

    <!-- eyebrows -->
    <path d="M108 146 q10 -5 20 0" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M152 146 q10 -5 20 0" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <g>
      <ellipse cx="120" cy="162" rx="11" ry="13" fill="#fff"/>
      <ellipse cx="160" cy="162" rx="11" ry="13" fill="#fff"/>
      <circle cx="121" cy="164" r="9" fill="#4a2f1e"/>
      <circle cx="161" cy="164" r="9" fill="#4a2f1e"/>
      <circle cx="121" cy="164" r="4.5" fill="#1a1008"/>
      <circle cx="161" cy="164" r="4.5" fill="#1a1008"/>
      <circle cx="124" cy="160" r="3" fill="#fff"/>
      <circle cx="164" cy="160" r="3" fill="#fff"/>
      <circle cx="118" cy="167" r="1.5" fill="#fff" opacity="0.8"/>
      <circle cx="158" cy="167" r="1.5" fill="#fff" opacity="0.8"/>
    </g>

    <!-- nose -->
    <path d="M139 174 q2 3 3 5" stroke="#d8a67e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M128 186 q12 12 24 0" stroke="#b5544e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M130 187 q10 8 20 0 z" fill="#fff"/>
  </g>
</svg>
