function shuffle(arr) {
const a = [...arr];
for (let i = a.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}

}
function genSeqProblem(jumpOpts) {
const jump  = jumpOpts[Math.floor(Math.random() * jumpOpts.length)];
const maxBase = Math.floor((9999 - 3 * jump) / jump) * jump;
const minBase = Math.ceil(1000 / jump) * jump;
const rangeCount = Math.floor((maxBase - minBase) / jump) + 1;
const base  = minBase + Math.floor(Math.random() * rangeCount) * jump;
const seq   = [base, base + jump, base + 2 * jump, base + 3 * jump];
const blank = 2 + Math.floor(Math.random() * 2);
const ans   = seq[blank];
const display = seq.map((n, i) => i === blank ? '[ ? ]' : String(n)).join(' \u2192 ');
const wrongs = [ans + jump * 2, ans - jump, ans + jump, ans - jump * 2]
.filter(n => n >= 1000 && n <= 9999 && n !== ans);
const opts = shuffle([String(ans), ...wrongs.slice(0, 3).map(String)]).slice(0, 4);
return { type: 'seq', display, answer: String(ans), options: opts };
}
function genCompProblem() {

function buildReelSpinner(winEl, cellH, startOffset) {

function repairCertConfig() {
const c = (L.reward && L.reward.certificate) || {};
return {
title: c.title || '수리 인증서',
subtitle: c.subtitle || '',
heading: c.heading || '수리 인증서를 받아요!',
subtext: c.subtext || '이름을 적으면 나만의 인증서가 완성돼요.',
defaultName: c.defaultName || '수리 친구',
body: (Array.isArray(c.body) && c.body.length) ? c.body : ['인증서를 잘 보관해요.'],
footer: c.footer || (L.title ? '수리력 웹콘텐츠 · ' + L.title : '수리력 웹콘텐츠'),
buttonText: c.buttonText || '인증서 저장하기'
};
}
function openRepairCertificate(step) {
if (document.getElementById('repairCertOverlay')) return;
const cfg = repairCertConfig();
const ov = document.createElement('div');
ov.id = 'repairCertOverlay';
ov.className = 'repair-cert-overlay';
ov.innerHTML =
'<div class="repair-cert-card" role="dialog" aria-modal="true" aria-label="' + esc(cfg.heading) + '">' +
'<button class="repair-cert-close" type="button" aria-label="닫기">×</button>' +
'<div class="repair-cert-medal" aria-hidden="true">🏅</div>' +
'<h2 class="repair-cert-h">' + esc(cfg.heading) + '</h2>' +
'<p class="repair-cert-sub">' + esc(cfg.subtext) + '</p>' +
'<div class="repair-cert-name-row">' +
'<input id="repairCertName" class="repair-cert-name" type="text" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off" />' +
'</div>' +
'<button class="cta clear-next-cta repair-cert-dl" id="repairCertDl" type="button">' +
'<span aria-hidden="true">★</span> ' + esc(cfg.buttonText) + '</button>' +
'<div class="repair-cert-star" id="repairCertStar" aria-hidden="true">★</div>' +
'</div>';
(document.getElementById('app') || document.body).appendChild(ov);
requestAnimationFrame(() => ov.classList.add('repair-cert-show'));
const nameInput = ov.querySelector('#repairCertName');
later(() => { try { nameInput?.focus(); } catch (_) {} }, 60);

function downloadRepairCertificate(cfg) {
cfg = cfg || repairCertConfig();
const raw = (document.getElementById('repairCertName')?.value || '').trim();
const name = raw || cfg.defaultName;
const FONT = '"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif';
const drawOn = (base, w, h) => {
const cv = document.createElement('canvas');
cv.width = w; cv.height = h;
const g = cv.getContext('2d');
if (base) g.drawImage(base, 0, 0);
else {
g.fillStyle = '#fff8ec'; g.fillRect(0, 0, w, h);
g.strokeStyle = '#c9a24b'; g.lineWidth = Math.max(8, w * 0.012);
g.strokeRect(w * 0.03, h * 0.04, w * 0.94, h * 0.92);
}
const W = cv.width, H = cv.height, cx = W / 2;
g.textAlign = 'center';
g.fillStyle = '#b07316';
g.font = '700 ' + Math.round(W * 0.072) + 'px ' + FONT;
g.fillText(cfg.title, cx, H * 0.30);
if (cfg.subtitle) {
g.font = '700 ' + Math.round(W * 0.036) + 'px ' + FONT;
g.fillText('- ' + cfg.subtitle + ' -', cx, H * 0.355);
}
g.fillStyle = '#2a5db0';
g.font = '700 ' + Math.round(W * 0.07) + 'px ' + FONT;
g.fillText(name, cx, H * 0.475);
const nameW = Math.min(W * 0.62, Math.max(W * 0.3, g.measureText(name).width + W * 0.08));
g.strokeStyle = 'rgba(176,115,22,.55)';
g.lineWidth = Math.max(2, W * 0.004);
g.beginPath();
g.moveTo(cx - nameW / 2, H * 0.505);
g.lineTo(cx + nameW / 2, H * 0.505);
g.stroke();
g.fillStyle = '#6b5535';
g.font = '700 ' + Math.round(W * 0.036) + 'px ' + FONT;
cfg.body.forEach((t, i) => g.fillText(t, cx, H * (0.585 + i * 0.058)));
const d = new Date();
g.fillStyle = '#8a6a3a';
g.font = '700 ' + Math.round(W * 0.032) + 'px ' + FONT;
g.fillText(d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일', cx, H * 0.80);
g.fillStyle = '#2c4a24';
g.font = '700 ' + Math.round(W * 0.028) + 'px ' + FONT;
g.fillText(cfg.footer, cx, H * 0.87);
try {
const a = document.createElement('a');
a.download = cfg.title.replace(/\s/g, '') + '_' + name + '.png';
a.href = cv.toDataURL('image/png');
document.body.appendChild(a);
a.click();
a.remove();
popRepairCertStar();
} catch (_) {
window.alert('인증서 저장에 실패했어요. 브라우저에서 다운로드가 막혀 있지 않은지 확인해 주세요.');
}
};
const draw = () => {
if (!REPAIR_CERT_BASE) { drawOn(null, 1080, 1400); return; }
const base = new Image();
base.onload = () => drawOn(base, base.naturalWidth, base.naturalHeight);
base.onerror = () => drawOn(null, 1080, 1400);
base.src = REPAIR_CERT_BASE;
};
const fonts = (typeof document !== 'undefined' && document.fonts) ? document.fonts : null;
if (fonts && fonts.load) {
Promise.all([
fonts.load('700 80px "Jua"'),
fonts.load('700 40px "Jua"')
]).then(draw, draw);
} else {
draw();
}
}
function renderRepairOutroFlow(step) {
if (step?.id !== 'step-4') return false;
const firstSceneId = repairStorySequence(step)[0];
return firstSceneId ? renderRepairStoryRoute(step, firstSceneId) : renderRepairStoryComplete(step);
}
const REPAIR_DEV_ENABLED = new URLSearchParams(location.search).has('dev');
let repairDevPendingTarget = null;
let repairDevActiveId = '';
let repairDevBaseRender = null;
const REPAIR_DEV_GROUPS = [
{
title: '체크포인트',
targets: [
{ id: 'step-1', stepId: 'step-1', kind: 'step', label: '도입' },
{ id: 'step-2', stepId: 'step-2', kind: 'step', label: '판 정리' },
{ id: 'step-3', stepId: 'step-3', kind: 'step', label: '판 뒤집기' },
{ id: 'ball:intro', stepId: 'step-3', kind: 'ballIntro', label: '공 던지기' },
{ id: 'ball:cheer', stepId: 'step-3', kind: 'ballCheer', label: '응원 점수' },
{ id: 'ball:victory', stepId: 'step-3', kind: 'ballVictory', label: '모두 승리' },
{ id: 'step-4', stepId: 'step-4', kind: 'step', label: '수리 이야기' },
{ id: 'story:complete', stepId: 'step-4', kind: 'storyComplete', label: '완료' },
],
},
];
function repairDevStep(stepId) {
return (L.steps ?? []).find(step => step.id === stepId) ?? null;
}
function repairDevResetTransition() {
const app = document.getElementById('app');
_stageTransitioning = false;
app?.classList.remove('stage-fade-out', 'stage-fade-in');
if (app) delete app.dataset.transition;
}
function repairDevSetStep(stepId) {
const idx = (L.steps ?? []).findIndex(step => step.id === stepId);
if (idx < 0) return false;
repairDevResetTransition();
stepIdx = idx;
msnIdx = 0;
outroIdx = 0;
realLifeSlideIdx = 0;
_lessonProgressPct = 0;
return true;
}
function repairDevGroups() {
return REPAIR_DEV_GROUPS;
}
function repairDevTargetMap() {
const pairs = [];
repairDevGroups().forEach(group => {
group.targets.forEach(target => pairs.push([target.id, target]));
});
return new Map(pairs);
}
function repairDevApplyTarget(target) {
if (!target || target.kind === 'step') return;
const step = repairDevStep(target.stepId);
if (!step) return;
repairDevResetTransition();
stopNarration?.();
setHeaderNarrationReplay?.(null);
if (target.kind === 'ballIntro') renderBallThrowIntro(step);
else if (target.kind === 'ballCheer') renderBallThrowCheerAnnounce(step);
else if (target.kind === 'ballVictory') renderBallThrowVictory(step);
else if (target.kind === 'storyComplete') {
renderRepairStoryComplete(step);
}
}
function repairDevPanelHtml() {
return '<div class="repair-dev-head">' +
'<strong>DEV</strong><span>1-2/01</span>' +
'</div>' +
'<div class="repair-dev-groups">' +
repairDevGroups().map((group, index) =>
'<details class="repair-dev-group" open>' +
'<summary>' + esc(group.title) + '</summary>' +
'<div class="repair-dev-buttons">' +
group.targets.map(target =>
'<button type="button" data-dev-target="' + esc(target.id) + '" title="' + esc(group.title + ' · ' + target.label) + '">' +
esc(target.label) +
'</button>'
).join('') +
'</div>' +
'</details>'
).join('') +
'</div>' +
'<div class="repair-dev-tools">' +
'<button type="button" data-dev-tool="rerender">현재 다시 그림</button>' +
'<button type="button" data-dev-tool="stop">타이머 정지</button>' +
'</div>';
}
function syncRepairDevSceneJump() {
const panel = document.querySelector('.repair-dev-scene-jump');
if (!panel) return;
panel.querySelectorAll('[data-dev-target]').forEach(btn => {
btn.classList.toggle('is-active', btn.dataset.devTarget === repairDevActiveId);
});
}
function ensureRepairDevSceneJump() {
if (!REPAIR_DEV_ENABLED) return;
const app = document.getElementById('app');
if (!app) return;
let panel = document.querySelector('.repair-dev-scene-jump');
if (!panel) {
panel = document.createElement('aside');
panel.className = 'repair-dev-scene-jump';
panel.setAttribute('aria-label', '개발용 상세 장면 이동');
panel.innerHTML = repairDevPanelHtml();
panel.addEventListener('click', event => {
const tool = event.target.closest('[data-dev-tool]');
if (tool) {
if (tool.dataset.devTool === 'rerender') render();
if (tool.dataset.devTool === 'stop') {
clearTimers();
stopNarration?.();
if (typeof pauseBgm === 'function') pauseBgm();
}
return;
}
const btn = event.target.closest('[data-dev-target]');
if (!btn) return;
const target = repairDevTargetMap().get(btn.dataset.devTarget);
if (!target || !repairDevSetStep(target.stepId)) return;
repairDevPendingTarget = target;
repairDevActiveId = target.id;
render();
});
app.appendChild(panel);
}
syncRepairDevSceneJump();
}
function installRepairDevSceneJump() {
if (!REPAIR_DEV_ENABLED || repairDevBaseRender) return;
repairDevBaseRender = render;
render = function repairDevRenderWrapper() {
repairDevBaseRender();
const target = repairDevPendingTarget;
repairDevPendingTarget = null;
if (target) {
repairDevApplyTarget(target);
} else {
repairDevActiveId = (L.steps ?? [])[stepIdx]?.id ?? repairDevActiveId;
}
ensureRepairDevSceneJump();
syncRepairDevSceneJump();
};
ensureRepairDevSceneJump();
}
window.lessonExt = {
devSceneJump: 'custom',
cleanup() {
clearTimers();
clearRepairTeacherHintTarget();
repairFlowStateId = null;

'repair-game-rule-intro-mode', 'repair-game-action-mode', 'repair-game-problem-mode', 'repair-game-result-mode', 'repair-game-end-mode', 'repair-game-throw-start-mode', 'repair-game-throw-action-mode', 'repair-game-cheer-announce-mode', 'repair-game-compare-hint-mode', 'repair-teacher-tap-hint', 'repair-teacher-hint-open', 'repair-story-mode', 'repair-story-route-mode', 'repair-story-gate-mode', 'repair-story-signal-mode', 'repair-story-complete-mode', 'clear-impact-hit');
},
renderIntroFlow: renderRepairIntroFlow,
renderTutorial: renderRepairTutorialFlow,
renderProblemBank: renderRepairGameStart,
renderOutro: renderRepairOutroFlow,
};
installRepairDevSceneJump();
})();
/* 좌상단 "처음으로"(#btnHome) 버튼을 햄버거 + "목록" 버튼으로 바꾸고,
* 클릭하면 현재 학년(1학년) 차시 목록을 좌측 드로어로 띄운다. (2-2/02와 동일 패턴)
*  - 데이터: lesson.json 의 ui.courseMenu (번호/제목/id 또는 path).
*    · id 있으면 같은 학기 형제 폴더(../<id>/)로 이동
*    · path 있으면 그 상대경로로 이동(다른 학기 예: ../../1-1/01/)
*    · 둘 다 없으면 "준비 중"
*  - current(id)와 일치하는 항목은 활성화 + "지금" 태그. */
(function installCourseMenu() {
const menu = (typeof L !== 'undefined') && L && L.ui && L.ui.courseMenu;
const homeBtn = document.getElementById('btnHome');
const app = document.getElementById('app');
if (!menu || !homeBtn || !app) return;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
{ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));
homeBtn.classList.add('course-menu-btn');
homeBtn.setAttribute('aria-haspopup', 'true');
homeBtn.setAttribute('aria-expanded', 'false');
homeBtn.innerHTML =
'<span class="course-menu-burger" aria-hidden="true"><i></i><i></i><i></i></span>' +
'<span class="course-menu-btn-label">목록</span>';
const currentId = menu.current;
const rows = (menu.lessons || []).map(item => {
const href = item.path ? item.path : (item.id ? '../' + item.id + '/' : '');
const available = !!href;
const isCurrent = available && item.id && item.id === currentId;
const titleText = available ? (item.title || '') : (item.title || '준비 중');
const cls = 'course-menu-item'
+ (isCurrent ? ' is-current' : '')
+ (available ? '' : ' is-locked');
return '<button type="button" class="' + cls + '"'
+ (available && !isCurrent ? ' data-goto="' + esc(href) + '"' : '')
+ (available ? '' : ' disabled aria-disabled="true"') + '>'
+ '<span class="course-menu-no">' + esc(String(item.no ?? '')) + '</span>'
+ '<span class="course-menu-title">' + esc(titleText) + '</span>'
+ (isCurrent ? '<span class="course-menu-now">지금</span>' : '')
+ (available ? '' : '<span class="course-menu-soon">준비 중</span>')
+ '</button>';
}).join('');
const overlay = document.createElement('div');
overlay.className = 'course-menu-overlay';
overlay.innerHTML =
'<div class="course-menu-panel" role="dialog" aria-modal="true" aria-label="차시 목록">'
+ '<div class="course-menu-head">'
+ '<span class="course-menu-grade">' + esc(menu.gradeLabel || '차시 목록') + '</span>'
+ '<button type="button" class="course-menu-close" aria-label="닫기">×</button>'
+ '</div>'
+ '<div class="course-menu-list">' + rows + '</div>'
+ '<div class="course-menu-foot">'
+ '<button type="button" class="course-menu-home">↺ 처음으로</button>'
+ '</div>'
+ '</div>';
app.appendChild(overlay);
const isOpen = () => overlay.classList.contains('is-open');
const open = () => { overlay.classList.add('is-open'); homeBtn.setAttribute('aria-expanded', 'true'); app.classList.add('course-menu-open'); };
const close = () => { overlay.classList.remove('is-open'); homeBtn.setAttribute('aria-expanded', 'false'); app.classList.remove('course-menu-open'); };
homeBtn.onclick = event => { event.preventDefault(); isOpen() ? close() : open(); };
overlay.querySelector('.course-menu-close').addEventListener('click', event => { event.stopPropagation(); close(); });
overlay.querySelector('.course-menu-home').addEventListener('click', () => { window.location.reload(); });
overlay.addEventListener('click', event => {
if (event.target === overlay) { close(); return; }
const go = event.target.closest('[data-goto]');
if (go) window.location.href = go.dataset.goto;
});
document.addEventListener('keydown', event => { if (event.key === 'Escape' && isOpen()) close(); });
})();
  </script>
