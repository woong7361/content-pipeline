<html lang="ko">
<head>

  <link rel="preload" as="image" href="assets/mouse-pointer.webp">
  <style>
    :root{
      /* ── 구조 토큰: 콘텐츠와 무관하게 고정. 값을 바꾸지 않는다 ───────── */
      /* 타이포 사다리 (--fs-sm 37px = 본문 기본)
         16: 초등 저학년 기준으로 사다리 전체를 ×1.2 올렸다(24/28/31/34/38/42/48/72 → 아래).
         개별 선택자에 px를 흩뿌리지 말고 항상 이 사다리를 통해 조정한다. */
      --fs-2xs:29px; --fs-xs:34px; --fs-sm:37px; --fs-md:41px;
      --fs-lg:46px;  --fs-xl:50px; --fs-2xl:57px; --fs-hero:86px;
      /* z-index 레이어 */
      --z-bg:1; --z-scenery:5; --z-content:10; --z-character:12;
      --z-interactive:20; --z-speech:30; --z-hud:40; --z-effect:60;
      --z-drawer:70; --z-flash:90;
      /* 모서리 */
      --r-none:0; --r-sm:8px; --r-md:22px; --r-pill:999px; --r-circle:50%;
      /* 모션 */
      --ease:cubic-bezier(.2,.8,.2,1);        /* 표준 진입/전환 */
      --ease-out:cubic-bezier(.4,0,.8,.2);    /* 퇴장 */
      --ease-back:cubic-bezier(.2,.9,.3,1.18);/* 살짝 튕기는 등장 */
      --ease-speech-pop:cubic-bezier(.36,.07,.19,.97);/* 1-2/01 speechPop */
      --dur-fast:.15s; --dur:.45s; --dur-slow:.65s;
      --dur-hammer:.42s; /* 담장 수리 망치 1회 왕복 */
      --delay-glow:.35s; /* 도입 CTA 글로우 지연 */
      --dur-scene-out:.42s; /* 장면 퇴장 — 01 #app.stage-fade-out .42s */
      --dur-scene-in:.45s; /* 장면 진입 — 01 #app.stage-fade-in .45s */
      --delay-speech:.14s; /* 캐릭터 뒤 말풍선 등장 */
      --delay-progress:.30s; /* 말풍선 뒤 진행 표시 */
      --delay-story-sign-1:0s; /* 수리 이야기 원 표지판 */
      --delay-story-sign-2:.12s; /* 수리 이야기 사각형 표지판 */
      --delay-story-sign-3:.24s; /* 수리 이야기 삼각형 표지판 */
      --delay-completion-title:0s; /* 완료 제목판 공개 */
      --delay-completion-spark:.18s; /* 완료 반짝임 공개 */
      --delay-completion-cta-1:.42s; /* 완료 CTA 순차 공개 1 */
      --delay-completion-cta-2:.54s; /* 완료 CTA 순차 공개 2 */
      --delay-completion-cta-3:.66s; /* 완료 CTA 순차 공개 3 */
      /* 그림자 (고도 3단) */
      --shadow:0 18px 44px rgba(3,29,39,.36);
      --shadow-press:0 8px 0 var(--ink);
      --shadow-flat:0 1px 0 var(--ink);
      --shadow-none:none;
      --ds-sm:drop-shadow(0 6px 8px rgba(0,0,0,.25));
      --ds-md:drop-shadow(0 12px 16px rgba(0,0,0,.3));
      --ds-lg:drop-shadow(0 18px 26px rgba(0,0,0,.38));
      --filter-hover:brightness(1.06);
      --filter-glow-sm:drop-shadow(0 0 12px var(--glow));
      --filter-glow-md:drop-shadow(0 0 18px var(--glow));
      --filter-glow-lg:drop-shadow(0 0 22px var(--glow)) drop-shadow(0 0 38px var(--accent-bright));
      --filter-disabled:grayscale(.78) saturate(.2) brightness(.94);
      --filter-panel-soften:saturate(.82) brightness(1.06); /* 유광 패널을 배경 셀 명암에 가깝게 낮춤 */

      /* ── 팔레트 토큰: art_direction의 맑은 학교 낮 팔레트 ───────── */
      --bg:#49b9ed;
      --surface:#1f73c9;
      --ink:#153f6b;
      --plate-ink:#173f62;
      --accent:#ffd84d;
      --accent-bright:#fff080;
      --glow:#ffe86a;
      --cream:#fff8df;
      --bubble-bg:#fffdf6;  /* 말풍선 바탕 — 1-2/01 .speech 실측값 */
      --bubble-line:#4c3428; /* 말풍선 테두리·꼬리 — 1-2/01 .speech 실측값 */
      --bubble-ink:#221914;  /* 말풍선 본문 — 1-2/01 .speech 실측값 */
      --danger:#e65043;
      --leaf:#67b941;
      --mint:#5ac8ad;
      --sand:#efd19b;
      --purple:#8c68c7;
      /* 22: CSS 도형의 외곽선 색. 각 채움색의 어두운 변형이며 art_direction의 "균일한 중간 두께 외곽선"용 */
      --leaf-line:#3f8a26; --surface-line:#12508f; --danger-line:#a8342a;
      --purple-line:#5f428f; --accent-line:#c9971a;
      --shape-stroke:4%; /* 도형 선 두께. 박스 대비 비율이라 96px/112px/150px에서 같은 비율로 보인다 */
      /* 20: 더해지는 대상 표시. 오답 피드백 빨강(--danger)과 겹치지 않게 파랑 계열로 둔다 */
      --mark-add:var(--surface); --mark-add-glow:rgba(31,115,201,.45);
      --warm-ink:#7b4626; /* 활동 전환 CTA 참조의 따뜻한 외곽선 */
      --brown-900:#422006; /* topbar 글자 강조 */
      --brown-800:#713f12; /* topbar 기본 글자 */
      /* 1-2/01 시작하기 CTA 실측 색 (getComputedStyle 기준) */
      --cta-amber-1:#fef08a; --cta-amber-2:#facc15; --cta-amber-3:#eab308; --cta-amber-4:#ca8a04;
      --cta-amber-edge:rgba(161,98,7,.52);
      --white:#ffffff;
      --veil:rgba(255,255,255,.92);
      --dim:rgba(21,63,107,.45);
      --clear:rgba(255,255,255,0);
      /* 1-2/01과 동일한 서체. 01은 html,body,button에 Jua를 걸고 Noto Sans KR은 폴백으로만 쓴다
         (13번째 줄 style의 Noto Sans KR 선언은 15번째 줄 Jua 선언에 덮여 죽어 있다 — 실측 확인) */
      --font-body:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
      --font-topbar:var(--font-body); /* 01 topbar도 Jua다 */
      --font-title:var(--font-body);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:var(--font-body);color:var(--plate-ink);background:var(--bg)}
    button,input,textarea,select{font:inherit;color:inherit} /* 01과 동일: 폼 요소도 Jua 상속 */
    #viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
    #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;isolation:isolate;container-type:size;container-name:stage;background:var(--cream)}
    .scene{position:absolute;inset:0;z-index:var(--z-bg);display:none;opacity:0;overflow:hidden;background:var(--cream)}
    /* 5: 1-2/01의 전환을 그대로 맞춘다. 01 기본은 페이드(#app.stage-fade-out/.stage-fade-in),
       data-transition="slide"일 때만 전폭 슬라이드(stageSlideOutRight/stageSlideInRight)다.
       08은 정적 씬 구조라 #app 대신 .scene에 걸되 키프레임 이름과 지속시간은 01과 같게 둔다. */
    .scene.active{display:block;opacity:1;animation:stageFadeIn var(--dur-scene-in) ease both}
    .scene.leaving{display:block;animation:stageFadeOut var(--dur-scene-out) ease both;pointer-events:none}
    @keyframes stageFadeIn{from{opacity:0}to{opacity:1}}
    @keyframes stageFadeOut{from{opacity:1}to{opacity:0}}
    #stage[data-transition="slide"] .scene.active{animation:stageSlideInRight var(--dur-scene-out) ease both}
    #stage[data-transition="slide"] .scene.leaving{opacity:1;animation:stageSlideOutRight var(--dur-scene-out) ease both}
    @keyframes stageSlideOutRight{from{transform:translateX(0)}to{transform:translateX(100%)}}
    @keyframes stageSlideInRight{from{transform:translateX(-100%)}to{transform:translateX(0)}}
    .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:var(--z-bg)}
    /* 담장 수리 연출. 무너진 구간은 school-wall-damaged.webp에서 실측한 stage x 1160~1550 / y 620~792 구간이다.
       damaged/repaired 두 배경은 담장 전체 텍스처가 미묘하게 달라 부분 와이프를 하면 이음새가 보인다 → 전체 크로스페이드로 간다. */
    #introBgRepaired{opacity:0;transition:opacity var(--dur-slow) var(--ease)}
    .repair-fx{position:absolute;inset:0;z-index:var(--z-content);pointer-events:none}
    .repair-hammer{position:absolute;left:1250px;top:485px;width:300px;height:300px;object-fit:contain;transform-origin:90% 12%;filter:var(--ds-md);animation:hammerSwing var(--dur-hammer) var(--ease) infinite}
    @keyframes hammerSwing{0%{transform:rotate(50deg)}42%{transform:rotate(8deg)}56%{transform:rotate(16deg)}100%{transform:rotate(50deg)}}
    .repair-impact{position:absolute;left:1240px;top:595px;width:120px;height:120px;border-radius:var(--r-circle);background:radial-gradient(circle,var(--accent-bright) 0%,var(--accent) 42%,transparent 70%);opacity:0}
    .repair-impact.hit{animation:repairImpact var(--dur) var(--ease-back) both}
    @keyframes repairImpact{0%{opacity:0;transform:scale(.4)}35%{opacity:.92;transform:scale(1.15)}100%{opacity:0;transform:scale(1.55)}}
    .shade{position:absolute;inset:0;background:var(--dim);z-index:var(--z-scenery);opacity:.34}
    .cta,.choice,.key,.tool,.confirm-btn{border:4px solid var(--surface);border-radius:var(--r-pill);background:var(--cream);box-shadow:var(--shadow-press);cursor:pointer;transition:transform var(--dur-fast) var(--ease),filter var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
    .cta:hover,.choice:hover,.key:hover,.tool:hover,.confirm-btn:hover{filter:var(--filter-hover);transform:translateY(-3px)}
    .cta:active,.choice:active,.key:active,.tool:active,.confirm-btn:active{transform:translateY(7px);box-shadow:var(--shadow-flat)}
    /* ── 상단 헤더(topbar): 1-2/01과 동일 양식 ───────── */
    .topbar{font-family:var(--font-topbar);position:absolute;left:0;right:0;top:0;height:56px;z-index:var(--z-hud);display:flex;align-items:center;justify-content:space-between;gap:clamp(12px,1.4cqw,18px);padding:0 clamp(18px,2cqw,26px);background:linear-gradient(180deg,rgba(255,253,244,.94),rgba(255,250,232,.82));backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid rgba(113,63,18,.16);box-shadow:0 4px 14px rgba(66,32,6,.08)}
    .topbar-left{position:relative;z-index:2;display:flex;align-items:center;gap:clamp(9px,1cqw,14px);min-width:0}
    .btn-home{height:34px;min-width:98px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px 1px 12px;border:1px solid rgba(146,64,14,.22);border-radius:var(--r-pill);background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,247,214,.78));color:var(--brown-800);font-size:14px;font-weight:900;line-height:1;text-shadow:0 1px 0 rgba(255,253,230,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 7px rgba(66,32,6,.08);cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease}
    .btn-home:hover{transform:translateY(-1px);border-color:rgba(146,64,14,.34);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(254,240,138,.9));color:var(--brown-900);box-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 4px 10px rgba(66,32,6,.12)}
    .btn-home:active{transform:translateY(0);box-shadow:inset 0 2px 4px rgba(66,32,6,.12)}
    .btn-home:focus-visible{outline:3px solid rgba(14,165,233,.35);outline-offset:3px}
    .course-menu-btn{display:inline-flex;align-items:center;gap:8px}
    .course-menu-btn-label{font-weight:1000}
    .course-menu-burger{display:inline-flex;flex-direction:column;justify-content:center;gap:3px;width:17px;height:14px}
    .course-menu-burger i{display:block;height:2.5px;border-radius:2px;background:currentColor}
    .course-menu-overlay{position:absolute;inset:0;z-index:var(--z-drawer);display:flex;align-items:stretch;justify-content:flex-start;background:rgba(20,12,4,0);visibility:hidden;pointer-events:none;transition:background .24s ease,visibility 0s linear .28s}
    .course-menu-overlay.is-open{background:rgba(20,12,4,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);visibility:visible;pointer-events:auto;transition:background .24s ease,visibility 0s}
    .course-menu-panel{display:flex;flex-direction:column;width:min(400px,40cqw);height:100%;max-height:100%;overflow:auto;border:0;border-right:3px solid #6a3d16;border-radius:0;background:linear-gradient(180deg,#fff7e6,#f6e4c0);box-shadow:14px 0 36px rgba(20,12,4,.34),inset 0 1px 0 rgba(255,255,255,.7);transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
    .course-menu-overlay.is-open .course-menu-panel{transform:translateX(0)}
    .course-menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:clamp(8px,1cqh,12px) clamp(14px,1.6cqw,20px);border-bottom:2px solid rgba(106,61,22,.24);position:sticky;top:0;background:linear-gradient(180deg,#fff7e6,#fdf0d6)}
    .course-menu-grade{font-size:clamp(13px,2.7cqh,20px);font-weight:900;color:#5a3512}
    /* 92: × 를 버튼 중앙에 두려면 `display:grid;place-items:center;padding:4px 0 0`가 셋 다 필요하다(01에서 이식할 때 셋 다 없었다).
       가로 — UA 기본 `padding:1px 6px` + border-box면 콘텐츠 폭이 30−4−12 = 14px인데 × 의 advance는 20px이다.
       글자가 콘텐츠 박스보다 넓으면 text-align:center가 음수 오프셋을 못 내고 오른쪽으로 흘러넘친다.
       세로 — 버튼은 라인박스만 중앙에 놓는데 Jua의 × 는 잉크 중심이 라인박스 중심보다 위에 있다(28px에서 2.5px, 20px에서 1.8px).
       상단 패딩이 콘텐츠 중심을 그 절반만큼 내려 상쇄한다. **서체·박스·글자 크기 중 하나라도 바꾸면 이 값을 다시 잰다**
       (`node tmp/measure-menu-close.js` — 잉크 bbox 기준, 라인박스 rect로는 못 잡는다). 93번으로 42px → 01과 같은 30px이 되며 5px → 4px이 됐다. */
    .course-menu-close{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;padding:4px 0 0;border:2px solid rgba(106,61,22,.5);border-radius:9px;background:rgba(255,255,255,.6);color:#5a3512;font-size:20px;line-height:1;font-weight:900;cursor:pointer}
    .course-menu-close:hover{background:#fff}
    .course-menu-list{display:flex;flex-direction:column;gap:clamp(2px,.55cqh,7px);padding:clamp(6px,1.1cqh,13px) clamp(12px,1.4cqw,16px)}
    .course-menu-item{display:flex;align-items:center;gap:clamp(10px,1.2cqw,15px);width:100%;text-align:left;padding:clamp(3px,.7cqh,9px) clamp(12px,1.3cqw,16px);border:2px solid rgba(106,61,22,.28);border-radius:13px;background:rgba(255,255,255,.55);color:#40260f;font-weight:900;cursor:pointer;transition:transform .14s ease,background .14s ease,border-color .14s ease}
    .course-menu-item:hover:not(:disabled){background:#fff;border-color:rgba(106,61,22,.55);transform:translateY(-1px)}
    .course-menu-no{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:clamp(18px,4.3cqh,34px);height:clamp(18px,4.3cqh,34px);border-radius:var(--r-circle);background:linear-gradient(180deg,#ffdf8f,#efb14e);border:2px solid #8a5320;color:#4a2b12;font-size:clamp(12px,2.4cqh,18px);font-weight:900}
    .course-menu-title{flex:1 1 auto;min-width:0;font-size:clamp(12px,2.4cqh,18px);line-height:1.22;word-break:keep-all;overflow-wrap:break-word}
    .course-menu-now{flex-shrink:0;padding:2px 9px;border-radius:var(--r-pill);background:#e5482f;color:#fff;font-size:clamp(10px,2cqh,14px);font-weight:900;box-shadow:0 2px 6px rgba(180,40,20,.4)}
    .course-menu-soon{flex-shrink:0;padding:2px 9px;border-radius:var(--r-pill);background:rgba(90,53,18,.14);color:#7a5124;border:1px dashed rgba(106,61,22,.5);font-size:clamp(10px,2cqh,14px);font-weight:900}
    .course-menu-item.is-current{background:linear-gradient(180deg,#fff3d0,#ffe3a6);border-color:#d98a2b;box-shadow:0 0 0 2px rgba(217,138,43,.35),0 4px 10px rgba(120,70,20,.18);cursor:default}
    .course-menu-item.is-locked{opacity:.72;cursor:default}
    .course-menu-item.is-locked .course-menu-no{background:rgba(120,95,60,.25);border-color:rgba(106,61,22,.4);color:#7a5124}
    .course-menu-item.is-locked .course-menu-title{color:#8a6a40}
    .course-menu-foot{margin-top:auto;position:sticky;bottom:0;padding:clamp(8px,1.1cqh,13px) clamp(12px,1.4cqw,16px);border-top:2px solid rgba(106,61,22,.24);background:linear-gradient(180deg,#fdf0d6,#f6e4c0)}
    .course-menu-home{width:100%;padding:clamp(6px,1cqh,11px) 0;border:2px solid rgba(106,61,22,.45);border-radius:12px;background:rgba(255,255,255,.7);color:#5a3512;font-size:clamp(12px,2.4cqh,17px);font-weight:900;cursor:pointer;transition:background .14s ease,transform .14s ease}

    /* 01 시작하기 CTA 실측값(1366 기준 547×64, 27px/31.86) × 1.4056 이식. 서체는 01과 같은 Jua */
    #introStart{position:relative;overflow:hidden;width:769px;min-width:0;min-height:82px;margin-top:19px;padding:18px 48px 21px;display:flex;align-items:center;justify-content:center;border:3px solid var(--cta-amber-edge);border-radius:var(--r-pill);background:linear-gradient(180deg,rgba(255,255,255,.68) 0%,rgba(255,255,255,.14) 34%,rgba(255,255,255,0) 52%),linear-gradient(180deg,var(--cta-amber-1) 0%,var(--cta-amber-2) 36%,var(--cta-amber-3) 72%,var(--cta-amber-4) 100%);font-family:var(--font-title);font-size:38px;line-height:1.18;color:var(--brown-800);text-shadow:0 1px 0 rgba(255,253,230,.95);box-shadow:inset 0 4px 0 rgba(255,255,255,.56),inset 0 -6px 0 rgba(120,53,15,.12),0 6px 0 rgba(120,53,15,.28),0 11px 31px rgba(66,32,6,.18);animation:ctapulse 2s ease-in-out infinite}

       크기를 px로 두 벌 쓰지 않고 --char-scale 하나로 모든 변형(left/right/small/feedback)에 건다.

    /* 1-2/01의 .speech를 이식. 값은 01에서 getComputedStyle로 실측한 뒤 1920/1366 = ×1.4056 적용했다(소스 순서로 읽으면 틀린다).

       씬별로 다른 것은 앵커 좌표(left/right/top)뿐이다. **씬별 폭·패딩 보정을 다시 넣으면 자동 조정이 깨진다.** */
    .speech{position:absolute;z-index:var(--z-speech);width:max-content;max-width:990px;padding:20px 40px;text-align:left;background:var(--bubble-bg);border:6px solid var(--bubble-line);border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.18);color:var(--bubble-ink);font-size:var(--fs-xs);font-weight:400;line-height:1.4;word-break:keep-all;text-wrap:balance;white-space:pre-line;animation:speechPop var(--dur) var(--ease-speech-pop) both}

    /* 83: 세로 앵커는 **얼굴 중심 y(--speech-face-y)** 하나다. `top`으로 상자 윗변을 잡던 57번 방식을 갈아엎었다.
       57번은 기준점이 "머리 꼭대기"였고 앵커가 **상자 윗변**이었다 — 꼬리는 `::before{top:50%}`(상자 세로 중심)라
       대사 줄 수가 늘면 상자가 아래로 자라 꼬리가 그만큼 내려간다. 같은 씬 안에서도 beat마다 높이가 달라졌다.

       대사가 길어지면 상자가 위아래로 **같이** 자라므로 꼬리는 그대로 얼굴에 남는다.
       **`transform:translateY(-50%)`로 적지 않는다** — speechPop이 `transform:scale()`을 애니메이션해서 덮어쓴다
       (377행 `.narration-advance` 주석이 적어 둔 것과 같은 함정). `translate`는 독립 속성이라 `transform`과 합성된다.

         어른 worker-idle .132 / worker-explaining .146 / worker-apologizing .137 / teacher-idle .137 /
              teacher-explaining .137 / teacher-praising .135   (원본 1024x1536 높이 대비 비율)
         아이 student-idle .215 / student-thinking .213 / student-volunteer .212   (93번 재실측. idle만 .214 → .215, 렌더 0.6px이라 707 유지)
       `.character.left/.right`(440x720, bottom −12) 환산 → contain 렌더 y 402~1062 → **어른 얼굴 y 489~498, 대표 492**.
       아이는 `--char-scale:.7`이라 렌더 y 609~1071 → **얼굴 y 707**. 씬별 오버라이드도 이 변수만 바꾼다. */
    .speech{--speech-face-y:492px;--speech-side-x:390px}
    .speech.left-speaker{left:var(--speech-side-x);top:var(--speech-face-y);translate:0 -50%}
    .speech.left-speaker::before{left:-34px;transform:translateY(-17px);border-right-color:var(--bubble-line)}
    .speech.left-speaker::after{left:-22px;transform:translateY(-14px);border-right-color:var(--bubble-bg)}
    .speech.right-speaker{right:var(--speech-side-x);top:var(--speech-face-y);translate:0 -50%}
    .speech.right-speaker::before{right:-34px;transform:translateY(-17px);border-left-color:var(--bubble-line)}
    .speech.right-speaker::after{right:-22px;transform:translateY(-14px);border-left-color:var(--bubble-bg)}
    /* 42-c: 인물 **위**에서 아래로 꼬리를 내리는 변형. 1-2/01의 하단 변형과 같은 2겹 구조다.
       옆 변형을 쓸 수 없는 자리에서 쓴다 — 씬4는 인물(x 1569~1820) 왼쪽이 전부 문제 패널이라
       얼굴 높이에 옆으로 붙이면 말풍선이 보기 버튼을 덮는다.
       꼬리 오프셋은 옆 변형과 같은 계산이다(::before 테두리 17 → 34, ::after 14 → 22, 가로 중심 보정 +3). */
    /* 83(57 대체): 38번은 가로만 보정해 아이 말풍선이 어른 높이에 떠 있었다. 57번은 "머리 꼭대기 차이 205px"로
       내렸지만 기준점이 머리였다 — 지금은 아이 얼굴 중심 **707px**을 그대로 준다(어른 492 대비 +215). */
    .character[src*="student-"] + .speech{--speech-face-y:707px}
    /* 85(38 대체): 가로 앵커는 **말풍선이 실제로 걸리는 y 밴드 안 실루엣 가장자리 + 60px**이다.
       38번은 "꼬리 끝이 **전신** 알파 bbox 안에 들어오는가"만 봤다. 전신 bbox는 들어올린 팔·벌린 발까지
       포함한 좌우 끝이라 얼굴 높이의 실루엣과 다르고, 그래서 **상자가 인물 위로 올라타는 것을 못 잡았다** —
       `student-volunteer`.right는 말풍선 오른쪽 끝 1670이 실루엣 시작 1612를 **58px 파고들어** 든 팔을 덮었다.
       밴드는 얼굴 중심 ± 말풍선 최대 반높이(121px = 4줄 242px의 절반)이고, 그 안에서 다시 쟀다(`tmp/measure-side.js`).
       실루엣이 에셋마다 75px까지 차이 나므로(worker-apologizing 301 ↔ worker-explaining 376) **묶어서 한 값을 줄 수 없다** —
       한 값으로 맞추면 좁은 인물에서 꼬리가 100px 넘게 떠 "누가 말하는지" 신호가 끊긴다. 그래서 에셋·방향별로 준다.
       `left`/`right`를 직접 쓰지 않고 변수(`--speech-side-x`)로 주는 이유는 57번 교훈이다 — 명시도 싸움이 붙지 않는다.
         밴드 안 실루엣(stage) → 앵커 = 실루엣 ∓ 60
         .left  worker-apologizing …301 → 361 / worker-explaining …376 → 436
                student-thinking …258 → 318 / student-idle …287 → 347
         .right teacher-explaining 1556… → 424 / teacher-praising 1624… → 356
                student-volunteer 1612… → 368 / student-idle 1652… → 328
       꼬리는 34px이라 실루엣까지 26px을 남기고 멈춘다 — 가리키되 덮지 않는다.
       **인물 에셋을 바꾸거나 `--char-scale`을 건드리면 이 표를 다시 잰다.**
       93: 아이 3종을 페인터 버전(롤러 + 멜빵 얼룩)으로 교체하고 재실측했다. 값이 1~4px만 움직인 것은
       **롤러를 내린 손에 아래로 들려 밴드(얼굴 중심 ±402px 원본 기준) 밖에 두었기 때문**이다.
       1차 시안처럼 롤러를 어깨 높이로 세우면 밴드 안으로 들어와 이 표가 크게 흔들린다. */
    .character[src*="worker-apologizing"].left + .speech{--speech-side-x:361px}
    .character[src*="worker-explaining"].left + .speech{--speech-side-x:436px}
    .character[src*="student-thinking"].left + .speech{--speech-side-x:318px}
    .character[src*="student-idle"].left + .speech{--speech-side-x:347px}
    .character[src*="student-idle"].right + .speech{--speech-side-x:328px}
    .character[src*="student-volunteer"].right + .speech{--speech-side-x:368px}
    .character[src*="teacher-explaining"].right + .speech{--speech-side-x:424px}
    .character[src*="teacher-praising"].right + .speech{--speech-side-x:356px}
    .speech.top-speaker::before,.speech.top-speaker::after{top:auto;transform:none}
    .speech.top-speaker::before{right:60px;bottom:-34px;border-top-color:var(--bubble-line)}
    .speech.top-speaker::after{right:63px;bottom:-22px;border-top-color:var(--bubble-bg)}
    @keyframes speechPop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
    /* 15·17: 1-2/01의 말풍선 안 진행 버튼을 클래스명·구조·애니메이션 이름 그대로 이식.
       01은 cqw/cqh(컨테이너 단위)로 적혀 있고 08의 #stage도 container-type:size라
       값을 그대로 옮기면 1366→1920 환산(×1.4056)이 자동으로 이뤄진다. 픽셀로 다시 계산하지 말 것.
       (음소거 버튼은 08 topbar에 .header-voice-volume-button으로 이미 있어 이식 대상이 아니다.
        01의 .repair-narr-replay는 08에 나레이션 오디오 자산이 없어 제외했다.) */
    .repair-bubble-nav{display:flex;align-items:center;justify-content:flex-end;gap:.7cqw;margin-top:1cqh;width:100%;pointer-events:auto}
    .repair-narr-next{display:inline-flex;align-items:center;gap:.25cqw;line-height:1;cursor:pointer;padding:.55cqh 1.15cqw;border-radius:var(--r-pill);border:.18cqw solid #a8690f;background:linear-gradient(#ffe066,#ffb424);color:#5a3505;font-family:var(--font-body);font-size:1.5cqw;font-weight:400;letter-spacing:-.02em;text-shadow:0 .08cqh 0 rgba(255,255,255,.5);box-shadow:0 .3cqh 0 rgba(122,82,34,.42),inset 0 .16cqh 0 rgba(255,255,255,.6);animation:repairNarrNextPulse 1.8s ease-in-out infinite;transition:filter .15s,transform .08s}
    .repair-narr-next:hover{filter:brightness(1.06);transform:translateY(-.15cqh)}
    .repair-narr-next:active{transform:translateY(.15cqh)}
    @keyframes repairNarrNextPulse{0%,100%{box-shadow:0 .3cqh 0 rgba(122,82,34,.42),inset 0 .16cqh 0 rgba(255,255,255,.6),0 0 0 0 rgba(240,180,41,.55)}50%{box-shadow:0 .3cqh 0 rgba(122,82,34,.42),inset 0 .16cqh 0 rgba(255,255,255,.6),0 0 0 .95cqw rgba(240,180,41,0)}}
    @keyframes pop{from{opacity:0;transform:scale(.88) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .character.stagger-character{animation:characterEnter var(--dur-scene-in) var(--ease) both}
    .speech.stagger-speech{animation:speechPop var(--dur-scene-in) var(--ease-speech-pop) both}
    @keyframes characterEnter{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
    #drawingTeacher.drawing-enter{animation:drawingTeacherEnter var(--dur-scene-in) var(--ease) both}
    @keyframes drawingTeacherEnter{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:translateX(0)}}
    .tap-layer{position:absolute;inset:142px 0 0;z-index:var(--z-interactive);cursor:pointer}
    .panel{position:absolute;z-index:var(--z-content);background:var(--veil);border:5px solid var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}
    .question-panel{left:150px;top:200px;width:1080px;min-height:720px;padding:42px}
    .question-panel.wide{left:180px;width:1560px}
    /* 16: 사다리를 올린 뒤 좁은 키패드 패널에서 "3개를 더 색 / 칠하면"처럼 단어 중간이 끊겼다.
       한국어는 keep-all이 기본이어야 하고, 키패드 안 프롬프트는 사다리에서 한 단계 낮춰 잡는다(개별 px를 쓰지 않는다). */
    .prompt{font-size:var(--fs-xl);font-weight:900;line-height:1.38;text-align:center;white-space:pre-line;word-break:keep-all;text-wrap:balance;color:var(--ink);margin:0 0 28px}
    .keypad-wrap .prompt{font-size:var(--fs-md)}
    .question-id{display:none}
    /* 찾을 도형 사물. 배경에 굳히지 않고 개별 투명 PNG로 얹어 위치·난이도를 좌표로 조정한다. */
    /* 36: 찾기 표시의 대상은 요소 박스가 아니라 **그림의 알파 실루엣**이다.
       예전에는 .hotspot의 사각 테두리를 켰는데, 그 박스는 손으로 잡은 사각형이라
       삼각자·고깔모자처럼 실루엣이 사각형과 다른 사물에서 테두리가 사물보다 크거나 어긋났다.
       filter의 drop-shadow는 알파를 따라가므로 4방향으로 겹쳐 아웃라인을 만든다(체이닝이라 링이 닫힌다).
       한 요소에 filter 선언을 두 벌 쓸 수 없으므로(24번 — .on-desk 접지 그림자와 같은 속성)
       아웃라인과 그림자를 각각 변수로 두고 **한 선언에서 합친다.** 새 그림자를 넣을 때도 --obj-shadow만 바꾼다. */
    .find-object{--obj-shadow:var(--ds-sm);position:absolute;object-fit:contain;filter:var(--obj-outline,) var(--obj-shadow);pointer-events:none;transition:filter var(--dur-fast) var(--ease)}
    /* 24: 책상 상판에 놓인 사물의 접지 그림자. .find-object가 <img>라 ::after를 못 달아
       래퍼 없이 drop-shadow를 짧고 진한 아래 그림자로 쓴다.
       배경 책상 상판은 하이앵글(깊이 압축비 0.18)이라 그림자도 낮고 옆으로 퍼져야 한다. */
    .find-object.on-desk{--obj-shadow:drop-shadow(0 6px 5px rgba(76,52,40,.34)) drop-shadow(0 2px 1px rgba(76,52,40,.22))}
    /* 세 상태(hover·3회 오답 공개·정답)가 같은 아웃라인 레시피를 쓰고 색만 다르다.
       .glow-found를 뒤에 두어 정답으로 확정된 사물은 hover 중에도 초록으로 남는다. */
    .find-object.glow-hover,.find-object.glow-hint{--glow-c:var(--accent)}
    .find-object.glow-found{--glow-c:var(--leaf)}
    .find-object.glow-hover,.find-object.glow-hint,.find-object.glow-found{--obj-outline:drop-shadow(5px 0 0 var(--glow-c)) drop-shadow(-5px 0 0 var(--glow-c)) drop-shadow(0 5px 0 var(--glow-c)) drop-shadow(0 -5px 0 var(--glow-c)) drop-shadow(0 0 16px var(--glow-c))}
    /* 24: 눕히기를 CSS transform(rotateX)으로 하는 A안은 폐기했다. 사용자 판정 "너무 눕혀져 있다".
       배경 상판의 실제 압축비(0.18)에 맞출수록 저학년이 ■로 읽지 못해, 원근 정합보다 모양 인지가
       우선인 문제였다. 지금은 classroom-notebook.webp 자체를 3/4 하이앵글로 다시 그려 쓴다
       (세로/가로 0.60). 다시 CSS로 눕히려 하지 말 것 — 같은 판정을 반복하게 된다. */
    /* 36: 핫스팟은 이제 **클릭 영역일 뿐**이고 보이는 표시는 전부 .find-object의 실루엣 글로우가 낸다.
       hover/hint/found 상태는 renderSearch·revealSearchAnswers·selectHotspot이 setObjectGlow()로 그림에 옮긴다.
       여기에 border-color를 다시 넣으면 사각 테두리가 되살아난다. */
    .hotspot{position:absolute;z-index:var(--z-interactive);border:0;background:var(--clear);border-radius:var(--r-md);cursor:pointer}
    .hotspot.current-target{z-index:var(--z-effect)}
    /* 91: left/top은 positionHotspotNumber()가 px로 덮는다(핫스팟 박스 중심이 아니라 사물 그림의 도형 중심).
       여기 50%는 JS가 아직 안 돈 순간의 폴백일 뿐이다 — 자리를 옮기려면 findObjects의 numberAnchor를 고친다. */
    .hotspot-number{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:72px;height:72px;border-radius:var(--r-circle);background:var(--accent);color:var(--ink);font-size:var(--fs-xl);font-weight:900;filter:var(--ds-sm);pointer-events:none}
    .search-prompt{position:absolute;left:50%;top:90px;z-index:var(--z-speech);transform:translateX(-50%);min-width:780px;padding:20px 36px;text-align:center;background:var(--veil);border:5px solid var(--surface);border-radius:var(--r-pill);box-shadow:var(--shadow);font-size:var(--fs-xl);font-weight:900}
    #shapeSearch{position:absolute;inset:0;z-index:var(--z-interactive);cursor:crosshair}
    .feedback-mark{position:absolute;left:50%;top:48%;z-index:var(--z-effect);transform:translate(-50%,-50%) scale(0);width:240px;height:240px;object-fit:contain;filter:var(--ds-lg);opacity:0;pointer-events:none}
    .feedback-mark.show{animation:stamp var(--dur-slow) var(--ease-back) both}
    @keyframes stamp{45%{opacity:1;transform:translate(-50%,-50%) scale(1.22) rotate(-8deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}}
    /* 60: 원문이 **내레이션**으로 지정한 `정답입니다`는 화자를 세우지 않는다(도장 + 음성만).
       그러면 17·26번이 요구하는 "사람이 볼 수 있는 진행 표면"이 사라지므로 그 자리를 이 요소가 받는다.
       **말풍선이 아니다** — 배경·테두리·꼬리가 없고 `다음 ▸` 버튼만 담는다(꼬리를 두면 없는 화자를 가리킨다).
       도장(.feedback-mark: left 50% / top 48% / 240px → y 398~638) 바로 아래 중앙에 둔다. */
    /* 가운데 정렬에 `translateX(-50%)`를 쓰지 않는다 — speechPop 키프레임의 `transform:scale()`이 덮어써
       중심이 절반 폭만큼 오른쪽으로 밀린다. `left/right:0` + `width:max-content` + `margin:0 auto`로 잡으면
       transform이 비어 있어 애니메이션과 충돌하지 않고, 클릭 면도 버튼 크기로만 남는다. */
    .narration-advance{position:absolute;left:0;right:0;top:652px;z-index:var(--z-speech);width:max-content;margin:0 auto;cursor:pointer;animation:speechPop var(--dur) var(--ease-speech-pop) both}
    .narration-advance .repair-bubble-nav{justify-content:center;margin-top:0}
    /* 28: 세로 앵커는 담장 면(school-wall-closeup.webp → stage y 367~878)의 중앙 622에 맞춘다.
       예전 top:250(박스 중앙 535)에서는 12개(3행, 높이 486)일 때 1행이 담장 캡·하늘로 75px 올라갔다.
       top:338 → 3행 380~866 / 2행 463~781로 둘 다 면 안이다. 도형 크기는 줄일 필요가 없다.
       이 박스는 #paintIntroVisual·#countShapes·#arithShapes·#randomShapes가 공유한다.
       #randomShapes는 배경 면이 달라 아래에서 좌표를 통째로 오버라이드한다(29번). */
    /* 46: align-content:center는 **개수가 바뀔 때마다 첫 줄의 y가 움직인다**(3행 380 / 2행 463).
       튜토리얼은 한 화면에서 10 → 12개로 늘어나므로 이미 놓인 도형까지 통째로 밀려 올라갔다.
       위 정렬로 바꾸고 top을 28번의 3행 시작점(380)에 맞춰 354(= 380 - padding 26)로 내린다.
       → 행이 몇 줄이든 첫 줄은 항상 380에서 시작하고, 3행 하단 866은 28번과 같다.
       #paintIntroVisual만 한 줄짜리 짝 배치라 40번이 잡은 세로 중앙을 그대로 둔다(아래에서 되돌린다). */
    .work-area{position:absolute;z-index:var(--z-content);left:150px;top:354px;width:1050px;height:570px;display:grid;grid-template-columns:repeat(5,1fr);align-content:start;gap:18px;padding:26px}
    /* 22: 도형을 raster 스프라이트 대신 HTML/CSS로 그린다. 8번이 넣었던
       shape-tile-body.webp + background-blend-mode + mask-image 우회는 여기서 전부 걷어냈다
       (색이 도형 밖으로 새는 문제가 raster를 쓸 때만 생기던 것이라 우회 자체가 불필요해졌다).
       ::before가 외곽선, ::after가 채움이고 ::after만 선 두께(--shape-stroke)만큼 안쪽으로 들어간다.
       요소 자신은 배경이 없으므로 filter의 drop-shadow·glow가 도형 실루엣을 그대로 따라간다. */
    .paint-shape{position:relative;height:150px;aspect-ratio:1;justify-self:center;--shape-fill:var(--leaf);--shape-line:var(--leaf-line);filter:var(--ds-sm);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
    .paint-shape::before,.paint-shape::after{content:'';position:absolute;inset:0}
    .paint-shape::before{background:var(--shape-line)}
    .paint-shape::after{background:var(--shape-fill);inset:var(--shape-stroke)}
    .paint-shape.circle::before,.paint-shape.circle::after{border-radius:var(--r-circle)}
    .paint-shape.square::before,.paint-shape.square::after{border-radius:9%}
    /* 삼각형은 border가 clip-path에 잘려 선을 만들 수 없다. 안쪽 폴리곤을 내심 기준으로 축소해 선 두께를 낸다.
       (밑변 100%·높이 100% 이등변삼각형의 내접원 반지름 r=30.9%, 4% 안쪽 → 배율 (30.9-4)/30.9=0.8706) */
    .paint-shape.triangle::before{clip-path:polygon(50% 0%,100% 100%,0% 100%)}
    .paint-shape.triangle::after{inset:0;clip-path:polygon(50% 8.94%,93.53% 96%,6.47% 96%)}
    .paint-shape.green{--shape-fill:var(--leaf);--shape-line:var(--leaf-line)}
    .paint-shape.blue{--shape-fill:var(--surface);--shape-line:var(--surface-line)}
    .paint-shape.red{--shape-fill:var(--danger);--shape-line:var(--danger-line)}
    .paint-shape.purple{--shape-fill:var(--purple);--shape-line:var(--purple-line)}
    .paint-shape.yellow{--shape-fill:var(--accent);--shape-line:var(--accent-line)}
    .paint-shape.removed{opacity:.18;transform:scale(.78)}
    .paint-shape.pending{opacity:0;transform:scale(.78)}
    .paint-shape.hint-step{filter:var(--filter-glow-lg)}
    /* 20: 더해지는 대상 표시. .removed(빼기)와 대칭이 되게 "네모로 묶고 glow"를 건다.
       요소에 배경이 없어 box-shadow가 도형을 감싸는 사각 테두리로 보인다. 색은 오답 빨강과 겹치지 않는 파랑이다. */
    .paint-shape.added{border-radius:12%;box-shadow:0 0 0 5px var(--mark-add),0 0 22px 8px var(--mark-add-glow);animation:shapeAddIn var(--dur) var(--ease-back) both}
    @keyframes shapeAddIn{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
    /* 39: 통 앞면에 색을 얹는다. 에셋(paint-can-body.webp)은 alt대로 "덧씌울 수 있도록 앞면을 비운" 1종뿐이라
       색상별 raster를 3벌 만들지 않고 CSS 오버레이로 낸다(22번 — 색 면 자체는 raster로 만들지 않는다).
       색 면 좌표는 1254x1254 에셋 실측이다 — 손잡이 아치의 윗선이 x 380~860 구간에서 y 835 아래로만 지나가고
       뚜껑 테두리 아래 첫 평면이 y 470이다 → 안전면 x 0.30~0.69 / y 0.38~0.65(아래 "크림 면 비율" 표에 기록).
       .paint-can이 <img>에서 래퍼로 바뀌었으므로 .empty/.arriving도 래퍼에 붙는다(그림·색 면이 함께 변한다). */
    /* left는 세기 단계(#paintCan)용이다. 예전 1202는 .keypad-wrap(x 1305~1815) 뒤에 절반이 깔려 있었는데,
       39번으로 색 면이 생기면서 그 잘림이 눈에 띄게 됐다 → 패널 왼쪽(x 1000~1276)으로 옮긴다.
       왼쪽 한계는 #countShapes 4번째 칸의 도형 오른쪽 끝 x≈943이다(이 씬의 최대 개수는 4). */
    .paint-can{display:block;position:absolute;z-index:var(--z-content);left:1000px;bottom:80px;width:276px;height:276px;filter:var(--ds-md)}
    .paint-can-img{display:block;width:100%;height:100%;object-fit:contain}
    /* 50: 39번의 색 면은 정면 직사각형(border-radius만 준 사각형)이라 원통 위에 붙인 스티커로 읽혔다.
       세 가지를 함께 고친다.
       (1) **모양** — 위·아래 가장자리를 통의 림 곡선과 같은 방향(가운데가 내려앉는 아치)으로 깎는다.
           원통 옆면의 가로 띠는 시점상 앞쪽(가운데)이 아래로 처져 보인다. border-radius로는 이 초승달
           형태를 만들 수 없어 %기반 polygon으로 두 아치를 샘플링했다(%라서 통 크기 276/250/200 전부 따라온다).
       (2) **테두리** — clip-path가 border를 잘라 없애므로 22번 .paint-shape와 같은 2겹 기법으로 바꾼다.
           ::before가 선 색, ::after가 채움이고 같은 clip을 쓰되 ::after만 1%(약 2~3px) 안쪽에 있다.
       (3) **명암·기울기** — 가로 그라데이션으로 원통 셰이딩을 주고(에셋 하이라이트가 왼쪽 1/3에 있다),
           사용자 지시("좀 더 기울이거나 접어야")대로 얕은 rotateX를 얹는다. 24번 교훈대로 각도는 최소로
           둔다 — 저학년에게는 "무슨 색인지" 읽히는 것이 원근 정합보다 우선이다. */
    .paint-can{--can-face-clip:polygon(0% 0%,12.5% 3.8%,25% 7.1%,37.5% 9.2%,50% 10%,62.5% 9.2%,75% 7.1%,87.5% 3.8%,100% 0%,100% 90%,87.5% 93.8%,75% 97.1%,62.5% 99.2%,50% 100%,37.5% 99.2%,25% 97.1%,12.5% 93.8%,0% 90%)}
    .paint-can::before,.paint-can::after{content:'';position:absolute;clip-path:var(--can-face-clip);transform:perspective(300px) rotateX(5deg)}
    .paint-can::before{left:24.5%;top:43%;width:51%;height:25%;background:var(--can-line,var(--leaf-line))}
    /* 아치의 처짐(10%)은 에셋 림 타원 실측에서 나온 값이다 — 통 폭의 84%를 덮는 띠의 기하학적 처짐이
       림 전체 처짐(≈0.035 캔높이)의 0.46배라 이보다 키우면 오히려 어색해진다.
       그래서 "원통 위"라는 인상은 아치보다 **가로 명암**이 만든다. 좌우 끝을 어둡게 눌러 면이 말려 들어가게 하고
       에셋의 하이라이트 위치(왼쪽 1/3, 오른쪽 3/4)에 밝은 띠를 맞춘다. 위쪽은 림 그림자로 살짝 눌렀다. */
    .paint-can::after{left:25.5%;top:44%;width:49%;height:23%;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0) 16%,rgba(255,255,255,.10) 42%,rgba(0,0,0,.10)),linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.10) 8%,rgba(255,255,255,.30) 22%,rgba(255,255,255,.10) 34%,rgba(255,255,255,.02) 50%,rgba(0,0,0,.10) 66%,rgba(255,255,255,.10) 78%,rgba(0,0,0,.16) 88%,rgba(0,0,0,.32)),var(--can-fill,var(--leaf))}
    .paint-can[data-color="green"]{--can-fill:var(--leaf);--can-line:var(--leaf-line)}
    .paint-can[data-color="blue"]{--can-fill:var(--surface);--can-line:var(--surface-line)}
    .paint-can[data-color="red"]{--can-fill:var(--danger);--can-line:var(--danger-line)}
    /* 21: 대사가 "1통을 다 썼어요 / 1통을 더 준비했어요"라고 말하는 만큼 화면의 통 수도 따라 바뀌어야 한다.
       통은 줄 컨테이너가 배치하고 개별 통은 흐름에 맡긴다(통이 1개일 때와 2개일 때 좌우 균형이 유지된다). */
    .paint-can-row{position:absolute;z-index:var(--z-content);left:1150px;bottom:80px;display:flex;align-items:flex-end;gap:26px}
    .paint-can-row .paint-can{position:relative;left:auto;bottom:auto;width:250px;height:250px}
    .paint-can.empty{opacity:.5;filter:var(--ds-sm) grayscale(.6) brightness(.94);transform:rotate(-9deg)}
    .paint-can.arriving{animation:pop var(--dur) var(--ease-back) both}
    /* 82: "이것을 페인트라고 해요"가 말하는 대상을 그 대사 순간에 지목한다.
       등장(pop)과 같은 순간에 켜지면 animation 속성이 통째로 덮여 하나만 남으므로, 둘이 겹칠 때는
       한 줄에 이어 쓰고 강조를 pop 길이만큼 미룬다(등장 → 강조 순서로 읽힌다). */
    .paint-can.spotlight{transform-origin:bottom center;animation:canSpotlight var(--dur-slow) var(--ease) 3}
    .paint-can.arriving.spotlight{animation:pop var(--dur) var(--ease-back) both,canSpotlight var(--dur-slow) var(--ease) var(--dur) 3}
    /* 86: 노란 글로우(--filter-glow-lg)를 뺐다 — 74번(손가락 힌트)과 같은 판단이다.
       (a) 크림색 담장 위에서 #ffe86a는 대비가 거의 없어 색으로 안 읽히고 뿌연 번짐만 남는다.
       (b) "굵고 깔끔한 외곽선 + 플랫 셰이딩" 화풍에 soft bloom은 이질적이다.
       82번 실측이 이미 "글로우만으로는 안 보여 크기 펄스를 얹었다"였으므로 **일하던 신호는 처음부터 펄스**다.
       빠진 몫은 펄스를 1.07 → 1.10으로 키워 메운다.
       keyframe에서 filter를 없앤 것은 부수 효과가 아니라 이득이다 — drop-shadow 애니메이션은 매 프레임 리페인트를
       부르는데 이제 transform만 남아 컴포지팅으로 돈다. 기본 그림자 --ds-md는 .paint-can이 상시로 갖고 있어
       여기서 다시 선언할 필요가 없다(예전 0%/50% 양쪽의 var(--ds-md)는 filter를 덮어쓰지 않으려는 것이었다).
       origin이 bottom인 것은 통이 땅에 놓여 있어서다 — 가운데를 기준으로 키우면 통이 떠오른다. */
    @keyframes canSpotlight{0%,100%{transform:scale(1)}50%{transform:scale(1.10)}}
    /* 40: "페인트 색깔마다 모양이 달라요"가 말하는 색↔모양 대응을 화면에 만든다.
       도형 3개 가로 배치 + 색 없는 통 하나(오른쪽 #paintCan)에서 **도형 위 / 같은 색 통 아래**의 세로 짝 3벌로 바꾼다.
       28번의 .work-area{top:338px;height:570px}는 #countShapes·#arithShapes와 공유하므로 건드리지 않고
       이 씬만 오버라이드한다. 담장 면(school-wall-closeup.webp → stage y 367~878, 높이 511) 안에
       도형 150 + gap 16 + 통 200 = 366이 들어간다(box y 390~830 → 내용 y 427~793).
       가로는 단일 통이 사라진 만큼 오른쪽으로 옮겨 무대 가운데에 맞추되 .character.right(x 1428~)를 넘지 않는다. */
    /* 46: 이 씬만 한 줄짜리 짝(도형+통) 배치라 개수가 변하지 않는다 — 40번이 잡은 세로 중앙을 되돌려 둔다. */
    #paintIntroVisual{left:360px;top:390px;height:440px;grid-template-columns:repeat(3,1fr);align-content:center;gap:0 40px}
    .paint-pair{display:grid;justify-items:center;align-content:center;gap:16px}
    .paint-pair .paint-can{position:relative;left:auto;bottom:auto;width:200px;height:200px;filter:var(--ds-sm)}
    /* 52: 대사 `● 모양`/`■ 모양`/`▲ 모양`에 맞춰 짝을 하나씩 연다.
       **visibility로 숨긴다** — display:none이면 grid 칸이 무너져 먼저 열린 짝이 가운데로 밀린다.
       자리는 처음부터 세 칸 그대로 두고 내용만 나타나야 "다음은 여기"가 읽힌다. */
    .paint-pair{visibility:hidden}
    .paint-pair.revealed{visibility:visible;animation:paintPairPop var(--dur) var(--ease-back) both}
    @keyframes paintPairPop{0%{opacity:0;transform:scale(.72) translateY(26px)}70%{transform:scale(1.06) translateY(0)}100%{opacity:1;transform:scale(1) translateY(0)}}
    /* 18: 칠판 오른쪽 빈 면을 채우는 상시 배치 학생. 찾기 대상이 아니므로 핫스팟도 alt도 주지 않는다.
       z는 --z-scenery라 #shapeSearch(--z-interactive)의 찾기 사물·핫스팟보다 뒤에 놓인다.
       23: 발을 배경의 마루바닥에 앵커한다. student-*.webp는 셋 다 1024x1536이고 알파 bbox 하단이 y≈1370이라
       object-fit:contain(300x494 → 렌더 300x450, 상하 여백 22px)에서 발끝이 요소 하단에서 71px 위다.
       bottom:129px → 발끝 stage y≈880 = 벽·바닥 경계(818)와 책상 상판(900) 사이의 마루면.
       크기 340x560 → 300x494는 그 깊이의 원근 축소분이다(화분 기준 1m≈310px, 1학년 ≈1.2m). */
    .classroom-student{position:absolute;z-index:var(--z-scenery);left:1080px;bottom:129px;width:300px;height:494px;object-fit:contain;filter:var(--ds-lg);pointer-events:none}
    /* 23: 대사가 끝난 뒤 등장하므로 다른 캐릭터와 같은 진입 모션을 준다 */
    .classroom-student.student-enter{animation:characterEnter var(--dur-scene-in) var(--ease) both}
    /* 84: 오프닝 대사 인물(#shapeCharacter)만 무대 바닥이 아니라 **교실 배경의 마루면**에 앵커한다.
       `.on-floor`는 renderShapeDialogue()가 붙인다 — 이 씬은 한 인물(#shapeCharacter)이 배경을 갈아 끼우며
       세 단계(오프닝=교실 / paint-intro·아웃트로=담장)를 다 쓰기 때문에, 교실 배경인 오프닝에만 걸어야 한다.
       담장 단계의 지면은 씬3과 같은 무대 바닥이므로 공용 bottom:-12px를 그대로 둔다(64번과 같은 짝 구조).
       공용 .character{bottom:-12px}는 무대 바닥 기준이라 발끝이 stage y 1022(아이)·1027(교사)에 오는데,
       그 높이는 이 배경에서 책상 상판·의자 구간(뒷모서리 901 · 앞모서리 979~985)이라 책상을 밟고 선 그림이 된다.
       사람이 설 수 있는 면은 벽·바닥 경계(818)와 책상 뒷모서리(901) 사이의 통로뿐이므로,
       이미 그 통로에 서 있는 .classroom-student와 같은 **발끝 stage y≈880**에 맞춘다.
       값이 두 벌인 것은 알파 bbox 하단 비율이 인물마다 다르기 때문이다(아이 0.892~0.896 / 교사 0.947).
         아이  박스 308x504 → contain 308x462(상하 여백 21) → 발끝 = 1009 - bottom → bottom 129
         교사  박스 440x720 → contain 440x660(상하 여백 30) → 발끝 = 1015 - bottom → bottom 135
       **다른 씬은 그대로다** — 38번의 "bottom은 건드리지 않는다(발끝이 같은 바닥선에 남아야 키 차이로 읽힌다)"는
       무대 바닥을 지면으로 쓰는 씬(1·3·5)에서 유효하고, 지면이 그려진 이 교실 배경에서만 예외다.
       인물 좌표·크기·에셋을 바꾸면 두 값을 다시 잰다. */
    #shapeCharacter.on-floor{bottom:129px}
    #shapeCharacter.on-floor[src*="teacher-"]{bottom:135px}
    /* 84 ↔ 83: 인물이 141(아이)·147(교사)px 올라간 만큼 **얼굴 중심도 같이 올라간다.**
       83번의 `--speech-face-y`(어른 492 / 아이 707)는 `bottom:-12`(무대 바닥)를 전제로 계산된 값이라
       발끝을 옮긴 이 씬 오프닝에서는 그대로 못 쓴다. 같은 공식(박스 top + contain 여백 + 얼굴 비율 × 렌더 높이)에
       옮긴 bottom을 넣어 다시 잰다 — 교사 225+30+0.137×660 = **345**, 아이 447+21+0.213×462 = **566**.
       `.on-floor`가 붙은 beat에만 걸리므로 담장 단계(paint-intro·아웃트로)는 공용값 492를 그대로 쓴다.
       **#shapeCharacter의 bottom을 바꾸면 이 두 값도 같은 폭으로 함께 움직인다.** */
    #shapeCharacter.on-floor + #shapeSpeech{--speech-face-y:345px}
    #shapeCharacter.on-floor[src*="student-"] + #shapeSpeech{--speech-face-y:566px}
    .keypad-wrap{position:absolute;z-index:var(--z-interactive);right:105px;top:245px;width:510px;padding:26px;background:var(--veil);border:5px solid var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}

    .key{height:78px;font-size:var(--fs-md);font-weight:800;color:#12355f;background:rgba(255,255,255,.92);border:3px solid rgba(180,218,255,.95);border-radius:17px;box-shadow:0 4px 0 rgba(143,173,211,.76),0 11px 22px rgba(0,0,0,.15);transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}

    /* 65: `<img>`의 히트 영역은 알파가 아니라 **요소 박스**다. 이 인물 박스는 stage x 1411~1911인데
       인물 알파는 x 1570~1821(teacher-explaining.webp 실측, 박스 비율 0.318~0.819)이라

       30%(=x 1561)는 알파 경계 31.8%보다 바깥, 키패드 오른쪽 끝 1496보다 안쪽인 값이다. */

    /* 42-c: 힌트 표면을 크림 사각 패널(.help-card)에서 **선생님이 말하는 말풍선**으로 바꿨다.
       27번과 같은 결함이었다 — 화자와 무관한 오른쪽 위에 떠 있어 누가 말하는지가 읽히지 않았다.
       앵커는 요소 박스가 아니라 teacher-explaining.webp의 object-fit:contain 후 **알파 bbox** 기준이다:
       인물 stage x 1569~1820 / y 481~1066, 머리 x 1697~1805 · 머리 꼭대기 y 481.
       얼굴 높이에 옆(.right-speaker)으로 붙였더니 말풍선이 보기 버튼(y 437~791)을 덮어 정답이 가려졌다 →
       .top-speaker로 인물 **머리 위**에 올린다. right:60 → 꼬리 중심 x 1783이 머리 안이고, 말풍선은 x 1602~ 이라
       문제 패널(x 990~1560)과 겹치지 않는다. bottom:620 → 꼬리 끝 y 460이 머리 꼭대기 바로 위다.
       top이 아니라 bottom으로 잡아야 힌트 줄 수가 달라져도 꼬리가 머리에 붙어 있는다.
       15번 규칙대로 **폭·패딩은 손대지 않는다.** .speech의 자동 크기 조정을 그대로 쓴다.
       여닫이는 display:none ↔ block이어야 열 때마다 speechPop이 재생된다(opacity 전환으로는 재생되지 않는다). */

    /* 47: 예전 .continue-ready(진행 대기 글로우)는 힌트 말풍선이 진행 버튼을 겸하던 시절의 것이다.

    /* 42-a·b: 손가락은 매 문제 다시 뜨고(renderRandom), 화면 안쪽이 아니라 **선생님을 가리킨다.**
       에셋은 왼쪽 위를 가리키므로 scaleX(-1)로 뒤집어 오른쪽 위(선생님)를 향하게 한다.
       뒤집은 뒤 손끝은 박스의 (0.833, 0.152) 지점 → 180px 박스에서 (+150, +27).
       right:200 / bottom:207 → 박스 x 1540~1720 · y 693~873, 손끝 (1690, 720)이 선생님 몸통에 닿는다.
       반전·회전은 --finger-base 하나로 두어 키프레임과 어긋나지 않게 한다(예전에는 rotate(70deg)가 두 군데에 박혀 있었다).
       74: 노란 소프트 광(--filter-glow-md)은 뺐다 — 기능 큐라 장식 광이 정보를 더하지 않는다. 그림자만 남긴다.
       손끝의 **또렷한 금색 링은 CSS가 아니라 tap-hint-hand.webp에 구워진 탭 파문**이라(에셋 x 0.071~0.272 ·
       y 0.068~0.270) 여기서 빠지지 않는다. 그 링까지 지우려면 에셋을 고쳐야 한다(2026-08-04 사용자 결정: 링은 유지). */
    .finger-hint{--finger-base:scaleX(-1);position:absolute;right:200px;bottom:207px;z-index:var(--z-effect);width:180px;height:180px;object-fit:contain;border:0;border-radius:var(--r-none);transform:var(--finger-base);filter:var(--ds-sm);animation:fingerHintTap var(--dur-slow) var(--ease) 3;pointer-events:none}
    @keyframes fingerHintTap{0%,100%{transform:var(--finger-base) scale(1)}50%{transform:var(--finger-base) scale(.7);opacity:.35}}
    /* 66: 손가락은 **어디를 누르라**까지만 말하고 **누르면 무엇이 나오는지**는 말하지 않는다.
       `<img>`에는 ::after를 붙일 수 없고, 손가락은 --finger-base(scaleX(-1))로 뒤집혀 있어
       자식으로 넣으면 글자까지 뒤집힌다 → 형제 요소로 두고 여닫이만 show/hideFingerHint() 한 쌍으로 묶는다.
       손가락 박스(x 1541~1721 · y 693~873) 바로 아래, 같은 세로축(폭 180 / right 200 → 중심 1631)이다.
       bottom:125 → y 885~955로 키패드(오른쪽 끝 1496)와도 진행 막대(x 732~1188)와도 겹치지 않는다. */
    .finger-hint-label{position:absolute;right:200px;bottom:125px;z-index:var(--z-effect);width:180px;padding:10px 0;border:5px solid var(--bubble-line);border-radius:var(--r-pill);background:var(--bubble-bg);color:var(--bubble-ink);font-size:var(--fs-sm);font-weight:900;line-height:1;text-align:center;filter:var(--ds-sm);pointer-events:none}
    /* 69: 씬2 찾기 튜토리얼용 변형. 씬4 힌트(#fingerHint)와 같은 에셋·같은 라벨 짝을 쓰되 두 가지가 다르다.
       (a) 우하단 고정이 아니라 JS가 stage 좌표(left/top)로 대상 옆에 세운다 → right/bottom을 auto로 푼다.
       (b) 제자리 펄스 3회가 아니라 **대상 쪽으로 다가왔다 물러나는 왕복**을 무한 반복한다.
           씬4 힌트는 "필요하면 눌러라"(선택)라 3회면 되지만, 여기는 조작 방법 자체를 처음 알려주는 자리라
           아이가 누를 때까지 계속 눈에 띄어야 한다. 멈추는 시점은 시간이 아니라 endSearchTutorial()이다.
       에셋은 원본이 이미 왼쪽 위를 가리키므로 뒤집지 않는다(--finger-base:none). 손끝은 박스 기준 약 (29,14)다.
       translate 방향은 오른쪽 아래(+30,+38) → 대상 쪽(0,0)이다. 반전이 없어 x 부호가 화면과 그대로 일치한다. */
    /* 1.4s는 --dur-slow(.65s)를 안 쓴 유일한 자리다. 왕복 + 누름까지 한 주기에 담아야 해서 씬4의 제자리 펄스보다 길다 */
    .finger-hint.search-finger{--finger-base:none;right:auto;bottom:auto;animation:searchFingerTap 1.4s var(--ease) infinite}
    @keyframes searchFingerTap{
      0%,100%{transform:translate(30px,38px) scale(1)}
      45%{transform:translate(0,0) scale(.88)}
      58%{transform:translate(0,0) scale(.8);opacity:.5}
      72%{transform:translate(0,0) scale(.88)}
    }
    /* 66번 라벨은 손가락 아래 고정폭(180)이지만 이쪽 문구(`네모 모양을 클릭해보세요`)는 그 폭에 안 들어간다 → 글자폭으로 늘린다 */
    .finger-hint-label.search-finger-label{right:auto;bottom:auto;width:auto;padding:12px 26px;white-space:nowrap}
    @keyframes hintTap{50%{transform:scale(.7);opacity:.35}}
    .paint-tools{position:absolute;z-index:var(--z-interactive);left:38px;top:180px;width:310px;display:grid;gap:16px;padding:22px;background:var(--veil);border:5px solid var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}

    /* 30-b: 캔버스를 담장 면(school-wall-drawing.webp → 실측 stage x 172~1776 / y 308~877) 안쪽으로 넣는다.
       예전 top:275는 담장 캡 위 33px을 물고 있었다. 좌측은 .paint-tools(x 38~348)를 피해 390을 유지한다.

    /* 33: 패딩을 손으로 잡은 282/108/118 대신 **에셋 크림 면의 비율**로 잡는다.
       story-roadside-info-board.webp(1420x220) 실측 크림 면 = x 0.048~0.954 / y 0.168~0.745.
       카드 1300x600 환산 → 크림 면 x 62~1240(가용 1177) / y 101~447(가용 346), stage 기준 y 696~1042.
       예전 값은 글 영역을 1084x200(stage y 877~1077)으로 잡아 크림 면 **하단 밖**에 걸쳐 있었고,

    .story-card{position:absolute;left:310px;bottom:-115px;z-index:var(--z-speech);width:1300px;height:600px;padding:101px 64px 212px;display:grid;grid-auto-flow:row;align-content:center;background:var(--clear) url('assets/story-roadside-info-board.webp') center center/100% 100% no-repeat;border:0;border-radius:var(--r-none);box-shadow:var(--shadow-none);font-size:var(--fs-md);font-weight:800;line-height:1.35;text-align:center;white-space:pre-line;cursor:pointer;filter:var(--ds-md)}

    /* 29-b: 도형과 문제를 한 화면에 같이 둔다. 예전에는 #randomShapes(left 290/top 250/1340x560)와
       #randomPanel(left 245/top 205/1040x700)이 완전히 겹쳐 있어서 연출 동안 패널을 visibility:hidden으로
       가릴 수밖에 없었다 — 그래서 그림과 문제가 한 화면에 절대 공존하지 않았다.
       이제 좌우로 나눈다: 도형은 왼쪽(x 180~756), 문제 패널은 오른쪽(내용 x 800~1520)이다.
       오른쪽 한계는 .help-character(teacher-explaining, 실제 인물 x≈1660~1900 · 뻗은 손 x≈1560)다. */
    /* 41-c: 도형이 담장 중앙 면(x 374~1522)을 쓰려면 패널이 그 오른쪽으로 비켜야 한다.
       내용 x 990~1560이고 오른쪽 한계는 .help-character의 뻗은 손 x≈1569(teacher-explaining 알파 실측)다. */
    #randomPanel{left:990px;top:278px;width:570px;min-height:640px;padding:0;background:var(--clear);border:0;border-radius:var(--r-none);box-shadow:var(--shadow-none)}
    /* 판 높이는 문항 최장인 **3줄**(`덧셈과 뺄셈 / 10에서 빼어 보세요. / 10 - 6=(   )`) 기준으로 잡는다.
       41px × 1.2 × 3줄 = 148px이 필요한데 예전 165px은 패딩까지 빼면 모자라 3번째 줄이 overflow:hidden에 잘려 있었다.

       높이 220 → 크림 면 154px, 패딩은 그 비율대로 33px이다. */
    #randomPanel .random-prompt{position:relative;width:540px;height:220px;margin:0 auto 12px;padding:33px 30px;display:grid;place-items:center;overflow:hidden;font-size:var(--fs-md);line-height:1.2}

    #randomInput .answer-display{height:88px;margin-bottom:12px;padding:14px 40px;border:0;border-radius:var(--r-none);background:var(--clear) url('assets/wall-choice-plaque-body.webp') center/100% 100% no-repeat;box-shadow:var(--shadow-none)}
    #randomInput .keypad{gap:14px}
    /* 47(내력): 정답 결과·진행을 #helpCard 겸직에서 떼어 패널 안 #randomSolved 판으로 옮겼던 자리다.
       75: 그 판을 제거했다 — 정답 표면은 씬2·3과 같은 공용 경로(showFeedback 도장 + #narrationAdvance)다.
       78: 한때 씬4만 문제 패널 가운데(.on-random)로 옮겼는데, `다음 ▸`는 **어느 씬이든 도장 바로 아래**여야 한다
       (2026-08-04 사용자 지시). 그래서 **씬별 좌표를 두지 않는다** — .narration-advance 기본값(가로 중앙 · top 652)이
       도장(240px, 중앙 y 518 → 바닥 638) 14px 아래에 붙는 자리다. 최대 개수(19개)에서 5열 2·3행 도형 두 칸과
       겹치지만, 도장이 이미 같은 방식으로 도형을 덮으므로 **정답 순간의 오버레이**로 일관된다. */
    /* 정답 뒤 입력기는 죽은 표면이라 내린다. 키패드는 .keypad만 감춰 #randomDisplay의 입력값을 남기고,
       보기는 전부 내린다 — 남겨 두면 결과 판이 **네 번째 보기처럼** 보인다(같은 담장 작업표 에셋이라 더 그렇다). */
    #randomPanel[data-solved="1"] #randomInput .keypad,
    #randomPanel[data-solved="1"] #randomInput .choices{display:none}
    /* 13: 식을 내기 전에 도형이 생기고 줄어드는 과정을 보여 준다.
       29-b: 이제 연출 중에도 문제 패널을 가리지 않는다(예전 .shape-intro{visibility:hidden} 규칙은 제거).
       41-b: 예전 left:180(x 180~756)은 왼쪽 194px이 배경의 낮은 대비 추상 벽화(x 253~374) 위에 걸쳐 있었다.
       도형 박스는 **깨끗한 중앙 면**(실측 stage x 374~1522 / y 380~946)의 왼쪽에 둔다.
       최대 개수는 D 유형의 subtract.a = 19개다 → 5열 × 4행. 104px 도형 기준 600x484가 들어간다. */
    /* 67: 면 안이긴 했으나 첫 줄(y 406)이 담장 상단 캡에 붙어 있었다. 아래로 내린다.
       내릴 수 있는 폭은 **최대 개수(D 유형 19개 = 5열 4행, 콘텐츠 484px)** 가 정한다 —
       top 420이면 콘텐츠가 y 436~904로 면(380~946) 안이고 위 56 / 아래 42로 여백이 갈린다.
       46번대로 앵커는 위(align-content:start)에 고정이라 개수가 줄어도 첫 줄은 y 436 그대로다. */
    #randomShapes{left:374px;top:420px;width:610px;height:500px;gap:12px;padding:16px}
    #randomShapes .paint-shape{height:104px}
    /* 48: 보기 선택(A)에도 그림을 준다 — `a + ? = 10`을 `● … ● + [?]`로 읽게 한다.
       연산 기호 칸과 점선 물음표 칸은 **도형이 아니므로** .paint-shape의 ::before/::after 그리기를 타면 안 된다.
       점선 칸은 개수와 무관하게 **하나**다. 칸을 정답 개수(10-a)만큼 두면 그림이 답을 먼저 알려 준다. */
    .paint-op,.paint-slot{position:relative;height:150px;aspect-ratio:1;justify-self:center;display:grid;place-items:center;font-size:var(--fs-lg);line-height:1;color:var(--warm-ink)}
    .paint-slot{border:5px dashed var(--warm-ink);border-radius:12%;opacity:.8}
    /* 81: 정답이면 물음표 칸은 **사라지고 그 자리에 도형이 채워진다**(fillRandomSlotWithShapes).
       예전 .paint-slot.filled(숫자를 받아 초록 실선으로 닫히는 상태)는 그래서 없앴다. */
    .paint-slot.hint-step{opacity:1;filter:var(--filter-glow-lg)}
    #randomShapes .paint-op,#randomShapes .paint-slot{height:104px}
    /* 건너뛰기 레이어는 도형 위만 덮는다. 전면(inset:142px 0 0)으로 두면 같이 떠 있는 키패드를 막는다. */
    #randomShapeSkip{inset:auto;left:374px;top:420px;width:610px;height:500px}
    #randomInput .key{height:68px}
    /* 77: 호버 배경 교체는 `.key.enter`(흰 글자 on 빨강 #e23b3b)의 색 계약을 `#randomInput` 명시도로 덮어
       확인 키가 흰 판 위 흰 글자가 됐다. 씬2·3 키패드에는 이 규칙이 없어 씬4만 그랬다 — 들림만 남긴다. */
    #randomInput .key:hover{transform:translateY(-2px)}
    #randomInput .key:active{transform:translateY(4px);box-shadow:var(--shadow-none)}
    /* 43: 문항이 4개가 되어 칸 수도 4다. 개수가 또 바뀌어도 가운데 정렬이 유지되도록 left를 px로 고정하지 않는다. */
    .random-progress{position:absolute;left:50%;bottom:28px;z-index:var(--z-interactive);transform:translateX(-50%);display:flex;gap:24px;pointer-events:none}
    .random-progress .paint-shape{width:96px;height:96px;opacity:.24;transform:scale(.88)}
    .random-progress .paint-shape.complete{opacity:1;transform:scale(1);filter:var(--filter-glow-sm) var(--ds-sm)}
    /* 32: 원문 md 449~451행대로 문구 **위**에 ● ■ ▲를 둔다(다음 화면이 아니라 이 인트로 판이다).
       이 판은 에셋을 원본 비율 1420x220 그대로 쓰는 유일한 곳이라 높이를 늘리지 않는다 — 늘리면 .story-card와 같은 늘어짐이 생긴다.
       크림 면 안쪽 가용 높이는 220 − 33 − 59 = 128px이고 문구 한 줄이 62.5px(50px × 1.25)이므로
       도형 줄은 50px + gap 14 = 64px까지만 쓸 수 있다. */
    .story-intro-board{position:absolute;left:250px;bottom:35px;z-index:var(--z-speech);width:1420px;height:220px;padding:33px 80px 59px;display:grid;grid-auto-flow:row;align-content:center;justify-items:center;gap:14px;background:var(--clear) url('assets/story-roadside-info-board.webp') center/100% 100% no-repeat;font-size:var(--fs-xl);font-weight:900;line-height:1.25;text-align:center;filter:var(--ds-md);pointer-events:none}
    /* 44: 도형은 인트로 판 **밖**, 배경 앞 화면 가운데로 나왔다(32번의 원문 배치를 2026-08-03 사용자 지시가 덮는다).
       판 안에서는 크림 면 가용 높이가 128px뿐이라 도형이 50px로 눌려 있었다. 그 제약이 풀려 180px로 키운다.
       빈 면은 제목 이미지(#storyTitleSurface y 205~355)와 인트로 판(.story-intro-board y 825~1045) 사이의 y 355~825다.
       .sign-row(y 275~665)와 겹치는 영역이지만 #signRow는 인트로 단계에서 hidden이다 —
       **이 도형을 인트로 이후에도 남기면 표지판과 겹친다.** 그래서 openStorySigns()에서 함께 내린다.
       19번이 세운 초록=● / 파랑=■ / 빨강=▲ 매핑을 따른다(씬2 #paintIntroVisual과 같은 조합). */
    .story-intro-shapes{position:absolute;left:0;right:0;top:355px;height:470px;z-index:var(--z-content);display:flex;align-items:center;justify-content:center;gap:80px;filter:var(--ds-md);pointer-events:none}
    .story-intro-shapes .paint-shape{height:180px}
    .completion-actions .cta{--completion-cta-x:-29px;--completion-cta-y:-75px;width:380px;height:150px;min-width:380px;min-height:150px;padding:0;border:0;border-radius:var(--r-none);display:grid;place-items:center;background-color:var(--clear);background-image:url('assets/completion-cta-body.webp');background-repeat:no-repeat;background-size:1254px 706px;background-position:var(--completion-cta-x) var(--completion-cta-y);box-shadow:var(--shadow-none);color:var(--white);filter:none}
    .completion-actions .cta:hover{--completion-cta-x:-436px;filter:none}
    .completion-actions .cta:active{--completion-cta-x:-843px;box-shadow:var(--shadow-none)}

    #section_completion.active .completion-actions .cta:nth-child(2){animation:completionCtaIn var(--dur) var(--ease-back) var(--delay-completion-cta-2) both}
    #section_completion.active .completion-actions .cta:nth-child(3){animation:completionCtaIn var(--dur) var(--ease-back) var(--delay-completion-cta-3) both}

    @keyframes completionTitleIn{from{opacity:0;transform:scale(.9) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes completionSparkBurst{0%{opacity:0;transform:scale(.35) rotate(0)}55%{opacity:1;transform:scale(2.2) rotate(45deg)}100%{opacity:.65;transform:scale(1) rotate(75deg)}}
    @keyframes completionCtaIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    /* 38: 이 슬롯은 정답(teacher-praising)과 오답(student-thinking)이 번갈아 쓴다 → --char-scale을 함께 받는다.
       오답 때는 말풍선이 뜨지 않으므로(showWrongFeedback이 sp를 hidden으로 둔다) 꼬리 앵커는 영향받지 않는다. */
    .feedback-character{left:80px;bottom:-10px;width:calc(360px * var(--char-scale));height:calc(590px * var(--char-scale))}
    /* 17: 이 말풍선만 꼬리도 진행 버튼도 없어 "눌러야 넘어간다"는 신호가 0이었다.
       이제 .left-speaker 꼬리 + .repair-narr-next를 함께 쓴다.
       27: 앵커를 요소 박스(x 80~440)가 아니라 **object-fit:contain 후 실제 알파 bbox** 기준으로 다시 잡았다.
       teacher-praising.webp의 보이는 인물은 stage x 236~356 / y 548~1037이다. 박스 오른쪽 84px이 투명이라
       박스 기준(500)으로 피하면 인물에서 110px 떠 보였다.
       85: `left:380`(꼬리가 인물 안으로 파고드는 값)에서 **416**으로 물렸다. 이 슬롯(360x590/left 80)에서
       teacher-praising의 밴드 안 실루엣 오른쪽 끝은 x 356이므로 다른 대사 말풍선과 같은 +60 규칙을 따른다.
       83: 세로는 `top:470`(머리 높이)에서 **얼굴 중심 y 598**로 바꿨다 — 이 슬롯은 360x590/bottom −10이라
       contain 렌더가 y 525~1065이고 teacher-praising 얼굴 비율 .1348 → 525 + 540×.1348 = 598이다.
       `.speech.left-speaker`가 주는 `translate:0 -50%`를 그대로 받으므로 여기서는 변수만 준다.
       min-height/폭·패딩은 15번의 자동 크기 조정을 막으므로 두지 않는다. 바꿔도 되는 것은 앵커 좌표뿐이다. */
    .speech.feedback-speech{--speech-side-x:416px;--speech-face-y:598px;cursor:pointer;color:var(--plate-ink)}
    .drawing-summary{min-height:130px;margin:-12px 0 28px;display:flex;align-items:center;justify-content:center;gap:18px}

    /* 31-b: 표시 상한을 넘은 조합을 대신하는 한 칸. 도형이 아니므로 .paint-shape를 붙이지 않는다. */
    .drawing-summary .summary-more{flex:0 0 auto;font-size:var(--fs-xl);font-weight:900;line-height:1;color:var(--ink)}
    /* 30-b: #drawingCanvas와 **같은 박스**여야 저장된 그림이 같은 자리에 복원된다. 한쪽만 바꾸지 말 것.
       씬7 배경(school-wall-completed.webp)의 담장 면은 실측 stage y 304~876으로 씬5(308~877)와 사실상 같아 같은 값을 쓸 수 있다. */
    #completedMuralPreview{position:absolute;z-index:var(--z-scenery);left:390px;top:320px;width:1320px;height:540px;overflow:hidden;pointer-events:none}
    /* 상태 유틸리티는 더 구체적인 컴포넌트 display 규칙보다 숨김을 우선해야 한다. */
    .hidden{display:none !important}
    .shake{animation:shake var(--dur) var(--ease)}
    @keyframes shake{20%,60%{transform:translateX(-16px)}40%,80%{transform:translateX(16px)}}
    /* ── 디버그 패널(개발용) ─────────────────────────────────────
       #stage 밖에 있으므로 스테이지 스케일·회전을 받지 않는다.
       콘텐츠 토큰과 섞이지 않도록 값도 이 블록 안에서만 쓰는 독립 스타일로 둔다. */
    .debug-panel{position:fixed;right:0;top:0;z-index:9999;display:flex;flex-direction:column;gap:10px;width:320px;max-height:100vh;padding:14px;overflow-y:auto;background:rgba(16,22,30,.95);color:#e6edf3;font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:13px;line-height:1.4;box-shadow:-10px 0 28px rgba(0,0,0,.4)}

    .debug-close{width:26px;height:26px;padding:0;display:grid;place-items:center;border:1px solid rgba(230,237,243,.24);border-radius:6px;background:rgba(255,255,255,.06);color:inherit;cursor:pointer}

    .debug-scene.current{border-color:#7ee787;background:rgba(126,231,135,.14)}
    .debug-scene-order{flex:0 0 22px;display:grid;place-items:center;height:22px;border-radius:5px;background:rgba(255,255,255,.12);font-size:12px}

    /* 68: 1-2/01의 인증서 오버레이(.repair-cert-*)를 이식. cqw/cqh 선언은 그대로 두면 #stage(container-type:size)가
       1920 기준으로 환산해 주고, px 리터럴만 1920/1366 = ×1.4056 했다(15번 규칙 — px로 재계산하지 말 것).
       01의 `@media (max-height:480px)` 축소 보정은 뺐다: 08은 무대가 1920×1080 고정이고 #viewport가 통째로 축소되므로
       실제 뷰포트 높이로 카드만 따로 줄이면 무대 안에서 크기가 튄다. */
    .repair-cert-overlay{position:absolute;inset:0;z-index:96;display:flex;align-items:center;justify-content:center;padding-bottom:clamp(90px,13cqh,169px);background:rgba(10,18,32,.55);opacity:0;transition:opacity .24s ease}
    .repair-cert-overlay.repair-cert-show{opacity:1}

    /* 01은 저장 버튼에 `.cta clear-next-cta`를 얹지만, 08의 .cta는 완료 씬 전용 이미지 버튼(380×150 · completion-cta-body.webp)이라
       그대로 쓰면 카드 안 버튼이 담장 그림으로 바뀐다. 01의 .cta + .clear-next-cta 실효값(1366 기준)을 ×1.4056 해 자립시켰다. */
    .repair-cert-dl{display:block;position:relative;overflow:hidden;width:100%;min-width:0;max-width:100%;box-sizing:border-box;min-height:107px;margin:0;padding:17px 51px;border:6px solid rgba(103,201,239,.86);border-radius:999px;background:linear-gradient(180deg,#ffffff 0%,#f4fbff 100%);color:#5570e9;font-family:var(--font-body);font-size:35px;font-weight:1000;line-height:1.18;text-shadow:0 3px 0 rgba(255,255,255,.95);box-shadow:0 14px 31px rgba(24,39,86,.22),0 0 25px rgba(103,201,239,.2);cursor:pointer}
    .repair-cert-star{position:absolute;left:50%;top:44%;color:#ffd54a;font-size:84px;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.4)}
    .repair-cert-star.repair-cert-star-go{animation:repairCertStar .9s ease both}
    @keyframes repairCertStar{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0deg)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scale(1.6) rotate(160deg)}}

    /* ── 88: 1-2/01의 이미지 커서. 클래스명(#cursor / .cursor-image / .big / .readable-hover)은 01 그대로다 ──
       값은 01 소스를 읽지 않고 `tmp/probe-cursor-01.js`의 getComputedStyle 실측으로 가져왔다(4번·15번 교훈:
       01의 CSS는 뒤쪽 규칙이 앞 규칙을 덮어 소스 순서로 읽으면 죽은 값을 집는다).
       **스테이지 배율 ×1.4056을 곱하지 않는다** — #cursor는 position:fixed라 #stage가 아니라 뷰포트 px이고,
       01·08 모두 스테이지를 화면에 꽉 채우므로 44px 그대로가 화면상 같은 크기다. */
    /* 08에는 cursor:pointer 선언이 20곳 넘게 흩어져 있어 명시도로는 전부 이길 수 없다.
       "OS 커서는 무조건 숨긴다"는 원자적 강제라 !important를 쓴다(AGENTS.md의 허용 사례). */
    *{cursor:none !important}
    #cursor{position:fixed;left:-100px;top:-100px;z-index:99999;pointer-events:none;transition:width .12s,height .12s,opacity .12s,filter .12s}
    #cursor.cursor-image{width:44px;height:44px;transform:translate(-5%,-4%);opacity:.96;filter:drop-shadow(0 6px 10px rgba(15,23,42,.28)) drop-shadow(0 0 8px rgba(255,232,144,.42))}
    #cursor.cursor-image img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    #cursor.cursor-image.readable-hover{opacity:.94}
    #cursor.cursor-image.big,#cursor.cursor-image.big.readable-hover{width:55px;height:55px;opacity:.96;filter:drop-shadow(0 8px 14px rgba(15,23,42,.3)) drop-shadow(0 0 14px rgba(255,232,144,.62))}
    /* 터치 기기에는 따라올 포인터가 없다(01과 같은 방어). */
    @media (pointer:coarse){#cursor{display:none !important}}
  </style>

  function openCertificate(){
    if(document.getElementById('repairCertOverlay'))return;
    const ov=document.createElement('div');
    ov.id='repairCertOverlay';ov.className='repair-cert-overlay';
    ov.innerHTML='<div class="repair-cert-card" role="dialog" aria-modal="true" aria-label="'+escapeHtml(CERT.heading)+'">'
      +'<button class="repair-cert-close" type="button" aria-label="닫기">&times;</button>'
      +'<div class="repair-cert-medal" aria-hidden="true">🏅</div>'
      +'<h2 class="repair-cert-h">'+escapeHtml(CERT.heading)+'</h2>'
      +'<p class="repair-cert-sub">'+escapeHtml(CERT.subtext)+'</p>'
      +'<div class="repair-cert-name-row"><input id="repairCertName" class="repair-cert-name" type="text" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off"></div>'
      +'<button class="repair-cert-dl" id="repairCertDl" type="button"><span aria-hidden="true">★</span> '+escapeHtml(CERT.buttonText)+'</button>'
      +'<div class="repair-cert-star" id="repairCertStar" aria-hidden="true">★</div>'
      +'</div>';
    (document.getElementById('stage')||document.body).appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('repair-cert-show'));
    const nameInput=ov.querySelector('#repairCertName');
    setTimeout(()=>{try{nameInput.focus()}catch(_){}},60);
    const closeCert=()=>{ov.classList.remove('repair-cert-show');setTimeout(()=>ov.remove(),240)};
    ov.querySelector('.repair-cert-close').onclick=closeCert;
    ov.addEventListener('click',e=>{if(e.target===ov)closeCert()});
    ov.querySelector('#repairCertDl').onclick=()=>downloadCertificate();
    nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();downloadCertificate()}});
  }
  function popCertStar(){
    const star=document.getElementById('repairCertStar');
    if(!star)return;
    star.classList.remove('repair-cert-star-go');
    void star.offsetWidth;
    star.classList.add('repair-cert-star-go');
  }
  function downloadCertificate(){
    const raw=(document.getElementById('repairCertName')?.value||'').trim();
    const name=raw||CERT.defaultName;

    /* mouseover만 쓴다. mouseout의 target은 *떠나는* 요소라 거기서 다시 판정하면 클래스가 도로 붙는다
       (01은 add/remove를 나눠 이 함정을 피했다). 버튼 → 배경으로 나가면 배경에서 mouseover가 한 번 더 온다. */
    const sync=t=>{
      const el=t instanceof Element?t:null;
      cur.classList.toggle('big',!!el&&!!el.closest(HOT));
      cur.classList.toggle('readable-hover',!!el&&!!el.closest(READ));
    };
    addEventListener('mouseover',e=>sync(e.target));
    document.addEventListener('mouseleave',()=>sync(null));
  })();

  showScene(currentScene);
})();
</script>
</body>
</html>
