/* ────────────────────────────────────────────────
   화면 배율 : 1600 × 900 을 기준 칸(캔버스)으로 두고
   1rem = 기준 10px 로 잡아 창 크기에 맞춰 통째로 확대·축소.
   → 어떤 해상도에서도 스크롤이 생기지 않는다.
   ──────────────────────────────────────────────── */
html {
  font-size: min(0.625vw, 1.1111vh);
  /* 모바일 주소창이 접혔다 펴질 때 무대 크기가 튀지 않게. 모르는 브라우저는 위 줄을 쓴다 */
  font-size: min(0.625vw, 1.1111dvh);
  -webkit-text-size-adjust: 100%;   /* 아이폰이 제멋대로 글자를 키우지 않게 */
  text-size-adjust: 100%;
}

/* ── 세로로 든 화면(주로 휴대전화) : 무대를 눕혀서 보여 준다 ──
   16:9 무대를 세로 화면에 그대로 넣으면 폭에 맞춰 아주 작게 뜬다.
   ① 1rem 기준의 가로·세로를 맞바꾼다
      (무대 가로 160rem 이 화면 “높이”에, 세로 90rem 이 화면 “폭”에 들어가야 한다)
   ② 무대를 90도 돌린다 — position:fixed 로 흐름에서 빼내야
      돌리기 전 상자(160rem 폭)가 화면을 밀어내지 않는다.
   기기를 어떻게 들고 있든 화면을 꽉 채운 가로 화면이 된다. */
@media (orientation: portrait) {
  html {
    font-size: min(0.625vh, 1.1111vw);
    font-size: min(0.625dvh, 1.1111vw);
  }

  /* body .stage 로 무겁게 쓴 이유 : 아래쪽에 있는 기본 규칙 .stage { position: relative } 와
     무게가 같으면 뒤의 것이 이겨 fixed 가 무시되고, top/left 50% 가 상대 이동으로 먹어
     무대가 오른쪽 아래로 밀려 잘린다. (실제로 그렇게 잘렸었다.) */
  body .stage {
    position: fixed;
    top: 50%;
    left: 50%;
    margin: 0;
    transform: translate(-50%, -50%) rotate(90deg);
  }
}

:root {
  --ink: #23313d;
  --ink-soft: #5c4a34;      /* 양피지 위에서 읽히는 따뜻한 갈색 */
  --navy: #11395c;
  --navy-deep: #0b2740;
  --teal: #0f5c51;
  --sun: #f6c445;
  --sun-deep: #d99b18;
  --desk: #17394d;          /* 바탕(책상) */
  --parch: #dbc8b1;         /* 양피지 본체색 : 이미지가 못 뜰 때의 대비 */
  --paper: #fffdf6;
  --note: #fffae6;
  --sky: #dceaf4;
  --leaf: #e7f2da;
  --edge: #b9a486;
  --ok: #1c7a4e;
  --ok-bg: #e5f3e6;
  --ok-edge: #9ccfae;
  --again: #8a4f15;
  --again-bg: #fdeed6;
  --again-edge: #e2b985;
  --quiz-bg: #d0f0e3;      /* 퀴즈 화면 배경 : 그림이 못 뜰 때의 대비색 */
  --content-shift: 1.8rem; /* 배경 종이가 치우친 만큼 내용을 오른쪽으로 (모든 화면 공통) */
  --title-ink: #16233a;    /* 표지·보드 제목 : 마지막 화면 제목과 같은 진한 남색 */
  --cover-lead: #6b7280;   /* 표지 설명글 : 차분한 회색 */
  --res-ink: #16233a;      /* 마지막 화면 : 제목·본문 진한 남색 */
  --res-blue: #2f7ee0;     /* 마지막 화면 : 강조 파랑 */
  --res-badge: #1f6fd6;    /* 마지막 화면 : 번호 배지 */
  --res-sub: #8a97a5;      /* 마지막 화면 : 보조 설명 회색 */
  --res-edge: #1a5fb4;     /* 마지막 화면 : 다시 보기 버튼 테두리 */
}

* { box-sizing: border-box; }

body {
  display: grid;
  place-items: center;
  height: 100vh;
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  background: #000;          /* 16:9 무대 바깥은 검은 여백 */
  font-family: "Hakgyoansim Dunggeunmiso", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 2rem;
  line-height: 1.5;
  word-break: keep-all;   /* 낱말 도중에 줄이 바뀌지 않게 */
}

button { font: inherit; cursor: pointer; }

/* ── 마우스 커서 : 돋보기 ─────────────────────
   렌즈 한가운데를 가리키는 지점(25,25)으로 잡는다.
   SVG 커서를 못 읽는 브라우저는 뒤의 기본값으로 넘어간다. */
body,
.stage { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 38 38'><path d='M23 23 32.5 32.5' stroke='%232b3a4d' stroke-width='7' stroke-linecap='round'/><path d='M23 23 26.2 26.2' stroke='%23f4c02f' stroke-width='7'/><circle cx='15' cy='15' r='11.6' fill='%23cfe8fb' stroke='%234a90d9' stroke-width='3.4'/><path d='M9.4 12a7 7 0 0 1 4.8-4.4' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/></svg>") 25 25, auto; }

/* 누를 수 있는 것 위에서는 렌즈 테가 금색으로 바뀐다 */
button:not(:disabled),
[data-action] { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 38 38'><path d='M23 23 32.5 32.5' stroke='%232b3a4d' stroke-width='7' stroke-linecap='round'/><path d='M23 23 26.2 26.2' stroke='%23f4c02f' stroke-width='7'/><circle cx='15' cy='15' r='11.6' fill='%23fff3cf' stroke='%23e0a521' stroke-width='3.4'/><path d='M9.4 12a7 7 0 0 1 4.8-4.4' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/></svg>") 25 25, pointer; }

/* 못 누르는 버튼도 화살표 대신 돋보기 — 테 색(파랑/금색)으로만 구분한다 */

   (줄상자 7.5rem)이어야 칸을 넘지 않는다.
   칸이 살짝 오른쪽으로 기울어 있어 가운데도 50% 가 아니라 51.94% 다.
   세로는 눈으로 가운데에 오게 맞춘다 :
     5rem 글자는 위에 1.3rem, 아래 2.1rem 의 빈칸을 달고 있어 글자 높이가 4.1rem 이다.
     칸 한가운데 77.28rem - 4.1/2 = 75.23rem 이 글자 윗변,
     줄상자 위는 거기서 1.3rem 더 위인 73.93rem = 82.14% */
.board-hint {
  position: absolute;
  top: 81.82%;   /* 82.14 - 3px(≒.29rem = .32%) */
  left: 51.94%;
  transform: translateX(-50%);
  margin: 0;
  color: var(--title-ink);
  font-size: 5rem;
  font-weight: 800;
  white-space: nowrap;
}

/* ── 찾아야 할 포스트잇 목록 : 스케치북 안 오른쪽 위 ────────────
   무엇을 찾아야 하는지 보여 주고, 찾을 때마다 초록 체크가 찍힌다. 찾은 것은 눌러서 다시 볼 수 있다.
   자리는 초록 페이지 오른쪽 위 모서리(x 1537px, y 111px) 안쪽으로 22px 들어온 지점이다
   — 카드 줄(x 1164~1515, y 133~242px)은 보물지도 가림 그림(x 944~1146, y 275~423)과 겹치지 않는다.
   가림 그림보다 위에 있어야 하므로 z-index 를 올린다. */
.found-list {
  position: absolute;
  right: 9.39%;
  top: 14.13%;
  z-index: 7;
  display: flex;
  gap: 1.2rem;
}

.found-item {
  position: relative;
  display: grid;
  place-items: center;
  width: 10.4rem;
  height: 10.4rem;
  padding: 2rem;             /* 1 → 2rem : 상자는 그대로 두고 안의 포스트잇만 7.3 → 5.3rem 으로 */
  background: #fff;
  border: .55rem solid #cfc7b6;
  border-radius: 1.8rem;
  box-shadow: 0 .4rem 1rem rgba(0, 0, 0, .16);
  font: inherit;           /* 찾은 카드는 button 이라 브라우저 기본 모양을 지운다. 커서는 따로 정하지 않아
                              무대의 돋보기 커서(.stage · [data-action])가 그대로 쓰인다 */
  color: inherit;
  transition: transform .14s ease, background .14s ease;
}

/* 세 장의 원본 비율이 조금씩 달라 contain 으로 넣어야 찌그러지지 않는다 */
.found-thumb { width: 100%; height: 100%; object-fit: contain; }

/* 찾은 것 : 테두리가 연두로 바뀌고 체크 도장이 찍힌다.
   진초록(--ok)은 배경 그림과 톤이 겹쳐 묻히므로 밝은 연두 #9be06a 를 쓴다.
   배경은 흰색 그대로 두고 테두리와 체크 도장으로만 구분한다.
   체크 도장은 진초록 그대로 둬 대비를 지킨다. */
.found-item.is-found { background: #fff; border-color: #9be06a; }   /* 배경은 흰색 그대로, 테두리만 연두 */
.found-item.is-found:hover { background: #f4fff0; transform: translateY(-.3rem); }

.found-check {
  position: absolute;
  right: -1.3rem;
  bottom: -1.3rem;
  display: grid;
  width: 4.6rem;
  height: 4.6rem;
  place-items: center;
  color: #fff;
  background: var(--ok);
  border: .38rem solid #fff;
  border-radius: 50%;
  box-shadow: 0 .3rem .8rem rgba(0, 0, 0, .28);
}

/* 도장이 톡 찍히는 건 방금 찾은 카드(.is-new)뿐이다. 보드를 다시 그릴 때마다
   찍혀 있던 도장까지 다시 튀면(문제를 다시 보고 확인을 눌렀을 때 등) 어지럽다. */
.found-item.is-new .found-check { animation: stamp-pop .4s ease-out both; }

.found-check .ico { width: 2.9rem; height: 2.9rem; }

/* ── 포스트잇 : 배경이 아니라 진짜 요소 ──────
   보물찾기 배경(1672×941) 속 큰 그림 뒤에 절반쯤 숨겨 둔다.
   세 장 모두 폭을 80px 로 맞추고, 높이는 그림 원본 비율을 지킨다
   (1번 480×446, 2번 480×411, 3번 480×445). */
.spot {
  position: absolute;
  padding: 0;
  background: none;
  border: 0;
}

/* 자리는 눈대중이 아니라, 가림 그림의 불투명 픽셀과 포스트잇 사각형이
   겹치는 넓이를 세어 “정확히 절반이 가려지는” 지점으로 잡았다. */
.spot-1 { left: 61.72%; top: 39.74%; width: 4.78%; height: 7.86%; }   /* 보물지도 뒤 — 50.0% 가려짐 */
.spot-2 { left: 17.70%; top: 63.55%; width: 4.78%; height: 7.33%; }   /* 큰 돋보기 뒤 — 50.1% 가려짐 */
.spot-3 { left: 79.07%; top: 53.35%; width: 4.78%; height: 7.86%; }   /* 기차 뒤 — 50.0% 가려짐 */

/* ── 가림 그림 : 배경에서 물체만 오려 낸 조각을 제자리에 다시 얹는다 ──
   배경 그림이 한 장이라 포스트잇을 물체 “뒤”에 둘 방법이 없었다.
   그래서 돋보기·보물지도·기차만 투명 배경으로 오려 내(바탕색을 그림 테두리에서
   번지게 해 물체 안쪽 색은 건드리지 않았다) 포스트잇보다 위에 깐다.
   위치·크기가 배경과 똑같은 비율이라 이음매는 보이지 않는다.
   클릭은 통과시켜야 아래 포스트잇을 누를 수 있다. */
.board-cover {
  position: absolute;
  pointer-events: none;
}

.cover-map       { left: 56.46%; top: 29.22%; width: 12.08%; height: 15.73%; }
.cover-magnifier { left: 12.62%; top: 57.49%; width: 10.17%; height: 21.36%; }
.cover-train     { left: 75.90%; top: 54.84%; width: 10.71%; height: 15.41%; }

/* 한 번 찾아 낸 포스트잇은 가림 그림 앞으로 나와 온전히 보인다 */
/* 다 찾고 나면 종이가 80px → 150px 로 커진 채 돌아온다.
   전에는 transform: scale(1.875) 로 키웠는데, 그러면 브라우저가 80px 로 한 번
   그린 그림을 그대로 늘려 놓는 일이 생겨 종이가 흐릿하고 연해 보인다.
   그래서 확대 대신 “처음부터 150px 로” 그리도록 left/top/width/height 를 직접 준다.
   값은 숨어 있을 때의 한가운데를 그대로 두고 1.875배 한 것이다.
     1번 : 가운데 (64.11%, 43.68%)  2번 : (20.10%, 67.22%)  3번 : (81.46%, 57.28%) */
.spot.is-clear { z-index: 6; }

.spot-1.is-clear { left: 59.63%; top: 36.31%; width: 8.96%; height: 14.74%; }
.spot-2.is-clear { left: 15.61%; top: 60.34%; width: 8.96%; height: 13.74%; }
.spot-3.is-clear { left: 76.98%; top: 49.91%; width: 8.96%; height: 14.74%; }

/* 종이가 커진 만큼 체크 도장도 같은 비율로 키운다 (전에는 확대에 딸려 커졌다) */
.spot.is-clear .spot-check {
  right: -2.25rem;
  bottom: -2.25rem;
  width: 6.75rem;
  height: 6.75rem;
  border-width: .55rem;
}

.spot.is-clear .spot-check .ico { width: 3.95rem; height: 3.95rem; }

/* 종이 그림. drop-shadow 는 사각형이 아니라 종이 윤곽(기울기·접힌 모서리)을
   그대로 따라가므로, 빛이 포스트잇 모양 그대로 번진다. */
.spot-paper {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(.5rem .7rem .9rem rgba(90, 70, 40, .28));
  transition: transform .22s ease, filter .22s ease;
}

/* 숨은 포스트잇은 스스로 반짝이지 않는다 — 찾는 재미가 없어지기 때문이다.
   대신 돋보기 커서가 위에 닿으면 금빛으로 알려 준다. */
.spot.is-hidden:hover .spot-paper {
  filter: drop-shadow(.8rem 1.4rem 1.6rem rgba(90, 70, 40, .38))
          drop-shadow(0 0 2.6rem rgba(255, 198, 40, .95));
}

/* 모두 찾아 낸 뒤(최종 확인하기가 뜬 뒤)에는 종이가 뜨거나 커지지 않는다.
   이미 다 찾은 마당에 계속 들썩이면 눈만 어지럽다 → 돋보기를 대면
   초록빛이 금빛으로 물들기만 한다.
   transform 을 아예 쓰지 않았고, 등장 애니메이션(spot-return)도 both 로
   자리를 붙들고 있으므로 움직임이 남지 않는다. */
.spot.is-clear:hover .spot-paper {
  filter: saturate(1.18) contrast(1.04)
          drop-shadow(.95rem 1.7rem 2.05rem rgba(90, 70, 40, .34))
          drop-shadow(0 0 4.1rem rgba(255, 198, 40, .95))
          drop-shadow(0 0 7.9rem rgba(255, 176, 0, .55));
}

/* 누르는 순간의 눌림도 아직 못 찾은 종이에만 준다 */
.spot.is-hidden:active .spot-paper { transform: translateY(-.3rem) scale(1.01); }

/* ── 누른 포스트잇 : 떠오르며 커진 뒤 퀴즈로 넘어간다 ── */
.spot.is-opening {
  z-index: 5;          /* 다른 포스트잇 위로 올라온다 */
  animation: none;
}

/* 다 찾은 뒤(체크 도장이 찍힌 상태)에서 누르면 도장을 먼저 걷어 낸다.
   도장이 종이 위에 남아 있으면 종이가 떠오르며 커지는 모양이 가려진다.
   .board.is-intro .spot-check 의 등장 애니메이션(both)이 opacity 를 붙들고 있으므로
   animation 을 끊어야 opacity 0 이 먹는다. 선택자 무게도 그보다 높게 둔다. */
.board .spot.is-opening .spot-check {
  animation: none;
  opacity: 0;
  transition: opacity .12s ease;
}

.spot.is-clear.is-opening { z-index: 7; }   /* 커지는 종이가 다른 두 장보다 위에 오도록 */

/* 선택자를 일부러 무겁게(클래스 6개) 쓴 이유 : 다 찾은 직후(.board.is-intro)에는
   .board.is-intro .spot.is-clear .spot-paper (클래스 5개) 의 등장 애니메이션이 both 로
   붙어 있는데, 같은 무게로 spot-open 을 걸면 뒤에 있는 등장 규칙이 이겨 눌러도 커지지
   않는다 (실제로 그랬다). 반드시 그보다 한 단계 무겁게 둔다. */
.board .spot.is-opening .spot-paper,
.board .spot.is-opening:hover .spot-paper,
.board.is-intro .spot.is-clear.is-opening .spot-paper {
  animation: spot-open .78s cubic-bezier(.25, .6, .3, 1) forwards;
}

@keyframes spot-open {
  0%   { transform: translateY(0) scale(1); opacity: 1; }
  26%  { transform: translateY(-2.6rem) scale(1.1); opacity: 1; }
  100% { transform: translateY(-4rem) scale(2.4); opacity: .88; }
}

@media (prefers-reduced-motion: reduce) {
  .board .spot.is-opening .spot-paper,
  .board.is-intro .spot.is-clear.is-opening .spot-paper { animation: none; }
}

/* ── 모두 해결! : 사라졌던 세 장이 차례로 제자리에 돌아온다 ──
   문제를 풀면 그 포스트잇은 보드에서 빠지고, 세 장을 다 풀었을 때
   0.26초 간격으로 하나씩 내려앉는다. 마지막 장이 1.07초에 앉으므로
   최종 확인하기 버튼은 그 뒤인 1.2초에 찍힌다. */
/* 번짐 반지름은 확대가 사라진 만큼 1.875배로 옮겨 적었다.
   다만 바깥쪽 초록 번짐은 .7 → .38 로 줄였다. 넓고 진한 초록빛이 종이 가장자리까지
   덮어 노란 종이가 뿌옇고 연해 보였기 때문이다.
   대신 saturate 로 종이 자체의 색을 올려 또렷하게 만든다. */
.spot.is-clear .spot-paper {
  filter: saturate(1.18) contrast(1.04)
          drop-shadow(.95rem 1.7rem 2.05rem rgba(90, 70, 40, .34))
          drop-shadow(0 0 3rem rgba(46, 160, 100, .92))
          drop-shadow(0 0 6.4rem rgba(46, 160, 100, .38));
}

/* 등장 애니메이션은 마지막 문제를 막 풀고 보드로 돌아온 순간(.is-intro)에만 튼다.
   다 찾은 뒤 포스트잇을 눌러 문제를 다시 보고 확인을 누르면 보드를 다시 그리는데,
   그때마다 세 장이 다시 날아오고 도장이 다시 찍히면 어지럽다. */
.board.is-intro .spot.is-clear .spot-paper {
  animation: spot-return .55s cubic-bezier(.25, .7, .3, 1) both;
  animation-delay: calc(var(--spot-order, 0) * .26s);
}

@keyframes spot-return {
  0%   { transform: translateY(-4rem) scale(.55); opacity: 0; }
  60%  { transform: translateY(.5rem) scale(1.1); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

/* 초록 체크 도장 */
/* 종이가 80px(≒7.6rem)로 작아졌으니 도장도 함께 줄이고,
   좁은 종이 위를 덜 가리도록 모서리에 살짝 걸치게 둔다. */
.spot-check {
  position: absolute;
  right: -1.2rem;
  bottom: -1.2rem;
  display: grid;
  width: 3.6rem;
  height: 3.6rem;
  place-items: center;
  color: #fff;
  background: var(--ok);
  border: .3rem solid #fff;
  border-radius: 50%;
  box-shadow: 0 .5rem 1.4rem rgba(0, 0, 0, .3);
}

/* 도장은 종이와 같은 순간에 찍힌다 — 종이가 다 앉은 뒤(+.45s)에 찍으면 한 박자 늦어 보인다 */
.board.is-intro .spot-check {
  animation: stamp-pop .4s ease-out both;
  animation-delay: calc(var(--spot-order, 0) * .26s);
}

.spot-check .ico { width: 2.1rem; height: 2.1rem; }

@keyframes stamp-pop {
  0%   { transform: scale(0) rotate(-25deg); opacity: 0; }
  60%  { transform: scale(1.18) rotate(6deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}


/* 가운데 아래 : 최종 확인하기 */
.btn-final {
  position: absolute;
  left: 0;            /* 새 배경은 좌우가 고른 그림이라 화면 정가운데에 둔다 */
  right: 0;
  /* 아래 크림색 띠는 제목이 쓰므로 버튼은 그림판 안쪽 아래에 둔다.
     버튼은 화면 가운데 x 670~1002, y 634~735 를 쓰는데
     커진 포스트잇 세 장(x 251~401 / 973~1123 / 1273~1423)과 좌우가 겹치지 않고,
     그림판 밑변(y 764)보다 위다. */
  bottom: 20.65rem;   /* 19.7 + 10px(≒.95rem) */
  width: fit-content;
  margin: 0 auto;          /* transform 대신 여백으로 가운데 — 애니메이션과 겹치지 않는다 */
  min-height: 8.4rem;
  padding: 1.6rem 5.4rem;
  /* 흰 바탕 + 진초록 테두리는 옅은 배경 위에서 묻힌다.
     찾은 목록 테두리와 같은 연두(#9be06a)로 채워 화면에서 하나뿐인 밝은 초록 덩어리로 만든다.
     글자는 흰색으로 두고, 아랫줄은 한 단계 짙은 연두로 눌리는 느낌을 준다. */
  color: var(--title-ink);          /* 제목(숨겨진 포스트잇을 찾아 보세요!)과 같은 색 */
  background: #fff;                 /* 안은 흰색, 테두리는 노란색(눈에 띄게) */
  border: .8rem solid #ffd93d;      /* 두껍고 밝은 노랑 — 네 변 같은 두께(아랫변만 두꺼우면 모서리 이음새가 어긋나 보인다) */
  border-radius: 1.6rem;
  font-size: 3.4rem;
  font-weight: 900;
  /* 아랫띠 : 테두리 대신 번짐 없는 그림자(0 .7rem)로 깐다 — 둥근 모서리를 그대로 따라가서 ‘정답 확인하기’처럼 자연스럽다 */
  box-shadow: 0 .7rem 0 0 #f0b429;
}

.board.is-intro .btn-final {
  animation: stamp-pop .4s ease-out both;
  animation-delay: 1.2s;   /* 세 장이 모두 돌아온 뒤에 찍힌다 */
}

/* 마우스를 올리면 연두가 한 단계 밝아진다 */
.btn-final:hover { background: #fff7dd; }
.btn-final:active { transform: translateY(.2rem); box-shadow: 0 .5rem 0 0 #f0b429; }

/* 누르면 버튼이 먼저 쪼그라들며 사라지고, 그다음 결과 화면이 열린다.
   마지막 문제를 막 풀고 돌아온 화면(.board.is-intro)에서는 위의 stamp-pop 규칙(클래스 3개)이
   이 규칙(클래스 2개)을 이겨 사라지는 동작이 안 나왔다 → 같은 조합을 한 번 더 적어 4개로 올린다. */
.btn-final.is-leaving,
.board.is-intro .btn-final.is-leaving {
  pointer-events: none;
  animation: final-leave .38s ease-in forwards;
}

@keyframes final-leave {
  0%   { transform: scale(1) translateY(0);        opacity: 1; }
  100% { transform: scale(.65) translateY(1.8rem); opacity: 0; }
}

/* 움직임을 줄이도록 설정한 기기에서는 흔들림·튀어오름 없이 빛만 */
@media (prefers-reduced-motion: reduce) {
  .board.is-intro .spot.is-clear .spot-paper, .board.is-intro .spot-check, .board.is-intro .btn-final,
  .result.is-intro .find-card, .result.is-intro .restart-row { animation: none; }
  .spot.is-clear .spot-paper {
    filter: drop-shadow(.5rem .7rem .9rem rgba(90, 70, 40, .28))
            drop-shadow(0 0 2.2rem rgba(255, 198, 40, 1));
  }
}

/* 퀴즈 화면 배경 — 바로 앞 보드 화면과 똑같은 보물찾기 그림을 쓴다(--board-bg).
   그림이 다르면 화면이 넘어갈 때 배경이 바뀌어 눈에 거슬린다.
   다만 그림이 물건투성이라 그대로 두면 문제 포스트잇이 묻힌다. 그래서 여기서
   세 가지로 가라앉힌다.
     · blur 9px  → 형태를 알아볼 수 없을 만큼 뭉갠다
     · saturate .78 → 장난감들의 쨍한 색을 죽인다
     · 흰 막 57% → 민트(211,240,228)가 아주 옅은 (236,249,243)으로 바랜다.
       어둡게 덮는 대신 하얗게 날려 배경을 뒤로 물린다.
   .stage 에 직접 걸면 위에 얹힌 포스트잇과 글자까지 흐려지므로
   그림을 가상 요소로 내려 깔고 거기에만 준다.
   가상 요소는 3rem 넓게 깔되 그림은 무대와 똑같은 자리·크기에 그린다.
   (blur 9px 는 30px 가까이까지 번져 나가므로 1rem 여유로는 테두리가 뜬다.)
   넘치는 부분은 무대의 overflow:hidden 이 잘라 낸다. */
.stage.is-quiz::before {
  content: "";
  position: absolute;
  /* blur 는 요소 바깥(투명)까지 빨아들여 테두리를 뿌옇게 만든다.
     그래서 3rem 넓게 깔되, 그림 자체는 아래 position/size 로 무대와
     정확히 같은 자리·같은 크기에 그린다. 넓힌 만큼 그림까지 늘어나면
     화면이 바뀔 때 배경이 1~2% 커지며 움직여 보인다. */
  inset: -3rem;
  z-index: 0;
  background-color: rgb(203, 219, 215);   /* 그림 바깥 여유분을 그림 바탕과 같은 진초록으로 */
  background-image: linear-gradient(rgba(255, 255, 255, .57), rgba(255, 255, 255, .57)), var(--board-bg);
  background-repeat: no-repeat, no-repeat;
  /* 흰 막은 여유분까지 덮고(0 0 / 100%), 그림만 무대 자리에 맞춘다(3rem / 100% - 6rem) */
  background-position: 0 0, 3rem 3rem;
  background-size: 100% 100%, calc(100% - 6rem) calc(100% - 6rem);
  filter: blur(9px) saturate(.78);
}

/* 흐려진 배경 위로 내용이 올라와야 한다 */
.stage.is-quiz .stage-body { position: relative; z-index: 1; }

/* ── 결과 화면 배경 ────────────────────────────────
   포스트잇 세 장이 주인공이라 배경은 퀴즈 화면보다 한 단계 더 뭉갠다.
     · blur 14px (퀴즈 화면은 9px) → 물건들이 형태를 잃고 색 덩어리만 남는다
     · saturate .7 → 남은 색마저 가라앉힌다
     · 흰 막 50% → 민트(211,240,228)가 (233,248,242)로 바랜다. 문제 화면(57%)보다
       조금 진하게 남겨야 위에 얹은 흰 카드·흰 알약이 배경에 묻히지 않는다
   blur 14px 는 45px 가까이 번지므로 여유를 4rem 으로 넓혔고,
   그림 자리·크기는 그만큼 되돌려 무대와 정확히 겹치게 둔다. */
.stage.is-result::before {
  content: "";
  position: absolute;
  inset: -4rem;
  z-index: 0;
  background-color: rgb(203, 219, 215);
  background-image: linear-gradient(rgba(255, 255, 255, .5), rgba(255, 255, 255, .5)), var(--board-bg);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 0, 4rem 4rem;
  background-size: 100% 100%, calc(100% - 8rem) calc(100% - 8rem);
  filter: blur(14px) saturate(.7);
}

/* 퀴즈 화면은 포스트잇 한 장뿐이라 무대 여백을 줄여 세로 공간을 벌어 준다 */
.stage.is-quiz .stage-body { padding: 1rem 4rem; }

/* 가운데 정렬 기준은 눈에 보이는 종이다.
   캔버스 위쪽 투명 여백(8.8%)이 아래쪽(3.5%)보다 커서 종이가 2.2rem 처져 보이므로
   margin-top -4.3rem 으로 그 절반만큼 끌어올린다(플렉스 가운데 정렬은 margin 까지 포함해 재기 때문). */
.stage.is-quiz .case-file { margin-top: -4.3rem; }


/* ── 무대 ───────────────────────────────────── */
.stage-body {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 3.2rem 4rem 1.6rem;
}


/* ── 사건 기록 파일(서류철) : 모든 화면 공통 ───
   시작·문제·결과·팝업 화면 모두 같은 서류철 안에 담긴다.
   ① 이름표(탭) ② 폴더 몸통 ③ 속지 ④ 오른쪽 색인 탭 ⑤ 클립
   ──────────────────────────────────────────── */



.case-file {
  position: relative;
  /* 그림 캔버스와 같은 3:2. 세로는 최소값이라 내용이 길면 조금 늘어난다. */
  width: 123rem;
  min-height: 82rem;
  margin-top: 0;      /* 종이 위로 튀어나오는 요소가 없어 따로 비울 필요가 없다 */
}

/* 포스트잇 종이 — 받은 그림(3:2 캔버스, 1536×1024)을 똑바로 세우고(원본이 0.9~2.4° 기울어 있었다)
   하늘·연두 스티커를 노랑 스티커와 같은 크기·자리로 맞춘 뒤(가로 0.95배 · 세로 1.01~1.02배) 폭 1300 으로 줄여, 자르거나 뭉개지 않고 그대로 채운다. 위쪽에 구멍 띠가 있고 둘레에 흰 테두리가 있다(원본의 오른쪽 위 클립은 지웠다).
   상자도 같은 3:2(123×82rem)라 기본 상태에선 찌그러짐이 없다.
   캔버스 위에 투명 여백 8.8%, 아래 3.5% 가 있어 종이가 조금 아래로 처지므로 margin-top -4.3rem 으로 되돌린다.
   답을 고른 뒤처럼 내용이 길어지면 min-height 를 넘겨 상자가 조금 늘어나고(최대 약 5%),
   늘어난 만큼 구멍이 아주 살짝 길어지지만 눈에 띄지 않는다.

   0 노랑 · 1 하늘 · 2 연두 다 — 누른 포스트잇과 열리는 종이 색이 맞아야 한다. */

.case-file::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--paper-img) center / 100% 100% no-repeat;
  filter: drop-shadow(0 1rem 1.6rem rgba(0, 0, 0, .16));
}

/* 내용이 앉는 자리 : 위는 구멍 띠, 좌우·아래는 흰 테두리를 피해 여백을 준다 */
.case-paper {
  position: relative;
  z-index: 1;
  padding: 22.9rem 12.4rem 10.7rem 13rem;
}

/* 여백은 세 장 캔버스에서 잰 값 중 최대치(세 장이 같은 크기라 사실상 노랑 기준 : 구멍 띠 밑 21.8% / 앞장 밑변 7.0% / 좌 8.1% / 우 7.6%)에
   숨통을 더한 것이다 — 위는 구멍 띠 밑 17.9rem + 4.9, 아래는 밑변 5.7rem + 4.9 로 같게, 좌우는 약 3rem.
   4.9rem 은 답을 고르기 전 화면(질문 머리 5.7 · 선택지 18 · 그림+단추 줄 15 = 38.7rem)을 82rem 상자에
   놓았을 때 위아래 바깥 여백과 덩어리 사이 두 여백, 네 칸이 모두 같아지는 값이다.
   글자 자리는 97.6 × 49.1rem. */
.case-file.is-tight .case-paper { padding: 22.9rem 12.4rem 10.7rem 13rem; }
.case-file.is-roomy .case-paper { padding-top: 22.9rem; padding-bottom: 10.7rem; }

/* 문제 화면 : 속지를 상자 높이(82rem)만큼 세로로 펴고, 글자 자리 세로 48.4rem 안에
   질문 줄 · 선택지(18) · 맨 아래 줄 세 덩어리를 같은 간격으로 벌려(space-between) 놓는다.
   그래서 답을 고르기 전후 모두 선택지 위아래 여백이 같고, 맨 아래 줄은 늘 바닥에 붙는다.
   · 답을 고르기 전 : 맨 아래 줄은 단추 높이 8rem 만 차지 → 질문 한 줄(5.7)이면 여백 8.35rem, 두 줄(10.2)이면 6.1rem.
   · 답을 고른 뒤 : 해설 상자(한 줄 13.4 · 두 줄 16.8rem) → 여백 5.65 / 3.95rem (질문 두 줄이면 3.4 / 1.7rem).
   덩어리 사이 최소 간격은 gap 1.5rem — 각 덩어리의 margin 은 0 으로 지워 간격이 어긋나지 않게 한다. */
.stage.is-quiz .case-paper { display: flex; flex-direction: column; justify-content: space-between; gap: 1.5rem; min-height: 82rem; }
.stage.is-quiz .clue, .stage.is-quiz .ask { margin-bottom: 0; }
.stage.is-quiz .act, .stage.is-quiz .wrap-up { margin-top: 0; }
/* 답을 고르기 전 맨 아래 줄 : 자리는 단추 높이(8rem)만큼만 잡는다(안내 글 · 단추뿐이다).
   flex-wrap 이 wrap 이면 여러 줄 상자로 쳐서 안내 글이 길 때 단추가 아래로 밀리므로 nowrap 으로 두고,
   혹시 모를 줄바꿈에 대비해 줄 묶음도 바닥(align-content: flex-end)에 붙인다. 안내 글은 flex 1 1 0 이라 줄바꿈 없이 남는 폭만 쓴다.
   좌우 6.6rem 을 비워 ‘정답 확인하기’의 오른쪽 끝을 B 카드 오른쪽 끝에, 안내 글의 왼쪽 끝을 A 카드 왼쪽 끝에 맞춘다. */
.stage.is-quiz .act { height: 8rem; margin: 0 6.6rem; flex-wrap: nowrap; align-content: flex-end; }

/* 해설 줄 : 상자를 선택지 카드 폭에 딱 맞춘다 — 왼쪽 끝은 A 카드 왼쪽, 오른쪽 끝은 B 카드 오른쪽(속지 양끝에서 6.6rem).
   초록 상자의 ‘확인’ 단추는 상자 안 오른쪽에 들어가므로 상자 밖에는 아무것도 없다. */
.stage.is-quiz .wrap-up { position: relative; margin: 0 6.6rem; }
.stage.is-quiz .wrap-up .verdict { position: relative; z-index: 1; }


/* 머리말 */
.case-head { display: flex; align-items: center; gap: 3.6rem; margin-bottom: 2.8rem; padding-right: 20rem; }
.case-kid { position: relative; flex: 0 0 auto; width: 22rem; }
.case-mark { position: absolute; top: 3.6rem; left: -2rem; width: 5.2rem; }

.case-head h1 {
  display: flex;
  align-items: flex-end;
  gap: .8rem;
  margin: 0 0 1.2rem;
  color: var(--navy-deep);
  font-size: 5.6rem;
  line-height: 1.1;
  letter-spacing: -.05em;
}

.case-head h1 b {
  background: linear-gradient(transparent 56%, #fadf8c 56%, #fadf8c 93%, transparent 93%);
}

.case-lead { margin: 0; color: #6c5b42; font-size: 2.4rem; font-weight: 700; }

/* 이번 사건 */
.case-brief {
  position: relative;
  overflow: hidden;
  margin-bottom: 2.8rem;
  padding: 2.6rem 2.6rem;
  background: #fdf4de;
  border: .3rem dashed #e2be5c;
  border-radius: 1.6rem;
}

.case-watermark { position: absolute; top: 50%; right: 3.4rem; width: 15rem; color: #efe4c6; transform: translateY(-50%); }
.case-brief-label, .case-brief b, .case-brief p { position: relative; }
.case-brief-label { color: #8a6a12; font-size: 1.9rem; font-weight: 900; }
.case-brief b { display: block; margin: .4rem 0 .6rem; color: var(--navy-deep); font-size: 3.4rem; letter-spacing: -.03em; }
.case-brief p { margin: 0; color: #6b5a2e; font-size: 2.2rem; font-weight: 700; }

/* 시작 줄 */
.case-go { display: flex; flex-wrap: wrap; align-items: center; gap: 2.6rem; }
.case-go .btn { min-height: 7.2rem; padding: 1.4rem 3.4rem; }

/* ── 버튼 ───────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  min-height: 7.6rem;
  padding: 1.4rem 3.2rem;
  color: #fff;
  background: var(--navy);
  border: 0;
  border-bottom: .7rem solid var(--navy-deep);
  border-radius: 1.4rem;
  font-size: 3rem;
  font-weight: 900;
}

.btn:hover:not(:disabled) { filter: brightness(1.09); }
.btn:active:not(:disabled) { transform: translateY(.2rem); border-bottom-width: .4rem; }
.btn:disabled { opacity: .42; }
/* 퀴즈 전용 노랑 단추(정답 확인하기 · 순서 확인하기) : 흐린 노랑 #f6c445 → 쨍한 노랑 #ffc21f */
.btn-sun { color: #4a3000; background: #ffc21f; border-bottom-color: #e08a00; }

/* 퀴즈 화면 : 정답을 맞힌 뒤 뜨는 ‘확인’ — 누르면 포스트잇 화면으로 */
.quiz-done { display: flex; justify-content: center; margin-top: 0; }   /* 해설 상자 옆에 나란히 서므로 위 여백이 필요 없다 */

.btn-done {
  min-height: 7.6rem;
  padding: 1.25rem 5.2rem;   /* 글자가 3.2rem 으로 .btn(3rem)보다 커서 위아래를 .15 줄여 ‘정답 확인하기’와 같은 8rem 높이로 */
  color: #fff;
  background: #10a355;   /* 차분한 초록 #1c7a4e → 밝고 진한 초록. 흰 글자 대비 3.3:1 */
  border-bottom-color: #0b7a3f;
  font-size: 3.2rem;
}


/* 결과 화면 : 처음부터 다시 */
.restart-row { display: flex; justify-content: center; margin-top: 3.4rem; }

/* 최종 확인하기와 같은 생김새 — 크기·모서리·테두리 두께·아랫줄 그림자까지 맞춘다.
   알약 모양이던 것을 둥근 네모로 바꾸고 테두리를 .35 → .5rem 으로 두껍게,
   아랫줄만 .9rem 진한 색으로 두어 눌리는 버튼처럼 보이게 한다.
   색만 파랑으로 남긴다 — 초록(최종 확인)과 역할이 다른 버튼이기 때문이다. */
.btn-restart {
  min-height: 8.4rem;
  padding: 1.6rem 5.4rem;
  color: var(--res-blue);
  background: #fff;
  border: .5rem solid var(--res-blue);   /* 네 변 같은 두께 */
  border-radius: 1.6rem;
  font-size: 3.4rem;
  font-weight: 900;
  box-shadow: 0 .7rem 0 0 var(--res-edge);   /* 아랫띠는 번짐 없는 그림자로 — 둥근 모서리를 따라간다 */
}

/* :not(:disabled) 를 붙여야 .btn 의 hover·active 규칙(선택자 무게가 더 높다)을 이긴다 */
.btn-restart:hover:not(:disabled) {
  background: #eef5ff;
  border-color: var(--res-badge);
  filter: none;
}

.btn-restart:active:not(:disabled) { transform: translateY(.2rem); box-shadow: 0 .5rem 0 0 var(--res-edge); }

/* ── 시작 화면 : 배경 위에 큰 버튼 하나만 ───── */
.start-gate {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  width: 100%;
  height: 100%;
  text-align: center;
}

/* 표지 제목 : 빈 사건 보드 한가운데 */
.cover-title {
  margin: 0 0 2.2rem;
  color: var(--title-ink);
  font-size: 7.6rem;
  font-weight: 900;
  letter-spacing: -.03em;
}

.cover-lead {
  max-width: 90rem;
  margin: 0 0 6rem;
  color: var(--cover-lead);
  font-size: 3.4rem;
  font-weight: 700;
  line-height: 1.45;
}

.btn-start {
  display: inline-flex;
  align-items: center;
  padding: 2.2rem 7rem;
  color: var(--title-ink);
  background: #5fd0ac;
  border: 0;
  border-bottom: .8rem solid #33a684;
  border-radius: 99rem;
  font-size: 5.2rem;
  font-weight: 900;
  letter-spacing: -.02em;
  box-shadow: 0 1.4rem 3rem rgba(51, 166, 132, .34);
  transition: filter .14s ease, transform .14s ease;
}

.btn-start:hover { filter: brightness(1.08); transform: translateY(-.4rem); }
.btn-start:active { transform: translateY(.2rem); border-bottom-width: .4rem; }

/* ── 문제 화면 ──────────────────────────────── */

/* 단서(추천 화면의 특징) : 상자 없이 돋보기 + 제목 + 설명만. 질문 상자 바로 아래에 놓인다 */
.clue {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 2rem;
  align-items: center;
  margin-bottom: 3.6rem;
}

.clue-icon {
  display: grid;
  width: 4.8rem;
  height: 4.8rem;
  place-items: center;
  color: #6b4f06;
  background: var(--sun);
  border-radius: 50%;
}

.clue-icon .ico { width: 2.6rem; height: 2.6rem; }
.clue-body { min-width: 0; }
.clue-title { display: block; margin-bottom: .5rem; color: var(--title-ink); font-size: 2.8rem; line-height: 1.3; font-weight: 900; }
/* 줄바꿈은 자동으로 맡기지 않고 자료(material)에 넣은 줄바꿈 문자를 그대로 따른다.
   pre-line 은 줄바꿈만 살리고 잇단 공백은 무시하므로, 문장을 어디서 끊을지
   글 쓰는 사람이 정할 수 있다. 지금은 세 자료 모두 줄바꿈이 없어 한 줄로 나온다.
   쓸 수 있는 폭은 90.8rem (속지 97.6 - 돋보기 4.8 - 사이 2).
   가장 긴 1번 자료가 24.96em × 2.5rem ≒ 62.4rem 이라 28rem 넘게 남는다. */
.clue-text { margin: 0; font-size: 2.5rem; font-weight: 800; line-height: 1.4; white-space: pre-line; }



/* 이 화면의 주인공. 가장 긴 질문이 19.1em(자간 포함)이라 4rem 이면 속지 97.6rem 폭에 한 줄로 넉넉히 들어간다(76rem) */
/* 질문 머리 — 큰 질문은 Hint! 와 상관없이 속지 전체 폭(97.6rem)의 한가운데에 놓는다.
   Hint! 는 흐름에서 빼서(absolute) 오른쪽 끝에 붙이고 질문 줄의 세로 가운데에 맞춘다.
   그래서 질문의 가운데가 곧 종이의 가운데다. 높이는 Hint!(5.2rem)보다 큰 질문 한 줄(5.1rem)에 min-height 5.7 로 맞춘다.
   Hint! 를 누르면 자료 설명이 말풍선으로 열린다. */
.ask {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 5.7rem;
  margin-bottom: 2.8rem;
  text-align: center;
}
/* Hint! — 질문 줄 오른쪽에 떠 있다(absolute). 글자만 있고 돋보기는 없다(말풍선 안에 돋보기가 있어 겹친다). 누르면 자료 설명(돋보기 + 제목 + 설명)이 말풍선으로 열린다.
   오른쪽 끝은 B 카드 오른쪽 끝(속지 오른쪽에서 6.6rem) — ‘정답 확인하기’ · ‘확인’ 과 같은 선이다.
   질문은 종이 한가운데에 한 줄로 놓이고, Hint!(약 7.8rem 폭 · 글자 2.2 · 좌우 1.4rem)와 겹치지 않도록
   h1 양옆에 15.4rem 씩 자리를 비운다(아래 .ask h1). */
.hint-btn {
  position: absolute;
  top: 50%;
  right: 6.6rem;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  min-height: 5.2rem;
  padding: .6rem 1.4rem;
  color: #4a3000;
  background: #ffc21f;   /* 정답 확인하기와 같은 쨍한 노랑 */
  border: 0;
  border-bottom: .5rem solid #e08a00;
  border-radius: 99rem;
  font-size: 2.2rem;
  font-weight: 900;
  white-space: nowrap;
  transition: filter .14s ease, transform .14s ease;
}
.hint-btn:hover { filter: brightness(1.06); transform: translateY(calc(-50% - .2rem)); }
.hint-btn[aria-expanded="true"] { background: #ffd85c; }
.hint-pop {
  position: absolute;
  top: calc(100% + 1.2rem);
  right: 0;
  z-index: 5;
  width: 60rem;
  padding: 1.6rem 2.4rem;
  background: #fff8dd;               /* 말풍선도 한 단계 노랗게 */
  border: .3rem dashed #ffb300;
  border-radius: 1.6rem;
  box-shadow: 0 1rem 2.2rem rgba(0, 0, 0, .18);
  text-align: left;
}
.hint-pop .clue { margin: 0; }
/* 큰 질문 : 속지 폭 97.6rem 한가운데에 반드시 한 줄(nowrap). 양옆 15.4rem(Hint! 자리 6.6 + 7.8 + 사이 1)을 비운 66.8rem 안에
   가장 긴 3번(18.8em, 자간 -.045em 포함)이 들어가도록 글자를 3.5rem 으로 잡는다 → 65.7rem, 양옆 .5rem 남는다. */
.ask h1 { width: 100%; margin: 0; padding: 0 15.4rem; box-sizing: border-box; font-size: 3.5rem; line-height: 1.28; letter-spacing: -.045em; font-weight: 900; text-align: center; white-space: nowrap; }

/* 카드 사이를 8rem 벌리고 그 한가운데에 VS 동그라미를 띄운다.
   양옆 6.6rem 은 비운다(장식 그림은 없앴다) → 카드 한 장 폭 = (97.6 - 13.2 - 8) / 2 = 38.2rem */
/* 카드 두 장을 딱 붙여 놓고(gap 0) 마주 보는 변만 대각선으로 잘라 낸다.
   그러면 둘이 합쳐 한 장의 둥근 네모가 비스듬히 갈라진 모양이 되고, 갈라진 틈으로 포스트잇 종이가
   비쳐 띠처럼 보인다. 틈은 카드에서 잘라 낸 폭(3.6rem)이 그대로 되므로 gap 은 0 이어야 한다.
   카드 한 장 폭 = (97.6 - 13.2) / 2 = 42.2rem. */
.answers { position: relative; display: grid; gap: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0 6.6rem; }
/* 배경 물음표·느낌표 : 카드 줄 양옆 빈자리에 아주 연하게. 글자라 따로 그림이 필요 없다 */
/* 마스킹테이프 — 문제 포스트잇 왼쪽 위 · 오른쪽 아래 모서리에 비스듬히 붙인다.
   그림(폭 800, 5:1, 수평으로 세워 둔 것)을 24rem 폭으로 놓고 -25° 돌린다. 가운데 좌표를 left/top 으로 주고 translate(-50%,-50%) 로 맞춘다.
   받은 스케치대로 종이 안쪽으로 들어와 왼쪽 위는 첫 구멍을 덮고, 오른쪽 아래는 큰 느낌표 위를 덮는다.
   z-index 1 : 배경 부호(.qmark, z 0)보다 위라 느낌표가 테이프를 비치지 않고, 정답 뒤 해설 상자(z 1, DOM 뒤)는 테이프 위에 온다. 누를 수 없다. */
.tape { position: absolute; z-index: 1; width: 24.48rem; height: auto; pointer-events: none; }   /* 24 + 5px(≒.48rem). 그림자 없음 — 종이에 바로 붙은 느낌 */
.tape-tl { left: 16.3rem;  top: 13.5rem; transform: translate(-50%, -50%) rotate(-25deg); }   /* (16, 14) 에서 오른쪽 3px(.29rem) · 위 5px(.48rem) */
.tape-br { left: 107.8rem; top: 73.5rem; transform: translate(-50%, -50%) rotate(-25deg); }   /* (107.5, 73) 에서 오른쪽 3px(.29rem) · 아래 5px(.48rem) */

.qmark {
  position: absolute;
  z-index: 0;
  color: var(--ink);
  opacity: .1;
  font-weight: 900;
  line-height: 1;
  pointer-events: none;
  user-select: none;
}
.qmark-1 { left: 11.2rem; top: 30rem; font-size: 7.5rem; transform: rotate(-14deg); }
.qmark-2 { right: 10.8rem; top: 31rem; font-size: 6.5rem; transform: rotate(12deg); }
.qmark-3 { left: 27rem; top: 18.2rem; font-size: 4.2rem; transform: rotate(12deg); opacity: .08; }
/* 오른쪽 아래 구석의 큰 느낌표 — 정답 확인하기 줄 오른쪽 빈 칸(정답 뒤엔 확인 단추 뒤로 일부 숨는다) */
.qmark-4 { right: 15.15rem; top: 63.45rem; font-size: 9.5rem; transform: rotate(10deg); }   /* 처음 자리(10.4 / 62.5)에서 왼쪽 50px(4.75rem)·아래 10px(.95rem) */
/* 배경 별·반짝이 : 물음표·느낌표와 같은 결(같은 잉크색 · 8~10% 불투명)로 아주 연하게.
   물음표·느낌표가 카드 줄 양옆과 질문 위쪽에 있으므로, 별·반짝이는 비어 있는 아래 왼쪽(예전 스티커 자리)에 셋,
   단추 왼쪽 위에 하나, 질문 위쪽에 둘을 두어 종이 전체에 고루 퍼지게 한다. 자리는 상자(123×82rem) 기준이다.
   글꼴에 없는 모양이라 SVG 로 그린다(fill: currentColor). */
.qshape { position: absolute; z-index: 0; color: var(--ink); opacity: .09; pointer-events: none; }
.qshape path { fill: currentColor; }
.qshape-1 { left: 20.05rem; top: 58.55rem; width: 8.3rem; height: 8.3rem; transform: rotate(-12deg); opacity: .1; }   /* 아래 왼쪽 큰 별 — 6.4 에서 20px(1.9rem) 키우고 가운데는 그대로 */
.qshape-2 { left: 37rem;  top: 65rem;   width: 4.8rem; height: 4.8rem; }                                          /* 아래 왼쪽 반짝이 */
.qshape-3 { left: 52rem;  top: 57.5rem; width: 3.6rem; height: 3.6rem; transform: rotate(18deg); opacity: .08; }  /* 아래 가운데 작은 별 */
.qshape-4 { right: 27rem; top: 56rem;   width: 5.2rem; height: 5.2rem; opacity: .1; }                             /* 단추 왼쪽 위 반짝이 */
.qshape-5 { right: 44rem; top: 18.6rem; width: 3.4rem; height: 3.4rem; transform: rotate(10deg); opacity: .08; }  /* 질문 위 오른쪽 작은 별 */
.qshape-6 { left: 34rem;  top: 18.4rem; width: 3rem;   height: 3rem;   opacity: .08; }                            /* 질문 위 왼쪽 작은 반짝이 */

/* 카드 사이의 VS — 회색 동그라미 배지를 없애고 글자 자체를 입체로 세운다.
   흰 테는 두지 않는다. 두께는 글자색보다 진한 색을 아래로 .55rem 밀어 넣은 그림자가 만들고,
   그 밑에 옅고 퍼진 그림자를 한 겹 더 깔아 종이에서 뜬 느낌만 남긴다.
   V 는 파랑, S 는 분홍 — 두 글자 색을 갈라 두 선택지가 맞붙는 느낌을 살린다.
   자리 : 카드 사이 8rem 틈의 한가운데. 기울이지 않고 똑바로 세워야 글자 덩어리의 가운데와
   틈의 가운데가 어긋나지 않는다. 기울기(rotate)와 흘림(italic)을 빼면 글자 상자의 가운데가
   곧 눈에 보이는 가운데이므로 translate(-50%, -50%) 만으로 정확히 맞는다.
   letter-spacing 은 마지막 글자 뒤에도 붙어 가운데를 밀므로 0 으로 둔다. */
.vs {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 1;
  display: flex;
  align-items: center;
  font-size: 6.8rem;
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0;
  transform: translate(-50%, -50%);
  pointer-events: none;
  user-select: none;
}
/* 제 색으로 테두리를 둘러 획을 굵힌다 — 색이 같아 윤곽선이 아니라 글자가 두꺼워진 것처럼 보인다 */
.vs b, .vs i { font-style: normal; -webkit-text-stroke: .5rem currentColor; paint-order: stroke fill; }
.vs b { color: #1387e0; text-shadow: 0 .55rem 0 #0a5f9e, 0 .8rem .6rem rgba(0, 0, 0, .22); }
.vs i { color: #ff5c9d; text-shadow: 0 .55rem 0 #cf3b74, 0 .8rem .6rem rgba(0, 0, 0, .22); }

/* 선택지가 셋이면 가운데 카드의 양쪽을 다 자를 수 없어 대각선을 쓰지 않는다 — 예전처럼 떼어 놓는다 */
.answers-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8rem; }
/* 선택지가 셋이면 가운데가 카드 자리라 VS 를 놓을 틈이 없다 */
.answers-3 .vs { display: none; }

/* 둥근 네모 카드 : 위에 A/B 알약, 가운데에 큰 글.
   카드 판(채움 + 테두리)은 CSS 가 아니라 SVG path 하나로 그린다(.pick-shape).
   예전에는 [바깥 = 테두리색] 위에 [::before = 속색] 을 덮어 그 차이를 테두리로 삼았는데,
   두 겹의 경계가 따로 계단지게 그려져 비스듬한 변에서 선 굵기가 줄마다 달라져 끊겨 보였다.
   한 붓으로 그리면 그 이음매가 아예 없고, 둥근 모서리도 호(A 명령)라 근사치가 아니다.
   색은 --card-edge(테두리) · --card-fill(속) 두 값으로만 갈아 끼운다. */
.pick {
  --card-fill: #fff;                /* 고르기 전 속면은 순백 — 노랑·하늘·연두 세 포스트잇 위에서 카드가 가장 또렷하다 */
  --card-edge: var(--ink);          /* 연한 하늘은 하늘색 포스트잇 위에서 사라진다 → 문제 문구와 같은 먹빛. 대신 두께를 .5 → 0.3rem 으로 얇게 */
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.6rem;
  min-height: 22rem;       /* 속지 48.41 안에 질문 5.7 + 카드 22 + 가장 긴 해설 16.68 을 놓아도 위아래 2rem 씩 남는다 */
  padding: 1.6rem 2rem 2.2rem;
  color: var(--ink);
  background: none;
  border: 0;
  font-size: 3.1rem;
  font-weight: 900;
  text-align: center;
  transition: transform .14s ease;
}

.pick > * { position: relative; z-index: 1; }
/* 카드 판 — viewBox 가 카드 크기(43.4 × 22rem)와 같아 1 단위 = 1rem 이다.
   경로는 눈에 보이는 윤곽에서 반 두께(0.15rem)만큼 안으로 잡았다 — 선이 경로 한가운데에 그려지므로
   그래야 선의 바깥면이 윤곽과 정확히 맞는다. 글자보다 뒤(z-index 0)에 깔린다. */
.pick-shape {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.pick-shape path {
  fill: var(--card-fill);
  stroke: var(--card-edge);
  stroke-width: 0.3;
  stroke-linejoin: round;
  transition: fill .14s ease, stroke .14s ease;
}

/* 마우스를 올리면 위로만 살짝 뜬다 — 좌우로 움직이면 두 카드 사이 대각선 틈의 폭이 들쭉날쭉해진다 */
.pick:hover:not(:disabled) { transform: translateY(-.4rem); --card-edge: var(--navy); --card-fill: #eef7ff; }
/* 선택지가 셋일 때는 대각선을 쓰지 않으므로 SVG 판 대신 평범한 테두리로 그린다 */
.answers-3 .pick-shape { display: none; }
.answers-3 .pick { background: var(--card-fill); border: 0.3rem solid var(--card-edge); border-radius: 2.4rem; }


/* 채점이 끝나면 고르지 않은 선택지는 연하게 눌러 정답만 도드라지게 */
.pick:disabled:not(.is-right):not(.is-again) {
  color: #a3aab0;
  --card-fill: #f3f1ec;
  --card-edge: #d5d2c9;
}

.pick:disabled:not(.is-right):not(.is-again) .pick-tag {
  color: #a3aab0;
  background: #e9e6de;
  border-color: #cfcbc1;
}

.pick-tag {
  display: inline-flex;
  align-items: center;
  min-height: 4.4rem;
  padding: .2rem 2.6rem;
  color: #fff;
  background: #1387e0;              /* 옅은 하늘 바탕 + 남색 글자 → 진한 파랑 바탕 + 흰 글자 (대비 3.9:1) */
  border: .3rem solid #0a5f9e;
  border-radius: 99rem;
  font-size: 2.3rem;
}

.pick-label { line-height: 1.3; }
/* 카드 오른쪽 아래의 정답 · 다시 · 핀 표시는 없앴다 — 상태는 카드 색으로만 구분한다 */

/* 카드 상태 세 가지 — 표시(핀 · 체크)를 없앤 뒤로는 색이 유일한 신호라 셋을 확실히 갈라 놓는다 */
.pick.is-picked { --card-fill: #fff3c4; --card-edge: #ffb300; }
.pick.is-picked .pick-tag { color: #4a3000; background: #ffc21f; border-color: #e08a00; }

.pick.is-right { --card-fill: #d2f7de; --card-edge: #10a355; }
.pick.is-right .pick-tag { color: #fff; background: #10a355; border-color: #0b7a3f; }

.pick.is-again { --card-fill: #ffe3c7; --card-edge: #ff9233; color: #a4490d; }
.pick.is-again .pick-tag { color: #7a3a08; background: #ffc38a; border-color: #e07b1f; }

/* ── 마주 보는 변을 대각선으로 자른다 (선택지가 둘일 때만) ──────────────────
   모양 자체는 카드 안의 SVG 판(.pick-shape)이 그린다. 여기서는 자리만 잡는다.
   · 음수 여백으로 두 카드를 1.2rem 씩 겹쳐 놓는다 — 기울기(4.4rem/22rem, 11.3°)는 그대로 두면서
     둘 사이 대각선 띠만 2rem 으로 좁히기 위해서다. 띠 한가운데가 곧 .answers 의 가로 한가운데라
     이미 그 자리에 있는 VS 가 두 카드에 걸쳐 놓인다.
   · clip-path 는 눈에 보이라고 두는 게 아니라 누르는 자리를 가르려고 둔다 — 겹친 구역의 클릭이
     전부 위에 깔린 오른쪽 카드로 넘어가지 않게 한다. 보이는 윤곽보다 .25rem 바깥으로 잡아
     테두리를 잘라 먹지 않으면서도, 두 카드의 클릭 구역은 1.5rem 떨어져 서로 겹치지 않는다.
   · 안쪽 여백을 6.4rem 으로 넓혀(바깥은 2rem) 글자가 잘린 자리를 피해 남은 폭 39rem 의 한가운데에 놓인다. */
.answers-2 .pick:nth-of-type(1) {
  margin-right: -1.2000000000000002rem;
  padding-right: 6.4rem;
  clip-path: polygon(0 0, calc(100% - 4.15rem) 0, calc(100% + .25rem) 100%, 0 100%);
}

.answers-2 .pick:nth-of-type(2) {
  margin-left: -1.2000000000000002rem;
  padding-left: 6.4rem;
  clip-path: polygon(-.25rem 0, 100% 0, 100% 100%, 4.15rem 100%);
}

/* 답 고르기 전 줄 : [숨은 자리 그림 | ‘정답 확인하기’ | 빈 칸] 세 칸 격자.
   양끝 칸을 같은 폭(1fr)으로 두어 단추가 속지 한가운데에 온다. 그림이 단추보다 커서 단추는 줄 밑변에 붙인다. */
.act {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: end;
  gap: 3.3rem;
  margin-top: 2.8rem;   /* 질문→선택지 간격과 같게 */
}
.act .act-place { grid-column: 1; justify-self: start; }
.act .btn { grid-column: 2; justify-self: center; }
.act .act-note { grid-column: 3; }

/* 안내 글은 남는 폭만큼만 쓰고 길면 두 줄로 접는다(flex-basis 0 이어야 wrap 줄에서 단추를 밀어내지 않는다) — 그래야 ‘정답 확인하기’가 아래 줄로 떨어지지 않고 오른쪽 자리를 지킨다 */
.act-note { min-width: 0; margin: 0; color: var(--ink-soft); font-size: 2.3rem; font-weight: 800; line-height: 1.4; }

/* 해설 상자 옆의 확인 버튼은 아랫변을 상자 아랫변에 맞춘다(가운데 정렬이면 버튼이 떠 보인다).
   위 간격 2.8rem 은 질문→선택지 간격과 같다 — 답을 고르기 전(.act)과 같은 자리에 온다. */
.wrap-up { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3.3rem; margin-top: 2.8rem; }

.verdict {
  flex: 1 1 48rem;
  display: flex;
  align-items: flex-start;
  gap: 3.1rem;
  padding: 2.6rem 3.5rem;
  border: .3rem solid;
  border-radius: 1.6rem;
}

.verdict > div { flex: 1 1 auto; min-width: 0; }
/* 정답 상자 안의 ‘확인’ 단추 : 글 오른쪽에 두고 상자 세로 가운데에 맞춘다 */
.verdict .btn-done { flex: 0 0 auto; align-self: center; margin-left: auto; }
.verdict strong { display: block; margin-bottom: .4rem; font-size: 2.7rem; }
/* 줄바꿈은 자료에 넣은 줄바꿈 문자를 그대로 따른다(pre-line) — 문장을 어디서 끊을지 글 쓰는 사람이 정한다 */
.verdict p { margin: 0; font-size: 2.3rem; font-weight: 700; line-height: 1.42; white-space: pre-line; }
.verdict .ico { width: 3.2rem; height: 3.2rem; margin-top: .3rem; }
/* 해설 상자 : 바탕은 카드의 같은 상태 색과 한 벌로 맞추고, 테두리만 한 단계 진하게 */
.verdict-ok { color: #0d6b3d; background: #d2f7de; border-color: #10a355; }
.verdict-again { color: #a4490d; background: #ffe3c7; border-color: #ff9233; }
.verdict-hint { color: #0b4f80; background: #d9edff; border-color: #38a8f0; }

/* ── 결과 화면 ──────────────────────────────── */
/* ── 결과 화면 : 보물찾기 배경 위에 그대로 이어진다 ─────────────
   배경을 갈아 끼우지 않아야 “최종 확인하기가 사라지고 → 포스트잇이
   회오리처럼 커지며 채워지는” 흐름이 한 장면처럼 이어져 보인다. */
.result {
  position: absolute;
  inset: 0;
  z-index: 1;   /* 흐려진 배경(.stage.is-result::before) 위로 */
}

/* 머리말 — 배경이 온통 그림이라 흰 카드에 얹어야 읽힌다.
   위 여백은 아래 “처음부터 다시” 버튼의 여백과 같은 5.95rem 이다.
   (원래 위 3.15rem / 아래 5rem 으로 달랐다 → 5rem 으로 맞추고 10px≒.95rem 을 더했다) */
.result-head {
  position: absolute;
  top: 6.9rem;   /* 5.95 + 10px(≒.95rem) */
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: .4rem;
  padding: 2.2rem 6rem 1.8rem;
  text-align: center;
  background: #fff;
  border-radius: 4rem;
  box-shadow: 0 .8rem 2.2rem rgba(0, 0, 0, .16);
}

.result-head h1 { margin: 0; color: var(--res-ink); font-size: 4.6rem; letter-spacing: -.05em; }

.solved-score {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
  margin: 0;
  padding: 0;
  color: var(--res-ink);
  font-size: 2.2rem;
  font-weight: 800;
}

/* 맞힌 개수는 한눈에 들어와야 하는 값이라 둘레 글씨(2.2rem)보다 크게,
   제목(4.6rem)은 넘지 않게 잡는다 */
.solved-score b { color: var(--res-blue); font-size: 4.4rem; }

/* ── 찾아 낸 포스트잇 세 장 ─────────────────────────────
   푼 순서대로 왼쪽부터 채워지고, 한 장을 누르면 그 문제의 기록이 열린다.
   가로 113rem 을 5.5rem 간격 세 칸으로 나누므로 한 칸이 34rem,
   칸 가운데는 행 가운데에서 각각 -39.5 / 0 / +39.5rem 떨어져 있다.
   세로 자리는 머리말 카드 밑(24.8rem)과 처음부터 다시 버튼 위(73.4rem)
   사이 48.6rem 에서 카드 높이 37.3rem(그림 31 + 사이 1.4 + 알약 4.9)을 뺀
   11.3rem 을 위아래로 나눈 값이다 → 24.8 + 5.65 = 30.45rem = 33.8% */
.find-row {
  position: absolute;
  top: 33.8%;
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5.5rem;    /* 4 + 15px(≒1.45rem) */
  width: 113rem;  /* 간격이 1.5rem 늘어난 만큼 두 배 넓혀 칸 폭(34rem)은 그대로 */
}

.find-card {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 1.4rem;
  padding: 0;
  background: none;
  border: 0;
}

/* 등장 애니메이션은 최종 확인하기로 막 들어왔을 때(.is-intro)만 튼다.
   포스트잇을 눌러 기록을 열고 닫으면 화면을 다시 그리게 되는데,
   그때마다 세 장이 날아오면 눈이 어지럽다. */
.result.is-intro .find-card {
  animation: find-fly 1.2s cubic-bezier(.24, .66, .28, 1) both;
  animation-delay: calc(var(--card-order, 0) * .35s);
}

/* 날아오기 — 방금 전까지 자기가 숨어 있던 자리에서 출발한다.
   --from-x / --from-y 는 “숨어 있던 자리 − 제 칸”의 거리라, 처음 한 칸은
   보드에 있던 그 자리에 그 크기(작게, 0.22배)로 놓인 셈이 된다.
   거기서 제 칸으로 날아와 살짝 지나쳤다가 자리를 잡는다.
   출발 간격 0.35초, 한 장이 1.2초라 셋이 겹쳐 날아오되 도착은 왼쪽부터다. */
@keyframes find-fly {
  0% {
    transform: translate(var(--from-x, 0rem), var(--from-y, 0rem)) rotate(-16deg) scale(.22);
    opacity: 0;
  }
  12% { opacity: 1; }
  70% {
    transform: translate(0, -1.8rem) rotate(6deg) scale(1.09);
    opacity: 1;
  }
  86% {
    transform: translate(0, .7rem) rotate(-2deg) scale(.985);
    opacity: 1;
  }
  100% {
    transform: translate(0, 0) rotate(0) scale(1);
    opacity: 1;
  }
}

.find-paper {
  display: block;
  width: 100%;
  height: 31rem;
  object-fit: contain;   /* 세 장의 비율이 달라도(1.076/1.168/1.079) 찌그러지지 않는다 */
  filter: drop-shadow(.6rem 1rem 1.4rem rgba(90, 70, 40, .32));
  transition: transform .16s ease, filter .16s ease;
}

.find-card:hover .find-paper {
  transform: translateY(-1.2rem) scale(1.04);
  filter: drop-shadow(1rem 2rem 2.2rem rgba(90, 70, 40, .42));
}

.find-card:active .find-paper { transform: translateY(-.3rem) scale(1.01); }

/* 설명 글줄도 배경 위에서 읽혀야 하니 작은 흰 알약에 담는다.
   글자색으로 성적을 구분한다 — 오른쪽 위 동그라미 라벨을 뺀 자리를 대신한다.
   두 색 모두 파일 안에서 이미 같은 뜻으로 쓰던 값이다
   (--ok 는 정답 상자·확인 버튼, --again 은 다시 살펴보기 상자). */
.find-note {
  padding: .5rem 2rem;
  background: #fff;
  border-radius: 99rem;
  box-shadow: 0 .4rem 1.2rem rgba(0, 0, 0, .16);
  font-size: 2.6rem;
  font-weight: 800;
  white-space: nowrap;
}

.find-card.is-clean .find-note { color: var(--ok); }      /* 초록 #1c7a4e */
.find-card.is-again .find-note { color: var(--again); }   /* 갈색빛 주황 #8a4f15 */

/* 처음부터 다시 — 세 장이 모두 내려앉은 뒤(0.7 + 1.2 = 1.9초)에 아래에서 떠오른다 */
.result .restart-row {
  position: absolute;
  right: 0;
  bottom: 6.9rem;   /* 머리말 카드 위 여백과 같은 값 (5.95 + 10px) */
  left: 0;
  margin: 0;
}

.result.is-intro .restart-row {
  animation: rise-in .45s ease-out both;
  animation-delay: 2.1s;
}

@keyframes rise-in {
  0%   { transform: translateY(2rem); opacity: 0; }
  100% { transform: translateY(0);    opacity: 1; }
}

/* ── 사건 기록 팝업 ─────────────────────────── */
body.is-modal-open { overflow: hidden; }

.modal-bg {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 2rem;   /* 위아래를 같게 둬야 노란 상자가 무대 한가운데에 앉는다 */
  background: rgba(9, 30, 50, .62);
}

.modal-holder { text-align: left; }
.modal-holder:focus, .modal-holder:focus-visible { outline: none; }

/* 팝업 안 포스트잇 — 무대(160×90rem) 안에서 쓸 수 있는 폭은 154rem 이다.
   1rem 은 1920×1080 화면의 최대화 창(세로가 기준이 된다)에서 약 10.5px 이므로
   50px ≒ 4.7rem — 136rem 에서 그만큼 줄였다. */
/* 가운데 정렬 기준은 눈에 보이는 종이다 — 문제 화면과 같은 이유로 margin-top -4.3rem. */
/* 가로폭 120rem 은 “모든 줄이 한 줄로 들어가는 최소치”를 계산해 잡은 값이다.
   가장 빡빡한 줄은 ‘내가 고른 카드’ — 값과 성적 배지가 한 줄에 나란히 선다.
     고른 카드 최대 47rem(2번 문제, 두 번 고른 경우) + 사이 1.6 + 배지 23.6 = 72.2rem
     그 줄의 글자 자리 = W - 38.6 (속지 좌우 17.3 + 스크롤 여백 1 + 카드 안팎 4.5
                                   + 라벨 칸 15 + 라벨·값 사이 1.6)
     → W ≥ 110.8rem. 캔버스 비율(3:2)에 맞춘 123rem 이라 여유가 있다
   다른 줄은 더 짧다 : 가장 긴 해설 61.4rem → W ≥ 94.5rem, 질문 → 66.5rem.
   세 문제가 같은 폭을 쓰므로 어느 포스트잇을 눌러도 상자 크기가 같다. */
.modal-bg .case-file { width: 123rem; min-height: 82rem; margin-top: -4.3rem; }
.modal-bg .case-paper,
/* 기록 팝업(세 색 공통) : 구멍 띠 밑→단서 상자, 마지막 카드→닫기, 닫기→종이 밑변
   위 3.2(구멍 띠 밑 17.9 + 3.2), 카드→닫기 3.2, 닫기→밑변 2.0(5.7 + 2.0) — 눈으로 보아 같게 보이는 값.
   기록 45 + 닫기 8.8 = 53.8rem 이라 상자가 82 → 84rem 으로 조금 늘어난다. */
.modal-bg .case-file.is-tight .case-paper { padding: 21.1rem 12.4rem 7.7rem 13rem; }

/* 세로 여유 : 90 - (위 10 + 아래 3) - 핀 6.5 - 속지 위아래 13.5 ≒ 57rem */
/* 기록 영역은 높이를 막지 않는다 — 스크롤바가 생기지 않도록 내용만큼 늘어나고(≈44.5rem),
   상자(min-height 82rem)가 그만큼 따라 늘어난다. 넘친 몫은 캔버스의 투명 위아랫단이라 보이지 않는다. */
.modal-scroll { overflow: visible; padding-right: 1rem; }


.record-badge {
  display: inline-flex;
  align-items: center;
  gap: .7rem;
  padding: .5rem 1.4rem;
  border: .25rem solid;
  border-radius: 99rem;
  font-size: 1.8rem;
  font-weight: 900;
}

.record-badge .ico { width: 2rem; height: 2rem; }
.record-badge.is-clean { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-edge); }
.record-badge.is-again { color: var(--again); background: var(--again-bg); border-color: var(--again-edge); }

/* 높이는 ‘내가 고른 카드’ 카드(7.1rem)와 같게 : 글줄 3.15 + 테두리 .6 + 위아래 1.675×2 */
.record-clue {
  display: flex;
  align-items: center;
  min-height: 7.1rem;
  margin-bottom: 1.24rem;
  padding: 1.675rem 1.8rem;
  background: var(--note);
  border: .3rem dashed var(--sun-deep);
  border-radius: 1.4rem;
}

.record-clue p { margin: 0; font-size: 2.1rem; font-weight: 800; }

/* 질문이 한눈에 들어오도록 2.9 → 3.8rem. 늘어난 글줄 높이 1.2rem 은 단서 상자 아래 .4,
   질문 아래 .4, 기록 카드 사이 .2×2 를 줄여 메웠다 — 포스트잇 크기와 카드 크기는 그대로.
   가장 긴 질문 19.9em × 3.8 ≒ 73rem 이라 96.6rem 폭에 한 줄로 들어간다. */
.record-ask {
  margin: 0 0 1.44rem;
  color: var(--navy-deep);
  font-size: 3.8rem;
  line-height: 1.35;
  letter-spacing: -.03em;
}

.record-rows { display: grid; gap: .8rem; margin: 0; }

/* 같은 성격의 줄끼리 카드로 묶는다 */
.rec-group {
  margin: 0;
  padding: 1rem 2rem;
  border: .25rem solid;
  border-radius: 1.2rem;
}

.rec-group.is-pick { background: #f5f2ea; border-color: #ded8c8; }
.rec-group.is-ok { background: var(--ok-bg); border-color: var(--ok-edge); }
.rec-group.is-no { background: var(--again-bg); border-color: var(--again-edge); }

.rec {
  display: grid;
  grid-template-columns: 15rem minmax(0, 1fr);
  gap: 1.6rem;
  align-items: baseline;
  padding: .5rem 0;
  font-size: 2.1rem;
}

.rec + .rec { border-top: .2rem dashed rgba(92, 74, 52, .22); }
.rec dt { font-size: 1.8rem; font-weight: 900; letter-spacing: .01em; opacity: .78; }
.rec dd { margin: 0; font-weight: 800; line-height: 1.45; }
.rec.has-badge dd { display: flex; align-items: center; justify-content: space-between; gap: 1.6rem; }
.rec.has-badge dd > span { min-width: 0; }
.rec.has-badge dd .record-badge { flex: 0 0 auto; }
.rec-group.is-pick dt, .rec-group.is-pick dd { color: #4b463c; }
.rec-group.is-ok dt, .rec-group.is-ok dd { color: #14603c; }
.rec-group.is-no dt, .rec-group.is-no dd { color: var(--again); }

/* 기록 팝업 닫기 — 기록 카드 아래 가운데의 작은 단추.
   스크롤 영역(.modal-scroll) 바깥에 두어 스크롤 높이에 들어가지 않는다.
   위 간격 3.2rem(단서 상자 위 여백과 같은 값), 단추 높이 5.6rem.
   상자는 35.6 + 45 + 2.8 + 5.6 ≈ 89rem 까지 늘어나며, 넘친 몫은 캔버스의 투명 위아랫단이라 보이지 않는다. */
.modal-done {
  display: block;
  width: fit-content;
  min-height: 5.6rem;
  margin: 2.72rem auto 0;   /* 3.2 에서 5px(.48rem) 줄여 질문 위아래에 2.5px 씩 보탰다 */
  padding: .8rem 4.2rem;
  color: #fff;
  background: var(--navy);
  border: 0;
  border-bottom: .6rem solid var(--navy-deep);
  border-radius: 1.4rem;
  font-size: 2.4rem;
  font-weight: 900;
}

.modal-done:hover { filter: brightness(1.09); }

/* ── 끌어 놓기 문항(다른 차시 공용) ─────────── */
.match-layout { display: grid; gap: 1.8rem; }
.interaction-help { margin: 0 0 1.4rem; color: var(--ink-soft); font-size: 2rem; font-weight: 800; }
.drag-pool { padding: 2rem; background: var(--note); border: .3rem dashed var(--sun-deep); border-radius: 1.6rem; }
.drag-pool-heading, .match-zone-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; color: var(--navy); font-size: 2rem; font-weight: 900; }
.drag-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem; margin-top: 1.4rem; }
.drag-card, .order-card { user-select: none; -webkit-user-select: none; touch-action: none; background: var(--paper); border: .3rem solid #b6c4ce; border-radius: 1.6rem; font-size: 2.1rem; font-weight: 800; cursor: grab; }
.drag-card { display: flex; gap: 1rem; min-height: 11rem; padding: 1.6rem; }
.match-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.4rem; }
.match-zone { min-height: 20rem; display: flex; flex-direction: column; padding: 1.6rem; background: var(--paper); border: .4rem dashed #b6c4ce; border-radius: 1.6rem; }
.placed-card-list { display: grid; align-content: start; gap: 1rem; margin-top: 1.2rem; }
.placed-card { display: flex; gap: .8rem; padding: 1rem; color: #14603c; background: var(--ok-bg); border: .15rem solid var(--ok-edge); border-radius: 1rem; font-size: 1.8rem; font-weight: 800; }
.placed-check { display: grid; width: 2.2rem; height: 2.2rem; flex: 0 0 auto; place-items: center; color: #fff; background: var(--ok); border-radius: 50%; font-size: 1.4rem; }
.order-list { display: grid; gap: 1.4rem; }
.order-card { display: grid; grid-template-columns: 4.2rem 2.2rem minmax(0, 1fr) auto; align-items: center; gap: 1.4rem; padding: 1.6rem 1.8rem; }
.order-number { display: grid; width: 4rem; height: 4rem; place-items: center; color: #fff; background: var(--navy); border-radius: 1.2rem; font-weight: 900; }
.drag-handle { color: var(--navy); font-weight: 900; letter-spacing: -.2rem; }
.drag-card-note { color: var(--ink-soft); font-size: 1.7rem; font-weight: 800; white-space: nowrap; }
.empty-drop, .pool-complete { margin: 1.2rem 0 0; color: var(--ink-soft); font-size: 1.8rem; font-weight: 700; text-align: center; }
.is-dragging { opacity: .45; }
.is-drop-ready { background: #fff7dd; border-color: var(--sun-deep); }
  
</style>

  /* 결과 화면에서 포스트잇이 “숨어 있던 자리에서 날아오게” 하려면 두 좌표가 필요하다.

        무대 크기(160×90rem)로 환산한 값이다. 그쪽을 고치면 여기도 함께 고쳐야 한다.
     ② 결과 화면 세 칸의 한가운데 — .find-row 가 가로 120rem 을 4rem 간격 세 칸으로
        나누고 무대 가운데에 놓이므로 20 + 18.67 / +41.33 / +41.33 이 된다.
        세로는 .find-row 의 top 33%(29.7rem)에 카드 높이 39.4rem 의 절반을 더한 값. */
  const HIDDEN_AT = [
    { x: 102.6, y: 39.3 },   /* 1번 — 보물지도 뒤 */
    { x:  32.2, y: 60.5 },   /* 2번 — 큰 돋보기 뒤 */
    { x: 130.3, y: 51.6 }    /* 3번 — 기차 뒤 */

  const SLOT_Y = 49.1;

  /* 사건 기록 파일(서류철) — 모든 화면이 이 껍데기를 함께 쓴다 */
  /* paper : 문제 번호(0~2) — 포스트잇 색과 같은 색의 종이를 고른다 */
  const caseFile = (inner, { tight = false, roomy = false, paper = null } = {}) => `
    <section class="case-file${tight ? " is-tight" : ""}${roomy ? " is-roomy" : ""}${paper !== null ? " paper-" + paper : ""}">
      <div class="case-paper">
        ${inner}
      </div>
    </section>`;

  const frame = (content, stageClass = "") => `
    <div class="stage${stageClass ? " " + stageClass : ""}">
      <div class="stage-body">${content}</div>
    </div>`;

  const renderQuiz = (quiz) => {

    const state = {

      resultIntro: false,
      /* 보드 등장 애니메이션을 틀지 말지 — 마지막 문제를 막 풀고 돌아올 때만 true.

      boardIntro: false,
      justSolved: false,
      hintOpen: false,          /* 문제 화면의 Hint! 말풍선이 열려 있는가 (저장하지 않는다) */
      matchAssignments: {},
      order: [],
      dragging: null
    };

    /* 새로고침해도 보던 화면 그대로 — 화면 상태를 세션에 담아 둔다 */
    const stateKey = `ai-ethics-quiz-state:${quiz.id}`;
    const saveState = () => {
      try {
        sessionStorage.setItem(stateKey, JSON.stringify({
          screen: state.screen,
          index: state.index,
          locked: state.locked,
          selected: state.selected,
          feedback: state.feedback,
          wrongChoices: [...state.wrongChoices],
          responses: state.responses,
          reviewOpen: state.reviewOpen,
          matchAssignments: state.matchAssignments,
          order: state.order
        }));
      } catch { /* 저장이 막혀 있어도 화면은 그대로 동작 */ }
    };
    const loadState = () => {
      try {
        const saved = JSON.parse(sessionStorage.getItem(stateKey) || "null");
        if (!saved) return;
        Object.assign(state, saved, {
          wrongChoices: new Set(saved.wrongChoices || []),
          responses: saved.responses || {},
          matchAssignments: saved.matchAssignments || {},
          order: saved.order || [],
          dragging: null
        });
        if (!quiz.questions[state.index]) resetQuestion(0);
      } catch { /* 저장값이 깨졌으면 처음 화면부터 */ }
    };

    const current = () => quiz.questions[state.index];
    const letter = (index) => String.fromCharCode(65 + index);

    const record = (index) => {
      if (!state.responses[index]) state.responses[index] = { picked: [], misses: 0, done: false, correctFirst: false };
      return state.responses[index];
    };
    const resetQuestion = (index) => {
      state.index = index;
      state.locked = false;
      state.selected = null;
      state.feedback = null;
      state.hintOpen = false;
      state.wrongChoices = new Set();
      state.matchAssignments = {};
      state.order = quiz.questions[index]?.type === "order"
        ? [...quiz.questions[index].initialOrder]
        : [];
      state.dragging = null;
    };
    /* 이미 맞힌 문항으로 되돌아가면 고른 답·해설을 그대로 되살린다.
       아직 안 푼 문항이면 평소대로 빈 상태로 연다. */
    const restoreQuestion = (index) => {
      resetQuestion(index);
      state.justSolved = false;   /* 문제를 여는 순간엔 아직 맞힌 게 아니다 (다시 보기면 끝까지 false) */
      const rec = state.responses[index];
      const question = quiz.questions[index];
      if (!rec?.done || !question) return;

      state.locked = true;
      state.feedback = { tone: "correct", text: question.correctFeedback };

      if (question.type === "choice") {
        const answerIndex = question.choices.findIndex(([, correct]) => correct);
        state.selected = answerIndex;
        state.wrongChoices = new Set(rec.picked.filter((pick) => pick !== answerIndex));
      } else if (question.type === "order") {
        state.order = [...question.correctOrder];
      } else if (question.type === "match") {
        state.matchAssignments = Object.fromEntries(question.items.map((item) => [item.id, item.category]));
      }
    };

    const markSolved = () => {
      const rec = record(state.index);
      /* 결과 화면에서 “푼 순서대로” 늘어놓아야 하므로 몇 번째로 풀었는지 적어 둔다.
         이미 푼 문제를 다시 열어 봐도 순서가 바뀌지 않게 처음 한 번만 적는다. */
      if (!rec.done) rec.solvedAt = quiz.questions.filter((_, i) => state.responses[i]?.done === true).length;
      rec.done = true;
      rec.correctFirst = rec.misses === 0;
      state.justSolved = true;
    };
    /* 푸는 순서가 자유로우므로 "마지막 번호를 풀었는가"가 아니라
       "세 장을 모두 풀었는가"로 완료를 판단해야 한다. */
    const allSolved = () => quiz.questions.every((_, index) => state.responses[index]?.done === true);
    const goNext = () => {
      if (allSolved()) {
        const done = completed();
        done[quiz.id] = true;
        localStorage.setItem(completionKey, JSON.stringify(done));
      }
      state.screen = "board";   /* 남은 포스트잇을 찾으러 보드로 돌아간다 */
      render();
    };


    const feedback = (extra = "") => {
      if (!state.feedback) return "";
      const { tone, text } = state.feedback;
      const correct = tone === "correct";
      const title = correct
        ? "정답이에요! 잘했어요!"
        : tone === "hint" ? "좋아요, 계속 조사해요!" : "다시 살펴볼까요?";
      const kind = correct ? "verdict-ok" : tone === "hint" ? "verdict-hint" : "verdict-again";
      return `
        <section class="verdict ${kind}" role="status" aria-live="polite">
          ${correct ? ICON.check : ICON.glass}
          <div><strong>${title}</strong><p>${escapeHTML(text)}</p></div>
          ${extra}
        </section>`;
    };

    const wrapUp = () => {
      /* 정답을 맞힌 뒤에만 뜨는 ‘확인’ — 누르면 포스트잇 3장 화면으로 돌아간다. 초록 상자 안 오른쪽에 들어간다 */
      const doneBtn = state.locked
        ? `<button class="btn btn-done" type="button" data-action="quiz-done">확인</button>`
        : "";
      const parts = feedback(doneBtn);
      /* 상자 없이 잠긴 상태(있을 수 없지만 대비)면 단추만 놓는다 */
      const done = !parts && doneBtn ? `<div class="quiz-done">${doneBtn}</div>` : "";
      return parts || done ? `<div class="wrap-up">${parts}${done}</div>` : "";
    };

    /* 선택지를 고른 뒤 뜨던 안내문(‘A. …’를 골랐어요. 정답 확인하기를 눌러요!)은 쓰지 않는다 — 카드가 색으로 바뀌고 단추가 켜지는 것으로 충분하다 */
    const selectStatus = () => "";

    /* 정답·오답 상자가 뜬 뒤에는 눌러도 소용없는 ‘정답 확인하기’를 아예 감춘다.
       다른 카드를 다시 고르면 상자가 사라지면서 버튼도 돌아온다. */
    /* 배경에 연하게 깔리는 별·반짝이 여섯 개 — 자리와 크기는 .qshape-N 에서 정한다 */
    /* 마스킹테이프(체크무늬) — 종이 색과 같은 순서(0 노랑 · 1 하늘 · 2 연두)로 세 장. 문제 포스트잇 모서리 두 곳에 붙인다 */

    const tapes = () => TAPE[state.index] ? `<img class="tape tape-tl" src="${TAPE[state.index]}" alt=""><img class="tape tape-br" src="${TAPE[state.index]}" alt="">` : "";
    const STAR = `<path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z"/>`;
    const SPARK = `<path d="M12 1.8c.9 5.6 2.4 8.3 10.2 10.2C14.4 13.9 12.9 16.6 12 22.2 11.1 16.6 9.6 13.9 1.8 12 9.6 10.1 11.1 7.4 12 1.8z"/>`;
    const BG_SHAPES = [STAR, SPARK, STAR, SPARK, STAR, SPARK]
      .map((d, i) => `<svg class="qshape qshape-${i + 1}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`).join("");

    const actRow = (question) => {
      const note = escapeHTML(selectStatus(question));
      const button = state.feedback
        ? ""
        : `<button class="btn btn-sun" type="button" data-action="confirm-choice" ${state.selected === null || state.locked ? "disabled" : ""}>정답 확인하기</button>`;
      if (!note && !button) return "";
      return `
      <div class="act">
        <p class="act-note" role="status" aria-live="polite">${note}</p>
        ${button}
      </div>`;
    };

    /* 선택지 카드 판 — 왼쪽 카드는 오른쪽 위가, 오른쪽 카드는 왼쪽 아래가 대각선으로 잘려 있다.
       채움과 테두리를 한 경로로 그려 비스듬한 변에서도 선이 끊겨 보이지 않는다. */
    const PICK_SHAPE = [
      `<svg class="pick-shape" viewBox="0 0 43.4 22" preserveAspectRatio="none" aria-hidden="true"><path d="M 2.4 .15 L 37.852 .15 A 1.25 1.25 0 0 1 39.078 1.155 L 42.918 20.355 A 1.25 1.25 0 0 1 41.692 21.85 L 2.4 21.85 A 2.25 2.25 0 0 1 .15 19.6 L .15 2.4 A 2.25 2.25 0 0 1 2.4 .15 Z"/></svg>`,
      `<svg class="pick-shape" viewBox="0 0 43.4 22" preserveAspectRatio="none" aria-hidden="true"><path d="M 1.708 .15 L 41 .15 A 2.25 2.25 0 0 1 43.25 2.4 L 43.25 19.6 A 2.25 2.25 0 0 1 41 21.85 L 5.548 21.85 A 1.25 1.25 0 0 1 4.322 20.845 L .482 1.645 A 1.25 1.25 0 0 1 1.708 .15 Z"/></svg>`,
    ];

    const choices = (question) => `
      <div class="answers answers-${question.choices.length}">
        ${question.choices.map(([label, correct], index) => {
          const again = state.wrongChoices.has(index);
          const right = state.locked && correct;
          const picked = !state.locked && state.selected === index;
          const classes = ["pick", again ? "is-again" : "", right ? "is-right" : "", picked ? "is-picked" : ""].filter(Boolean).join(" ");
          /* 카드 안 표시(핀 · 정답 체크 · 다시 돋보기)는 두지 않는다 — 상태는 카드 색(고름 노랑 · 정답 초록 · 다시 갈색)으로만 보인다 */
          return `
            <button class="${classes}" type="button" data-action="choice" data-index="${index}" aria-pressed="${picked}" ${state.locked || again ? "disabled" : ""}>
              ${question.choices.length === 2 ? PICK_SHAPE[index] : ""}
              <span class="pick-tag">${letter(index)}</span>
              <span class="pick-label">${escapeHTML(label)}</span>

        <span class="vs" aria-hidden="true"><b>V</b><i>S</i></span>
      </div>
      ${actRow(question)}`;

    const match = (question) => {
      const assignedTo = (categoryId) => question.items
        .filter((item) => state.matchAssignments[item.id] === categoryId);
      const remaining = question.items
        .filter((item) => !state.matchAssignments[item.id]);

      return `
        <p class="interaction-help">단서 카드를 알맞은 칸으로 끌어 놓으세요. 각 칸에는 두 장씩 들어가요.</p>

          <section class="drag-pool" aria-label="분류할 단서 카드">

          </section>
          <div class="match-board" aria-label="단서 분류 칸">
            ${question.categories.map((category) => {
              const assigned = assignedTo(category.id);
              return `
                <section class="match-zone drop-target" data-drop-kind="match" data-category="${category.id}" aria-label="${escapeHTML(category.label)} 분류 칸">

                    <strong>${escapeHTML(category.label)}</strong><span>${assigned.length} / 2</span>
                  </div>
                  <div class="placed-card-list" role="list">
                    ${assigned.map((item) => `
                      <div class="placed-card" role="listitem"><span class="placed-check">✓</span><span>${escapeHTML(item.text)}</span></div>`).join("") || '<p class="empty-drop">여기에 끌어 놓기</p>'}

                </section>`;
            }).join("")}
          </div>
        </div>`;
    };

    const order = (question) => `

      const clean = rec.misses === 0;

        const answerIndex = question.choices.findIndex(([, correct]) => correct);

          ? rec.picked.map((pick) => `${letter(pick)}. ${escapeHTML(question.choices[pick][0])}`).join(" → ")

        rows.push(["정답", `${letter(answerIndex)}. ${escapeHTML(question.choices[answerIndex][0])}`, "is-ok"]);
        rows.push(["맞는 이유", escapeHTML(question.correctFeedback), "is-ok"]);
        rows.push(["이건 아니에요", question.choices
          .map(([label], optionIndex) => (optionIndex === answerIndex ? null : `${letter(optionIndex)}. ${escapeHTML(label)}`))
          .filter(Boolean).join("<br>"), "is-no"]);
        rows.push(["왜 아닐까요?", escapeHTML(question.incorrectFeedback), "is-no"]);
      } else if (question.type === "order") {
        rows.push(["정답 순서", question.correctOrder.map((step, i) => `${i + 1}. ${escapeHTML(step)}`).join("<br>"), "is-ok"]);
        rows.push(["맞는 이유", escapeHTML(question.correctFeedback), "is-ok"]);
        rows.push(["왜 아닐까요?", escapeHTML(question.incorrectFeedback), "is-no"]);
      } else if (question.type === "match") {
        rows.push(["정답 분류", question.categories.map((category) => `${escapeHTML(category.label)} · ${question.items.filter((item) => item.category === category.id).map((item) => escapeHTML(item.text)).join(", ")}`).join("<br>"), "is-ok"]);
        rows.push(["맞는 이유", escapeHTML(question.correctFeedback), "is-ok"]);
        rows.push(["왜 아닐까요?", escapeHTML(question.incorrectFeedback), "is-no"]);
      }
      /* 성적 배지는 ‘내가 고른 카드’ 줄 오른쪽 끝에 붙인다(그 줄이 없으면 첫 줄) */
      const badge = `<span class="record-badge ${clean ? "is-clean" : "is-again"}">${clean ? ICON.check : ICON.glass}${clean ? "한 번에 찾았어요" : "다시 살펴보고 찾았어요"}</span>`;
      const badgeLabel = ((rows.find(([label]) => label === "내가 고른 카드") || rows[0]) || [])[0];

      /* 성격이 같은 줄끼리 묶어 카드로 보여 준다 : 내가 고른 카드 / 정답·이유 / 오답·이유 */
      const group = (tone, cls) => {
        const picked = rows.filter(([, , rowTone]) => (rowTone || "") === tone);
        if (!picked.length) return "";
        return `
          <dl class="rec-group ${cls}">
            ${picked.map(([label, value]) => `
              <div class="rec${label === badgeLabel ? " has-badge" : ""}"><dt>${label}</dt><dd><span>${value}</span>${label === badgeLabel ? badge : ""}</dd></div>`).join("")}
          </dl>`;
      };

      return `
        <article class="record">
          <div class="record-clue">
            <p>${escapeHTML(question.material)}</p>
          </div>
          <h2 class="record-ask">${escapeHTML(question.prompt)}</h2>
          <div class="record-rows">
            ${group("", "is-pick")}${group("is-ok", "is-ok")}${group("is-no", "is-no")}
          </div>
        </article>`;
    };

    const reviewModal = () => {
      if (state.reviewOpen === null) return "";
      const question = quiz.questions[state.reviewOpen];
      if (!question) return "";
      return `
        <div class="modal-bg" data-action="close-review">
          <div class="modal-holder" role="dialog" aria-modal="true" tabindex="-1" aria-label="${state.reviewOpen + 1}번 문제" data-action="modal-keep">
            ${caseFile(`
              <div class="modal-scroll">
                ${recordCard(question, state.reviewOpen)}
              </div>
              <button class="modal-done" type="button" data-action="close-review">닫기</button>`, { tight: true, paper: state.reviewOpen })}
          </div>
        </div>`;
    };

    const render = () => {
      document.title = `${quiz.lesson} ${quiz.number} · ${quiz.title}`;
      document.body.classList.remove("is-modal-open");
      saveState();

      if (state.screen === "start") {
        app.innerHTML = frame(`
          <div class="start-gate">
            <h1 class="cover-title">${escapeHTML(quiz.title)}</h1>
            <p class="cover-lead">${escapeHTML(quiz.shortDescription)}</p>
            <button class="btn-start" type="button" data-action="start">풀어보기</button>
          </div>`, "is-cover");
        return;
      }

      /* 사건 보드 : 지금 풀 차례인 포스트잇이 반짝인다 */
      if (state.screen === "board") {
        const allDone = allSolved();
        app.innerHTML = frame(`
          <div class="board${allDone ? " is-clear" : ""}${state.boardIntro ? " is-intro" : ""}">
            <p class="board-hint">${allDone ? "포스트잇을 모두 찾았어요!" : "숨겨진 포스트잇을 찾아 보세요!"}</p>
            <div class="found-list" role="list" aria-label="찾아야 하는 포스트잇">
              ${quiz.questions.map((_, index) => {
                const found = state.responses[index]?.done === true;
                /* 방금 맞히고 돌아온 그 문제만 도장이 새로 찍힌다 (다시 보기로 열었다 온 경우는 아니다) */
                const fresh = found && state.justSolved && index === state.index;
                /* 찾은 카드는 눌러서 그 문제를 다시 볼 수 있다(button) — 못 찾은 카드는 그냥 표시(span) */
                const tag = found ? "button" : "span";
                return `
                  <${tag}${found ? ` type="button" data-action="open-found" data-index="${index}"` : ""} class="found-item${found ? " is-found" : ""}${fresh ? " is-new" : ""}" role="listitem" aria-label="${index + 1}번 포스트잇 ${found ? "— 찾았어요, 누르면 다시 보기" : "— 아직 못 찾았어요"}">
                    <img class="found-thumb" src="${POSTIT[index]}" alt="">
                    ${found ? `<span class="found-check">${ICON.check}</span>` : ""}
                  </${tag}>`;
              }).join("")}
            </div>
            ${quiz.questions.map((_, index) => {
              const done = state.responses[index]?.done === true;
              /* 순서는 따지지 않는다. 푼 포스트잇은 보드에서 빼서 남은 것을 찾기 쉽게 하고,
                 세 장을 모두 풀면 다 같이 제자리로 돌아온다. */
              if (done && !allDone) return "";
              const cls = ["spot", "spot-" + (index + 1), allDone ? "is-clear" : "is-hidden"].join(" ");
              /* 돌아오는 차례 : 문제 번호가 아니라 “몇 번째로 풀었는가”(solvedAt)다.
                 --spot-order 가 종이의 등장 지연과 체크 도장 지연을 함께 정한다.
                 예전 저장분처럼 기록이 없으면 문제 번호로 대신한다. */
              const order = state.responses[index]?.solvedAt ?? index;
              const label = `${index + 1}번 포스트잇 ${allDone ? "— 찾기 완료" : "— 눌러서 문제 풀기"}`;
              return `
                <button class="${cls}" type="button" data-action="open-case" data-index="${index}" aria-label="${label}" style="--spot-order:${order}">
                  <img class="spot-paper" src="${POSTIT[index]}" alt="">
                  ${allDone ? `<span class="spot-check">${ICON.check}</span>` : ""}
                </button>`;
            }).join("")}
            <img class="board-cover cover-map" src="${COVER.map}" alt="" aria-hidden="true">
            <img class="board-cover cover-magnifier" src="${COVER.magnifier}" alt="" aria-hidden="true">
            <img class="board-cover cover-train" src="${COVER.train}" alt="" aria-hidden="true">
            ${allDone ? `<button class="btn-final" type="button" data-action="go-result">최종 확인하기</button>` : ""}
          </div>`);
        return;
      }

      if (state.screen === "result") {
        const total = quiz.questions.length;
        const firstTry = quiz.questions.filter((_, index) => state.responses[index]?.correctFirst).length;
        /* 왼쪽부터 푼 순서대로. 기록이 없으면(예전 저장분) 문제 번호 순으로 둔다 */
        const solvedOrder = quiz.questions
          .map((_, index) => index)
          .sort((a, b) => (state.responses[a]?.solvedAt ?? a) - (state.responses[b]?.solvedAt ?? b));
        app.innerHTML = frame(`
          <div class="result${state.resultIntro ? " is-intro" : ""}">
            <div class="result-head">
              <h1>퀴즈를 모두 풀었어요!</h1>
              <p class="solved-score">처음에 바로 찾은 정답 <b>${firstTry}</b> / ${total}</p>
            </div>
            <div class="find-row">
              ${solvedOrder.map((index, slot) => {
                const clean = state.responses[index]?.correctFirst;
                const note = clean ? "한 번에 찾았어요" : "다시 살펴봤어요";
                /* 숨어 있던 자리에서 제 칸까지의 거리 — 이만큼 떨어진 곳에서 날아온다 */
                const from = HIDDEN_AT[index] || { x: SLOT_X[slot], y: SLOT_Y };
                return `
                  <button class="find-card ${clean ? "is-clean" : "is-again"}" type="button" data-action="open-review" data-index="${index}" style="--card-order:${slot}; --from-x:${(from.x - SLOT_X[slot]).toFixed(1)}rem; --from-y:${(from.y - SLOT_Y).toFixed(1)}rem" aria-label="${index + 1}번 포스트잇 다시 보기 — ${note}">
                    <img class="find-paper" src="${POSTIT[index]}" alt="">
                    <span class="find-note">${note}</span>
                  </button>`;
              }).join("")}
            </div>
            <div class="restart-row">
              <button class="btn btn-restart" type="button" data-action="restart">처음부터 다시</button>
            </div>
          </div>` + reviewModal(), "is-result");
        document.body.classList.toggle("is-modal-open", state.reviewOpen !== null);
        if (state.reviewOpen !== null) app.querySelector(".modal-holder")?.focus();
        return;
      }

      const question = current();
      const questionBody = question.type === "match"
        ? match(question)
        : question.type === "order"
          ? order(question)
          : choices(question);
      app.innerHTML = frame(caseFile(`
        ${tapes()}
        <span class="qmark qmark-1" aria-hidden="true">?</span>
        <span class="qmark qmark-2" aria-hidden="true">!</span>
        <span class="qmark qmark-3" aria-hidden="true">?</span>
        <span class="qmark qmark-4" aria-hidden="true">!</span>
        ${BG_SHAPES}
        <div class="ask">
          <h1>${escapeHTML(question.prompt)}</h1>
          <button class="hint-btn" type="button" data-action="toggle-hint" aria-expanded="${state.hintOpen}">Hint!</button>
          ${state.hintOpen ? `
          <div class="hint-pop" role="note">
            <div class="clue">
              <span class="clue-icon">${ICON.glass}</span>
              <div class="clue-body">
                ${question.materialLabel ? `<b class="clue-title">${escapeHTML(question.materialLabel)}</b>` : ""}
                <p class="clue-text">${escapeHTML(question.material)}</p>
              </div>
            </div>
          </div>` : ""}
        </div>
        ${questionBody}
        ${wrapUp()}`, { tight: true, paper: state.index }), "is-quiz");
    };

    app.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      /* Hint! 말풍선은 그 바깥 아무 데나 누르면 닫힌다 (누른 곳의 동작은 그대로 이어진다) */
      if (state.hintOpen && !event.target.closest(".hint-pop, [data-action='toggle-hint']")) { state.hintOpen = false; render(); }
      if (!button) return;
      if (button.dataset.action === "modal-keep") return;
      if (button.dataset.action === "toggle-hint") { state.hintOpen = !state.hintOpen; render(); return; }
      if (button.dataset.action === "open-review") {
        state.reviewOpen = Number(button.dataset.index);
        state.resultIntro = false;   /* 기록을 닫고 돌아와도 세 장이 다시 날아오지 않게 */
        render();
        return;
      }
      if (button.dataset.action === "close-review") {
        state.reviewOpen = null;
        render();
        return;
      }
      if (button.dataset.action === "start") {
        state.screen = "board";
        state.responses = {};
        state.reviewOpen = null;
        resetQuestion(0);
        render();
        return;
      }
      if (button.dataset.action === "restart") {
        state.screen = "start";
        state.responses = {};
        state.reviewOpen = null;
        state.resultIntro = false;
        resetQuestion(0);
        render();
        return;
      }
      if (button.dataset.action === "quiz-done") {
        /* 방금 맞힌 문제가 마지막 조각이었을 때만 보드 등장 애니메이션을 튼다.
           다 찾은 뒤 다시 보기로 열었다 닫는 경우는 justSolved 가 false 라 조용히 돌아간다. */
        const allDone = quiz.questions.every((_, i) => state.responses[i]?.done === true);
        state.boardIntro = state.justSolved && allDone;
        goNext();
        return;
      }
      if (button.dataset.action === "go-result") {
        if (button.classList.contains("is-leaving")) return;   /* 연달아 눌러도 한 번만 */
        const showResult = () => { state.screen = "result"; state.resultIntro = true; render(); };
        if (reduceMotion()) { showResult(); return; }
        button.classList.add("is-leaving");
        window.setTimeout(showResult, 380);   /* 버튼이 사라지는 시간만큼 기다린다 */
        return;
      }
      if (button.dataset.action === "open-found") {
        /* 목록의 찾은 카드 : 그 문제를 푼 상태 그대로 다시 보여 준다. 확인을 누르면 보드로 돌아온다 */
        state.boardIntro = false;
        state.screen = "question";
        restoreQuestion(Number(button.dataset.index));
        render();
        return;
      }
      if (button.dataset.action === "open-case") {
        if (button.classList.contains("is-opening")) return;   /* 연달아 눌러도 한 번만 */
        const openIndex = Number(button.dataset.index);
        const showQuestion = () => {
          state.boardIntro = false;
          state.screen = "question";
          restoreQuestion(openIndex);
          render();
        };
        if (reduceMotion()) { showQuestion(); return; }
        button.classList.add("is-opening");
        window.setTimeout(showQuestion, 700);
        return;
      }

      const question = current();
      if (button.dataset.action === "choice" && question.type === "choice" && !state.locked) {
        state.selected = Number(button.dataset.index);
        state.feedback = null;
        render();
      }

      if (button.dataset.action === "confirm-choice" && question.type === "choice" && !state.locked) {
        const selected = state.selected;
        if (selected === null) return;
        const [, correct] = question.choices[selected];
        const rec = record(state.index);
        rec.picked.push(selected);
        if (correct) {
          state.locked = true;
          markSolved();
          state.feedback = { tone: "correct", text: question.correctFeedback };
        } else {
          rec.misses += 1;
          state.wrongChoices.add(selected);
          state.selected = null;
          state.feedback = { tone: "wrong", text: question.incorrectFeedback };
        }
        render();
      }

      if (button.dataset.action === "check-order" && question.type === "order" && !state.locked) {
        const isCorrect = state.order.every((step, index) => step === question.correctOrder[index]);
        if (isCorrect) {
          state.locked = true;
          markSolved();
          state.feedback = { tone: "correct", text: question.correctFeedback };
        } else {
          record(state.index).misses += 1;
          state.feedback = { tone: "wrong", text: question.incorrectFeedback };
        }
        render();
      }
    });

    const removeDropHighlights = () => {
      app.querySelectorAll(".is-drop-ready").forEach((target) => target.classList.remove("is-drop-ready"));
    };
    const clearDrag = () => {
      app.querySelectorAll(".is-dragging").forEach((card) => card.classList.remove("is-dragging"));
      state.dragging = null;
      removeDropHighlights();
    };
    const dropTargetAt = (x, y, kind) => {
      const target = document.elementFromPoint(x, y)?.closest("[data-drop-kind]");
      return target?.dataset.dropKind === kind ? target : null;
    };
    const finishDrop = (target, drag) => {
      clearDrag();
      const question = current();

      if (drag.kind === "match" && question.type === "match") {
        const item = question.items.find((candidate) => candidate.id === drag.itemId);
        const categoryId = target.dataset.category;
        const inCategory = Object.values(state.matchAssignments)
          .filter((assigned) => assigned === categoryId).length;
        if (!item) return;
        if (inCategory >= 2) {
          state.feedback = { tone: "wrong", text: question.fullFeedback };
          render();
          return;
        }
        if (item.category !== categoryId) {
          record(state.index).misses += 1;
          state.feedback = { tone: "wrong", text: question.incorrectFeedback };
          render();
          return;
        }
        state.matchAssignments[item.id] = categoryId;
        if (Object.keys(state.matchAssignments).length === question.items.length) {
          state.locked = true;
          markSolved();
          state.feedback = { tone: "correct", text: question.correctFeedback };
        } else {
          state.feedback = { tone: "hint", text: question.progressFeedback };
        }
        render();
      }

      if (drag.kind === "order" && question.type === "order") {
        const targetIndex = Number(target.dataset.orderIndex);
        if (!Number.isInteger(drag.index) || !Number.isInteger(targetIndex) || drag.index === targetIndex) return;
        [state.order[drag.index], state.order[targetIndex]] = [state.order[targetIndex], state.order[drag.index]];
        state.feedback = null;
        render();
      }
    };

    app.addEventListener("pointerdown", (event) => {
      const card = event.target.closest("[data-drag-kind]");
      if (!card || state.locked || event.button !== 0) return;
      const kind = card.dataset.dragKind;
      state.dragging = {
        kind,
        itemId: card.dataset.itemId || null,
        index: kind === "order" ? Number(card.dataset.orderIndex) : null,
        pointerId: event.pointerId
      };
      card.classList.add("is-dragging");
      card.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    app.addEventListener("pointermove", (event) => {
      const drag = state.dragging;
      if (!drag || drag.pointerId !== event.pointerId) return;
      removeDropHighlights();
      const target = dropTargetAt(event.clientX, event.clientY, drag.kind);
      if (target) target.classList.add("is-drop-ready");
      event.preventDefault();
    });

    app.addEventListener("pointerup", (event) => {
      const drag = state.dragging;
      if (!drag || drag.pointerId !== event.pointerId) return;
      const target = dropTargetAt(event.clientX, event.clientY, drag.kind);
      if (target) finishDrop(target, drag);
      else clearDrag();
      event.preventDefault();
    });

    app.addEventListener("pointercancel", clearDrag);

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || state.reviewOpen === null) return;
      state.reviewOpen = null;
      render();
    });

    loadState();
    render();
  };

  if (quizzes[document.body.dataset.quizId]) renderQuiz(quizzes[document.body.dataset.quizId]);
})();
  </script>
</body>
</html>
