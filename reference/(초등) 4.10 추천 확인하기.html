  };
  /* ── 픽셀 그림 ───────────────────────────
     window.PIXEL_ART 의 칸 격자(문자 하나 = 칸 하나)로 그린다. 문자 → 색 :
       B 파랑 · N 남색 · W 흰색 · . 바탕(그리지 않음)
     같은 색이 붙어 있는 칸 묶음을 '구역'으로 삼아, 구역을 한 번 누르면 통째로 칠해진다. */
  document.documentElement.style.setProperty("--puzzle-bg", `url("${window.PUZZLE_BG || ""}")`);
  const PIXEL = window.PIXEL_ART || { cols: 0, rows: 0, rowsText: [] };
  const PAINT = {
    B: { name: "파랑", hex: "#1e88ff", gray: "#9aa4ae" },
    N: { name: "남색", hex: "#0f2b5b", gray: "#5f6a75" },
    W: { name: "흰색", hex: "#ffffff", gray: "#c3cbd3" }   /* 칠하기 전 회색 : 흰색과 확실히 구분되도록 진하게 */
  };
  const pixelRegions = () => {
    const { cols, rows, rowsText } = PIXEL;
    const id = rowsText.map((row) => row.split("").map(() => -1));
    const regions = [];
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const ch = rowsText[r][c];
        if (ch === "." || id[r][c] >= 0) continue;
        const rid = regions.length;
        const cells = [];
        const stack = [[r, c]];
        while (stack.length) {
          const [y, x] = stack.pop();
          if (y < 0 || x < 0 || y >= rows || x >= cols || id[y][x] >= 0 || rowsText[y][x] !== ch) continue;
          id[y][x] = rid;
          cells.push([x, y]);
          stack.push([y + 1, x], [y - 1, x], [y, x + 1], [y, x - 1]);
        }
        regions.push({ id: rid, color: ch, cells });
      }
    }
    return regions;
  };
  const REGIONS = pixelRegions();

  /* ── 팔레트 판 : 매끈한 흰 팔레트. 회색 테두리, 둥근 물감 구멍 4개(위 3개 · 오른쪽 아래 1개), 오른쪽에 엄지 홈.
     물감 자리(WELL_AT)는 판 좌표(가로 220 · 세로 200) — 문항 순서대로 위쪽 구멍 세 개를 쓴다 */
  const PALETTE_W = 220;
  const PALETTE_H = 200;
  const PALETTE_HOLES = [[54.86, 80.71, 22], [108.06, 66.71, 22], [161.26, 80.71, 22], [158, 144, 13]];   /* 위 세 구멍 간격 : 50 → 53.2 (약 5px 더 넓게) */   /* 마지막은 문제 자리가 아닌 장식 구멍 : 작게 */   /* 위 세 구멍은 중심 간격이 같다 (왼쪽 3px · 위 2px 옮긴 값) */
  const WELL_AT = PALETTE_HOLES.slice(0, 3);
  const paletteBoard = () => {
    const body = "M105 12 C165 12 208 48 208 96 C208 106 200 112 192 118 C180 128 184 148 204 150 C204 178 160 190 105 190 C45 190 5 150 5 100 C5 50 45 12 105 12 Z";
    const holes = PALETTE_HOLES.map(([x, y, r]) => `
      <circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff" stroke="#b9bcc0" stroke-width="3"/>
      <circle cx="${x}" cy="${y}" r="${r - 3.5}" fill="none" stroke="#e3e5e8" stroke-width="2.5"/>`).join("");
    return `<svg class="px-board-svg" viewBox="0 0 ${PALETTE_W} ${PALETTE_H}" aria-hidden="true">
      <path d="${body}" fill="#f6f6f6" stroke="#a9acb0" stroke-width="3" stroke-linejoin="round"/>
      ${holes}
    </svg>`;
  };
  const wellStyle = (qIndex) => {
    const [x, y] = WELL_AT[qIndex] || [110, 100];
    return `left:${(x / PALETTE_W * 100).toFixed(2)}%;top:${(y / PALETTE_H * 100).toFixed(2)}%`;
  };

  /* 사건 기록 파일(서류철) — 모든 화면이 이 껍데기를 함께 쓴다 */
  const caseFile = (inner, { tab = "색칠 기록", badge = "", tight = false, roomy = false, ordered = false, quiz = false, plain = false } = {}) => `
    <section class="case-file${tight ? " is-tight" : ""}${roomy ? " is-roomy" : ""}${ordered ? " is-order" : ""}${quiz ? " is-quiz" : ""}${quiz || plain ? " is-plain" : ""}">
      <div class="case-index" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="case-tab">${ICON.piece}${tab}</div>
      <div class="case-folder">
        <div class="case-paper">
          ${badge ? `<p class="case-no">${badge}${ICON.piece}</p>` : ""}
          ${inner}
        </div>
      </div>
    </section>`;

  const frame = (content, topRight = "", nav = "", { cover = false, puzzle = false } = {}) => `
    <div class="stage${cover ? " is-cover" : ""}${puzzle ? " is-puzzle" : ""}">
      <div class="stage-body">${content}</div>
      ${nav}
    </div>`;

  const renderQuiz = (quiz) => {
    /* 문항 i ↔ 색 (quiz.paint.colors[i]) : 문제를 맞히면 그 색을 얻는다 */
    const paintColors = (quiz.paint && quiz.paint.colors) || ["B", "N", "W"];
    const colorOf = (qIndex) => paintColors[qIndex];
    const questionOfColor = (key) => paintColors.indexOf(key);

    const state = {
      screen: "start",        /* start · puzzle · result */
      index: 0,
      openPiece: null,        /* 지금 문제 팝업이 열린 문항 번호 */
      justPainted: null,      /* 방금 칠한 구역(칠해지는 움직임용, 저장하지 않음) */
      justEarned: null,       /* 방금 얻은 색(팔레트에 들어오는 움직임용, 저장하지 않음) */
      painted: {},            /* 학생이 칠한 구역 { 구역 번호: true } */
      brush: null,            /* 팔레트에서 고른 색 (B · N · W) */
      stroke: null,           /* 붓질 중 { pointerId, painted: 이번 붓질로 칠한 수, wrong: 눌렀던 자리가 다른 색이었나 } (저장하지 않음) */
      paintHint: "",          /* 색을 잘못 칠했을 때 보여 주는 한 줄 */
      celebrate: null,        /* 마지막 구역을 칠한 직후 : "glow"(어두워지고 그림이 빛남) → "popup"(완성 팝업). 저장하지 않음 */
      locked: false,
      selected: null,
      feedback: null,
      wrongChoices: new Set(),
      responses: {},
      reviewOpen: null,
      matchAssignments: {},
      slots: [],
      wrongSlots: [],         /* 순서 확인에서 틀린 칸 번호 — 카드를 다시 움직이면 비운다 */
      dragging: null,
      ghost: null
    };

    /* 새로고침해도 보던 화면 그대로 — 화면 상태를 세션에 담아 둔다 */
    const stateKey = `ai-ethics-quiz-state:${quiz.id}`;
    const saveState = () => {
      try {
        sessionStorage.setItem(stateKey, JSON.stringify({
          screen: state.screen,
          index: state.index,
          openPiece: state.openPiece,
          locked: state.locked,
          selected: state.selected,
          feedback: state.feedback,
          wrongChoices: [...state.wrongChoices],
          responses: state.responses,
          painted: state.painted,
          brush: state.brush,
          reviewOpen: state.reviewOpen,
          matchAssignments: state.matchAssignments,
          slots: state.slots,
          wrongSlots: state.wrongSlots
        }));
      } catch { /* 저장이 막혀 있어도 화면은 그대로 동작 */ }
    };
    const loadState = () => {
      try {
        const saved = JSON.parse(sessionStorage.getItem(stateKey) || "null");
        if (!saved) return;
        Object.assign(state, saved, {
          screen: saved.screen === "question" ? "puzzle" : saved.screen,
          openPiece: saved.openPiece ?? null,
          wrongChoices: new Set(saved.wrongChoices || []),
          responses: saved.responses || {},
          painted: saved.painted || {},
          brush: saved.brush ?? null,
          matchAssignments: saved.matchAssignments || {},
          slots: saved.slots || [],
          wrongSlots: saved.wrongSlots || [],
          dragging: null,
          justPainted: null,
          justEarned: null,
          paintHint: "",
          celebrate: null
        });
        /* 저장해 둔 값이 지금 문항과 맞지 않으면 그 문항만 처음 상태로 */
        const saw = quiz.questions[state.index];
        if (!saw) resetQuestion(0);
        else if (saw.type === "order" && state.slots.length !== saw.correctOrder.length) resetQuestion(state.index);
        if (state.openPiece !== null && !quiz.questions[state.openPiece]) state.openPiece = null;
      } catch { /* 저장값이 깨졌으면 처음 화면부터 */ }
    };

    const current = () => quiz.questions[state.index];
    const letter = (index) => String.fromCharCode(65 + index);
    const caseMark = (index) => ["①", "②", "③", "④", "⑤", "⑥"][index] || index + 1;
    const caseNo = String("①②③④⑤⑥".indexOf((quiz.number || "").replace(/[^①②③④⑤⑥]/g, "")) + 1 || 1).padStart(2, "0");
    const isDone = (index) => Boolean(state.responses[index]?.done);
    const allDone = () => quiz.questions.every((_, index) => isDone(index));
    const doneCount = () => quiz.questions.filter((_, index) => isDone(index)).length;
    /* 맞힌 문항의 색은 팔레트에 들어오고, 학생이 그 색으로 그림의 구역을 칠한다 */
    const isPainted = (rid) => Boolean(state.painted[rid]);
    const allPainted = () => REGIONS.every((region) => isPainted(region.id));
    const paintedCount = () => REGIONS.filter((region) => isPainted(region.id)).length;
    const isEarned = (index) => isDone(index);

    /* 하단 버튼은 결과 화면에만 — ‘처음부터 다시’ 하나만 둔다.
       표지 → 퍼즐판 → 결과는 시작 버튼·완성 띠 버튼으로만 이동한다. */
    const navBar = () => (state.screen === "result"
      ? `
      <nav class="stage-nav" aria-label="화면 이동">
        <button class="btn btn-sky cover-go" type="button" data-action="restart">처음부터 다시</button>
      </nav>`
      : "");
    const record = (index) => {
      if (!state.responses[index]) state.responses[index] = { picked: [], misses: 0, done: false, correctFirst: false, solved: null };
      return state.responses[index];
    };
    const resetQuestion = (index) => {
      const question = quiz.questions[index];
      state.index = index;
      state.locked = false;
      state.selected = null;
      state.feedback = null;
      state.wrongChoices = new Set();
      state.matchAssignments = {};
      state.slots = question?.type === "order" ? question.correctOrder.map(() => null) : [];
      state.wrongSlots = [];
      state.dragging = null;

      /* 이미 맞힌 문항을 다시 열었다면, 그때 맞힌 답과 해설을 그대로 되살린다. */
      const rec = state.responses[index];
      if (!question || !rec || !rec.done || !rec.solved) return;
      state.locked = true;
      state.selected = rec.solved.selected ?? null;
      if (question.type === "order" && Array.isArray(rec.solved.slots)) state.slots = [...rec.solved.slots];
      if (question.type === "match" && rec.solved.matchAssignments) state.matchAssignments = { ...rec.solved.matchAssignments };
      state.feedback = { tone: "correct", text: question.correctFeedback };
    };
    const markSolved = () => {
      const rec = record(state.index);
      rec.done = true;
      rec.correctFirst = rec.misses === 0;
      /* 맞힌 답을 담아 둔다 — 나중에 이 문항을 다시 열었을 때 그대로 보여 주려고 */
      rec.solved = {
        selected: state.selected,
        slots: [...state.slots],
        matchAssignments: { ...state.matchAssignments }
      };
    };
    const finishQuiz = () => {
      const done = completed();
      done[quiz.id] = true;
      localStorage.setItem(completionKey, JSON.stringify(done));
      state.screen = "result";
      state.openPiece = null;
      render();
    };
    /* 문제 팝업을 닫는다. 맞힌 문항이면 그 색이 팔레트에 들어오는 움직임을 보여 준다. */
    const closePiece = () => {
      const earned = state.openPiece !== null && isEarned(state.openPiece);
      state.justEarned = earned ? state.openPiece : null;
      state.openPiece = null;
      render();
    };

    const track = () => `
      <span class="case-dots" aria-hidden="true">
        ${quiz.questions.map((_, index) => `
          ${index ? '<span class="case-link"></span>' : ""}
          <span class="case-step ${isDone(index) ? "is-done" : index === state.openPiece ? "is-now" : ""}">${isDone(index) ? ICON.check : index + 1}</span>`).join("")}
      </span>`;

    const feedback = () => {
      if (!state.feedback) return "";
      const { tone, text } = state.feedback;
      const correct = tone === "correct";
      const title = correct
        ? "정답이에요! 퍼즐 조각을 찾았어요!"
        : tone === "hint" ? "좋아요, 계속 해 봐요!" : "다시 살펴볼까요?";
      const kind = correct ? "verdict-ok" : tone === "hint" ? "verdict-hint" : "verdict-again";
      return `
        <section class="verdict ${kind}" role="status" aria-live="polite">
          ${correct ? ICON.check : ICON.glass}
          <div><strong>${title}</strong><p>${escapeHTML(text)}</p></div>
        </section>`;
    };

    const wrapUp = () => {
      const parts = feedback();
      return parts ? `<div class="wrap-up">${parts}</div>` : "";
    };
    /* 맞힌 뒤 : 판정 상자와 '색 받기'를 한 줄에 — 버튼은 '정답 확인하기'가 있던 오른쪽 자리에 온다 */
    const doneRow = () => `
      <div class="act pz-done-row">
        ${feedback()}
        <button class="btn btn-sky" type="button" data-action="place-piece">색 받기</button>
      </div>`;

    /* 보기를 골랐을 때 따로 안내 문구는 띄우지 않는다 (정답 확인하기 단추가 켜지는 것으로 충분) */
    const selectStatus = () => "";

    /* 정답·오답 상자가 뜬 뒤에는 눌러도 소용없는 ‘정답 확인하기’를 아예 감춘다.
       다른 카드를 다시 고르면 상자가 사라지면서 버튼도 돌아온다. */
    /* 팝업 맨 아래 줄 : 문제 종류와 상관없이 항상 한 줄만 있고 높이가 같다(CSS min-height).
       풀기 전 = 확인 단추 줄 · 틀림/힌트 = 판정 상자 · 맞힘 = 판정 상자 + 색 받기 */
    const bottomRow = (question) => {
      if (state.locked) return doneRow();
      if (state.feedback) return `<div class="wrap-up">${feedback()}</div>`;
      let button = "";
      if (question.type === "choice") {
        button = `<button class="btn btn-sky" type="button" data-action="confirm-choice" ${state.selected === null ? "disabled" : ""}>정답 확인하기</button>`;
      } else if (question.type === "order") {
        const ready = state.slots.length > 0 && state.slots.every(Boolean);
        button = `<button class="btn btn-sky" type="button" data-action="check-order" ${ready ? "" : "disabled"}>순서 확인하기</button>`;
      }
      const note = question.type === "choice" ? escapeHTML(selectStatus(question)) : "";
      return `
      <div class="act">
        <p class="act-note" role="status" aria-live="polite">${note}</p>
        ${button}
      </div>`;
    };

    const choices = (question) => `
      <div class="answers answers-${question.choices.length}">
        ${question.choices.map(([label, correct], index) => {
          const again = state.wrongChoices.has(index);
          const right = state.locked && correct;
          const picked = !state.locked && state.selected === index;
          const classes = ["pick", again ? "is-again" : "", right ? "is-right" : "", picked ? "is-picked" : ""].filter(Boolean).join(" ");
          const mark = right ? `<span class="pick-mark">${ICON.check}<i>정답</i></span>`
            : again ? `<span class="pick-mark">${ICON.glass}<i>다시</i></span>`
              : picked ? `<span class="pick-mark is-pin">${ICON.pin}</span>` : `<span class="pick-mark"></span>`;
          return `
            <button class="${classes}" type="button" data-action="choice" data-index="${index}" aria-pressed="${picked}" ${state.locked || again ? "disabled" : ""}>
              <span class="pick-tag">${letter(index)}</span>
              <span class="pick-label">${escapeHTML(label)}</span>
              ${mark}
            </button>`;
        }).join("")}
      </div>`;

    const match = (question) => {
      const assignedTo = (categoryId) => question.items
        .filter((item) => state.matchAssignments[item.id] === categoryId);
      const remaining = question.items
        .filter((item) => !state.matchAssignments[item.id]);

      return `
        <p class="interaction-help">카드를 알맞은 칸으로 끌어 놓으세요. 각 칸에는 두 장씩 들어가요.</p>
        <div class="match-layout">
          <section class="drag-pool" aria-label="분류할 카드">
            <div class="drag-pool-heading"><strong>보기 카드</strong><span>남은 카드 ${remaining.length}장</span></div>
            <div class="drag-card-grid" role="list">
              ${remaining.map((item) => `
                <article class="drag-card" data-drag-kind="match" data-item-id="${item.id}" role="listitem">
                  <span class="drag-handle" aria-hidden="true">⋮⋮</span><span>${escapeHTML(item.text)}</span>
                </article>`).join("") || '<p class="pool-complete">모든 카드를 분류했어요.</p>'}
            </div>
          </section>
          <div class="match-board" aria-label="카드 분류 칸">
            ${question.categories.map((category) => {
              const assigned = assignedTo(category.id);
              return `
                <section class="match-zone drop-target" data-drop-kind="match" data-category="${category.id}" aria-label="${escapeHTML(category.label)} 분류 칸">
                  <div class="match-zone-heading">
                    <strong>${escapeHTML(category.label)}</strong><span>${assigned.length} / 2</span>
                  </div>
                  <div class="placed-card-list" role="list">
                    ${assigned.map((item) => `
                      <div class="placed-card" role="listitem"><span class="placed-check">✓</span><span>${escapeHTML(item.text)}</span></div>`).join("") || '<p class="empty-drop">여기에 끌어 놓기</p>'}
                  </div>
                </section>`;
            }).join("")}
          </div>
        </div>`;
    };

    /* 순서 맞추기 : 위의 1~4번 칸에 아래 보기 카드를 끌어다 놓는다.
       칸끼리 끌면 자리가 맞바뀌고, 보기 상자로 되끌면 카드가 되돌아온다.
       네 칸을 다 채워야 ‘순서 확인하기’가 열린다. */
    const order = (question) => {
      const remaining = question.initialOrder.filter((step) => !state.slots.includes(step));
      return `
      <p class="interaction-help">순서 카드를 1~4번 칸으로 끌어 놓으세요. 놓은 카드를 다시 끌면 자리를 바꿀 수 있어요.</p>
      <div class="order-layout">
        <div class="order-main">
          <div class="slot-row" role="list" aria-label="순서 칸">
            ${state.slots.map((step, index) => `
              <section class="slot-box drop-target${step ? (state.locked ? " is-right" : " is-filled") : (state.wrongSlots.includes(index) ? " is-wrong" : "")}" data-drop-kind="slot" data-slot-index="${index}" role="listitem" aria-label="${index + 1}번 칸">
                <span class="slot-no">${index + 1}</span>
                ${step
                  ? `<p class="slot-card" data-drag-kind="slot" data-step="${escapeHTML(step)}">${escapeHTML(step)}</p>`
                  : `<p class="slot-empty">${state.wrongSlots.includes(index) ? "다시 놓기" : "여기에 놓기"}</p>`}
              </section>`).join("")}
          </div>
          <section class="drag-pool drop-target" data-drop-kind="slot" aria-label="순서 카드">
            <div class="drag-pool-heading"><strong>순서 카드</strong><span>남은 카드 ${remaining.length}장</span></div>
            <div class="slot-pool" role="list">
              ${remaining.map((step) => `
                <article class="drag-card" data-drag-kind="slot" data-step="${escapeHTML(step)}" role="listitem">
                  <span>${escapeHTML(step)}</span>
                </article>`).join("")}
            </div>
          </section>
        </div>
      </div>`;
    };

    const recordCard = (question, index) => {
      const rec = state.responses[index] || { picked: [], misses: 0 };
      const clean = rec.misses === 0;
      const rows = [];
      if (question.type === "choice") {
        const answerIndex = question.choices.findIndex(([, correct]) => correct);
        rows.push(["내가 고른 카드", rec.picked.length
          ? rec.picked.map((pick) => `${letter(pick)}. ${escapeHTML(question.choices[pick][0])}`).join(" → ")
          : "고르지 않았어요", ""]);
        rows.push(["정답", `${letter(answerIndex)}. ${escapeHTML(question.choices[answerIndex][0])}`, "is-ok"]);
        rows.push(["맞는 이유", escapeHTML(question.correctFeedback), "is-ok"]);
        rows.push(["이건 아니에요", question.choices
          .map(([label], optionIndex) => (optionIndex === answerIndex ? null : `${letter(optionIndex)}. ${escapeHTML(label)}`))
          .filter(Boolean).join("<br>"), "is-no"]);
        rows.push(["왜 아닐까요?", escapeHTML(question.incorrectFeedback), "is-no"]);
      } else if (question.type === "order") {
        /* 순서 맞추기는 ‘정답 순서’ 자체가 오답 설명을 대신하므로 ‘왜 아닐까요?’ 줄은 넣지 않는다 */
        rows.push(["정답 순서", question.correctOrder.map((step, i) => `${i + 1}. ${escapeHTML(step)}`).join("<br>"), "is-ok"]);
        rows.push(["맞는 이유", escapeHTML(question.correctFeedback), "is-ok"]);
      } else if (question.type === "match") {
        rows.push(["정답 분류", question.categories.map((category) => `${escapeHTML(category.label)} · ${question.items.filter((item) => item.category === category.id).map((item) => escapeHTML(item.text)).join(", ")}`).join("<br>"), "is-ok"]);
        rows.push(["맞는 이유", escapeHTML(question.correctFeedback), "is-ok"]);
        rows.push(["왜 아닐까요?", escapeHTML(question.incorrectFeedback), "is-no"]);
      }
      /* 성적 배지는 ‘내가 고른 카드’ 줄 오른쪽 끝에 붙인다(그 줄이 없으면 첫 줄) */
      const badge = `<span class="record-badge ${clean ? "is-clean" : "is-again"}">${clean ? ICON.check : ICON.glass}${clean ? "한 번에 찾았어요" : "다시 살펴보고 찾았어요"}</span>`;
      const badgeLabel = ((rows.find(([label]) => label === "내가 고른 카드") || rows[0]) || [])[0];

      /* 성격이 같은 줄끼리 묶어 카드로 보여 준다 : 내가 고른 카드 / 정답·이유 / 오답·이유 */
      const group = (tone, cls) => {
        const picked = rows.filter(([, , rowTone]) => (rowTone || "") === tone);
        if (!picked.length) return "";
        return `
          <dl class="rec-group ${cls}">
            ${picked.map(([label, value]) => `
              <div class="rec${label === badgeLabel ? " has-badge" : ""}"><dt>${label}</dt><dd><span>${value}</span>${label === badgeLabel ? badge : ""}</dd></div>`).join("")}
          </dl>`;
      };

      return `
        <article class="record is-${question.type}">
          <div class="record-clue">
            <p>${escapeHTML(question.material.replace(/\n/g, " "))}</p>
          </div>
          <h2 class="record-ask">${escapeHTML(question.prompt)}</h2>
          <div class="record-rows">
            ${group("", "is-pick")}${group("is-ok", "is-ok")}${group("is-no", "is-no")}
          </div>
        </article>`;
    };

    /* 문항의 자료 그림 : image 표시에 따라 주소 목록을 돌려준다 (없으면 빈 목록) */
    const artsOf = (question) => (question.image === "book" ? [window.BOOK_ART || ""]
      : question.image === "rain" ? (window.RAIN_ART || [])
        : []).filter(Boolean);
    const artsHTML = (arts) => (arts.length > 1
      ? `<div class="quiz-arts">${arts.map((src, i) => `<img class="quiz-art" src="${src}" alt="자료 그림 ${i + 1}">`).join("")}</div>`
      : `<img class="quiz-art" src="${arts[0]}" alt="자료 그림">`);

    const reviewModal = () => {
      if (state.reviewOpen === null) return "";
      const question = quiz.questions[state.reviewOpen];
      if (!question) return "";
      return `
        <div class="modal-bg" data-action="close-review">
          <div class="modal-holder${question.image ? " has-art art-" + question.image : ""}" role="dialog" aria-modal="true" tabindex="-1" aria-label="조각 ${state.reviewOpen + 1} 풀이" data-action="modal-keep">
            ${caseFile((() => {
              const arts = artsOf(question);
              const record = `<div class="modal-scroll">${recordCard(question, state.reviewOpen)}</div>`;
              const done = `<button class="modal-done" type="button" data-action="close-review">닫기</button>`;
              /* 자료 그림이 있는 문항 : 오른쪽 기록은 한 줄이 유지되는 최소 폭, 남는 왼쪽에 그림(비율 유지).
                 닫기 버튼은 좌우 나눔 바깥에 두어 팝업 전체 기준으로 가운데에 온다 */
              return arts.length
                ? `<div class="quiz-split review-split${arts.length > 1 ? " has-many" : ""}">${artsHTML(arts)}<div class="quiz-main">${record}</div></div>${done}`
                : record + done;
            })(), { tab: `조각 ${caseMark(state.reviewOpen)} 풀이`, tight: true, plain: true })}
          </div>
        </div>`;
    };

    /* ── 픽셀 그림판 ───────────────────────
       칸마다 <rect> 하나. 아직 안 칠한 칸은 그 색의 회색, 칠한 칸은 제 색.
       구역(같은 색이 붙은 칸 묶음)을 누르면 고른 색이 맞을 때 통째로 칠해진다. */
    const canvas = (glow) => {
      const cells = REGIONS.map((region) => {
        const painted = isPainted(region.id);
        const fill = painted ? PAINT[region.color].hex : PAINT[region.color].gray;
        const cls = `px-cell${painted ? " is-painted" : ""}${state.justPainted === region.id ? " is-new" : ""}`;
        return region.cells.map(([x, y]) => `<rect class="${cls}" data-action="paint" data-region="${region.id}" x="${x}" y="${y}" width="1" height="1" fill="${fill}"/>`).join("");
      }).join("");
      return `
        <div class="px-canvas${glow ? " is-glow" : ""}" aria-label="색칠 그림판">
          <svg class="px-svg" viewBox="0 0 ${PIXEL.cols} ${PIXEL.rows}" shape-rendering="crispEdges">${cells}</svg>
        </div>`;
    };

    /* 그림판 왼쪽 위(그림 바깥)에 두는 완성본 : 학생이 보고 따라 칠한다. 다 칠하면 감춘다 */
    const guideArt = () => (allPainted() ? "" : `
      <figure class="px-guide" aria-hidden="true">
        <svg class="px-guide-art" viewBox="0 0 ${PIXEL.cols} ${PIXEL.rows}" shape-rendering="crispEdges">
          ${REGIONS.map((region) => region.cells.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAINT[region.color].hex}"/>`).join("")).join("")}
        </svg>
        <figcaption>완성 그림</figcaption>
      </figure>`);

    /* 완성된 그림 (결과 화면용) */
    const finishedArt = () => `
      <svg class="px-art" viewBox="0 0 ${PIXEL.cols} ${PIXEL.rows}" shape-rendering="crispEdges" aria-label="완성된 그림">
        ${REGIONS.map((region) => region.cells.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAINT[region.color].hex}"/>`).join("")).join("")}
      </svg>`;

    /* 팔레트 : 문항마다 색 우물 하나. 못 얻은 색은 ? (누르면 문제), 얻은 색은 누르면 붓이 된다 */
    const earnedCount = () => quiz.questions.filter((_, qIndex) => isDone(qIndex)).length;
    const paletteTip = () => state.paintHint
      ? `<em class="pz-box-hint">${escapeHTML(state.paintHint)}</em>`
      : (earnedCount() ? "색을 고르고 그림의 회색 부분을 눌러 칠해요." : "");
    /* 붓질 뒤 부분 갱신 : 화면을 통째로 다시 그리면 그림이 흔들려 보이므로, 바뀐 글자만 바꾼다 */
    const refreshPaintInfo = () => {
      const count = app.querySelector(".px-progress b");
      if (count) count.textContent = paintedCount();
      const tipEl = app.querySelector(".px-palette-head span");
      if (tipEl) tipEl.innerHTML = paletteTip();
      saveState();
    };
    const palette = () => {
      const earned = earnedCount();
      const tip = paletteTip();
      return `
        <section class="px-palette" aria-label="팔레트">
          <div class="px-palette-head">
            <strong>얻은 색 <b>${earned}</b>개</strong>
            <span>${tip}</span>
          </div>
          <div class="px-board" role="list" aria-label="물감 자리">
            ${paletteBoard()}
            ${quiz.questions.map((_, qIndex) => {
              const key = colorOf(qIndex);
              const color = PAINT[key];
              if (!isDone(qIndex)) {
                return `
                  <button class="px-well is-locked" type="button" role="listitem" data-action="open-piece" data-index="${qIndex}" style="${wellStyle(qIndex)}" aria-label="문제를 풀고 색 얻기">
                    <span class="px-swatch"></span><span class="px-well-name">문제</span>
                  </button>`;
              }
              const active = state.brush === key;
              return `
                <button class="px-well${active ? " is-active" : ""}${state.justEarned === qIndex ? " is-new" : ""}" type="button" role="listitem" data-action="pick-brush" data-color="${key}" style="${wellStyle(qIndex)}" aria-pressed="${active}" aria-label="${color.name} 고르기">
                  <span class="px-swatch" style="background:${color.hex}"></span><span class="px-well-name">${color.name}</span>
                </button>`;
            }).join("")}
          </div>
          <div class="px-progress"><span>칠한 곳</span><span><b>${paintedCount()}</b> / ${REGIONS.length}</span></div>
        </section>`;
    };

    /* 완성 팝업 : 빛나는 연출이 끝난 뒤(또는 다 칠한 상태로 다시 열었을 때) 뜬다 */
    const completePopup = () => `
      <div class="modal-bg pz-pop-bg">
        <div class="modal-holder pz-pop-holder" role="dialog" aria-modal="true" tabindex="-1" aria-label="그림 완성" data-action="modal-keep">
          ${caseFile(`
            <div class="pz-done-pop">
              <h2>그림 완성!</h2>
              <p>색을 다 칠해 그림이 완성됐어요!<br>문제 ${quiz.questions.length}개를 모두 풀었어요.</p>
              <button class="btn btn-sky cover-go" type="button" data-action="nav-next">풀이 기록 보기</button>
            </div>`, { tight: true, plain: true })}
        </div>
      </div>`;

    /* 팔레트의 물음표를 눌렀을 때 뜨는 문제 팝업 — 상자 안에 자료·질문·보기가 담긴다.
       맞히면 ‘색 받기’ 버튼이 나와 팝업을 닫으며 그 색을 팔레트에 넣는다. */
    const pieceModal = () => {
      if (state.openPiece === null) return "";
      const question = quiz.questions[state.openPiece];
      if (!question) return "";
      const body = question.type === "match"
        ? match(question)
        : question.type === "order"
          ? order(question)
          : choices(question);
      /* 자료 그림이 있는 문항 : 왼쪽에 그림(여러 장이면 세로로), 오른쪽에 내용 (상자 크기는 그대로) */
      const arts = artsOf(question);
      const wrapArt = (inner) => (arts.length
        ? `<div class="quiz-split${arts.length > 1 ? " has-many" : ""}">${artsHTML(arts)}<div class="quiz-main">${inner}</div></div>`
        : inner);
      return `
        <div class="modal-bg" data-action="close-piece">
          <div class="modal-holder" role="dialog" aria-modal="true" tabindex="-1" aria-label="색 문제" data-action="modal-keep">
            ${caseFile(wrapArt(`
              <div class="clue">
                <span class="clue-icon">${ICON.glass}</span>
                <p class="clue-text">${escapeHTML(question.material)}</p>
              </div>
              <div class="ask">
                <h1>${escapeHTML(question.prompt)}</h1>
              </div>
              ${body}
              ${bottomRow(question)}`), { tab: `${PAINT[colorOf(state.openPiece)].name} 문제`, tight: true, ordered: question.type === "order", quiz: true })}
          </div>
        </div>`;
    };

    /* ── 표지 : 3D 픽셀 모으기 ───────────────
       로봇의 칸 하나하나에 앞뒤 깊이를 무작위로 주어 흩뿌려 두고, 휠을 굴리거나 위아래로 끌면
       시점이 정면으로 돌아오며 한 그림으로 모인다. 가로로 끌면 잠시 비틀어 볼 수 있고 놓으면 되돌아온다.
       거의 다 모이면(진행 90% 이상 · 비틀림 10도 안) 정면으로 맞춰 주고 시작 단추가 뜬다. 그림은 캔버스에 직접 그린다(칸 = 작은 네모). */
    let intro = null;
    const introSetup = () => {
      introAutoStop();   /* 이전 표지의 예약·진행이 남아 있으면 먼저 정리한다 */
      const cv = app.querySelector(".cover-3d");
      if (!cv) { intro = null; return; }
      let seed = 20260903;
      const rand = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      const cells = [];
      REGIONS.forEach((region) => region.cells.forEach(([x, y]) => {
        cells.push({ gx: x, gy: y, x: x - PIXEL.cols / 2 + .5, y: y - PIXEL.rows / 2 + .5, z: (rand() * 2 - 1) * 16, d: rand() * .28, ph: rand() * 6.283, w: .5 + rand() * .7, color: PAINT[region.color].hex });
      }));
      if (intro) clearTimeout(intro.idle);
      intro = { cv, cells, p: 0, tilt: 0, drag: null, done: false, raf: 0, autoTimer: 0, autoRaf: 0, idle: 0 };
      introDraw();
      /* 흩어져 있는 동안 칸들이 살짝 떠다니도록 계속 다시 그린다 (다 모이면 멈춘다) */
      const me = intro;
      const idle = () => {
        if (!intro || intro !== me || intro.done) return;
        if (!intro.drag) introDraw();
        intro.idle = setTimeout(idle, 33);
      };
      intro.idle = setTimeout(idle, 33);
      /* 0.5초 동안 손대지 않으면 저절로 모인다 */
      intro.autoTimer = setTimeout(introAutoStart, 500);
    };
    /* 자동 모으기 : 0.8초마다 25% → 50% → 75% → 100% 네 단계로 끊어서 모인다.
       흐른 시간으로 단계를 정하므로 틱이 늦어져도 속도가 같다 */
    const introAutoStart = () => {
      if (!intro || intro.done || intro.drag) return;
      const t0 = performance.now();
      const me = intro;   /* 표지를 다시 그렸으면 이 진행은 멈춘다 */
      let last = t0;
      const step = () => {
        if (!intro || intro !== me || intro.done || intro.drag) return;
        const now = performance.now();
        const dt = Math.min(200, now - last);
        last = now;
        const stage = Math.min(4, Math.floor((now - t0) / 800) + 1);
        const target = stage * .25;
        /* 일정한 속도로 목표를 향해 간다 (0.8초에 25%) — 손으로 모은 만큼은 되돌리지 않는다 */
        if (intro.p < target) intro.p = Math.min(target, intro.p + dt * (.25 / 800));
        introDraw();
        introCheck();
        if (intro && !intro.done) intro.autoRaf = setTimeout(step, 16);
      };
      intro.autoRaf = setTimeout(step, 0);
    };
    /* 손대면 자동 모으기를 멈춘다 */
    const introAutoStop = () => {
      if (!intro) return;
      clearTimeout(intro.autoTimer);
      clearTimeout(intro.autoRaf);
    };
    const introDraw = () => {
      if (!intro) return;
      const { cv, cells } = intro;
      const dpr = window.devicePixelRatio || 1;
      const w = cv.clientWidth;
      const hgt = cv.clientHeight;
      if (!w || !hgt) return;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hgt * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
      const ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, hgt);
      if (intro.done) {
        /* 다 모인 그림 : 칸 크기를 정수로 맞추고 왼쪽 위 기준점에서 격자대로 그려 칸끼리 겹치거나 틈이 생기지 않게 한다 */
        const unit = Math.max(1, Math.floor(Math.min(w, hgt) / 44 * 1.1));
        const ox = Math.round((w - unit * PIXEL.cols) / 2);
        const oy = Math.round((hgt - unit * PIXEL.rows) / 2);
        cells.forEach((c) => {
          ctx.fillStyle = c.color;
          ctx.fillRect(ox + c.gx * unit, oy + c.gy * unit, unit, unit);
        });
        const bar = app.querySelector(".cover-progress i");
        if (bar) bar.style.width = "100%";
        return;
      }
      const s = Math.min(w, hgt) / 44 * (intro.done ? 1.1 : 1);
      const cx = w / 2;
      const cy = hgt / 2;
      const tiltRad = intro.tilt * Math.PI / 180;
      const now = performance.now() / 1000;
      let moved = 0;   /* 칸들이 실제로 움직인 양의 합 → 진행 바 */
      const pts = cells.map((c) => {
        /* 칸마다 출발이 조금씩 늦다 : 전체 진행 p 에서 제 지연 d 를 뺀 만큼만 움직인다 (감속 없이 그대로) */
        const pc = Math.min(1, Math.max(0, (intro.p - c.d) / (1 - c.d)));
        moved += pc;
        const remain = 1 - pc;
        const th = (70 * remain) * Math.PI / 180 + tiltRad;   /* 세로축 회전 : 좌우로 흩어짐 */
        const ph = (24 * remain) * Math.PI / 180;             /* 가로축 회전 : 위아래로 흩어짐 */
        const c1 = Math.cos(th), s1 = Math.sin(th), c2 = Math.cos(ph), s2 = Math.sin(ph);
        /* 흩어져 있는 동안 살짝 떠다닌다 : 남은 만큼(remain) 흔들리고 모이면 사라진다 */
        const fx = Math.sin(now * c.w * 1.4 + c.ph) * .7 * remain;
        const fy = Math.cos(now * c.w + c.ph * 1.7) * .5 * remain;
        const cz = c.z * remain;   /* 깊이도 모이는 만큼 0 으로 → 다 모이면 크기·위치가 고르다 */
        const x1 = c.x * c1 - cz * s1 + fx;
        const z1 = c.x * s1 + cz * c1;
        const y1 = c.y * c2 - z1 * s2 + fy;
        const z2 = c.y * s2 + z1 * c2;
        return { x: x1, y: y1, z: z2, color: c.color };
      });
      pts.sort((a, b) => a.z - b.z);   /* 먼 것부터 그려 가까운 칸이 위에 온다 */
      pts.forEach((pt) => {
        const sz = intro.done ? s : s * (1 + pt.z / 70);
        const px = Math.round(cx + pt.x * s - sz / 2);
        const py = Math.round(cy + pt.y * s - sz / 2);
        ctx.fillStyle = pt.color;
        ctx.fillRect(px, py, Math.ceil(sz), Math.ceil(sz));
        if (!intro.done) {   /* 흩어져 있을 때는 칸마다 어두운 밑면을 그려 입체처럼 */
          ctx.fillStyle = "rgba(27, 47, 63, .28)";
          ctx.fillRect(px, py + Math.ceil(sz) - 1, Math.ceil(sz), 1);
          ctx.fillRect(px + Math.ceil(sz) - 1, py, 1, Math.ceil(sz));
        }
      });
      const bar = app.querySelector(".cover-progress i");
      if (bar) bar.style.width = Math.round(moved / cells.length * 100) + "%";   /* 그림이 모인 만큼 = 바 길이 */
    };
    const introCheck = () => {
      if (!intro || intro.done) return;
      /* 97% 이상 모이면(비틀림 10도 안) 정면으로 딱 맞춰 준다 — 절반쯤 모였을 때 갑자기 완성되지 않도록 */
      if (intro.p >= .97 && Math.abs(intro.tilt) < 10) {
        intro.done = true;
        intro.tilt = 0;
        intro.p = 1;
        introDraw();
        app.querySelector(".cover")?.classList.add("is-ready");
        /* 그림이 모이면 바로 제목과 설명이 함께 나타나고, 이어서 시작 단추 (그림이 위로 올라가는 동안 함께 떠오른다) */
        const show = (sel, delay) => setTimeout(() => {
          const el = app.querySelector(sel);
          if (!el) return;
          el.removeAttribute("hidden");
          el.classList.add("is-appear");
        }, delay);
        show(".cover-title", 300);
        show(".cover-lead", 300);
        show(".cover-go", 900);
      }
    };
    /* 놓으면 비틀림이 서서히 0 으로 돌아온다 */
    const introSettle = () => {
      if (!intro) return;
      cancelAnimationFrame(intro.raf);
      const step = () => {
        if (!intro || intro.drag) return;
        intro.tilt *= .82;
        if (Math.abs(intro.tilt) < .3) intro.tilt = 0;
        introDraw();
        introCheck();
        if (intro.tilt !== 0) intro.raf = requestAnimationFrame(step);
      };
      intro.raf = requestAnimationFrame(step);
    };
    const introProgress = (delta) => {
      if (!intro || intro.done) return;
      intro.p = Math.min(1, Math.max(0, intro.p + delta));
      introDraw();
      introCheck();
    };

    /* 다시 보기 팝업(그림 있는 문항) : 열릴 때마다 오른쪽 기록의 높이(자료 상자 위 ~ 마지막 상자 아래)를 재서
       그림 높이를 거기에 맞추고(비율 유지), 남는 폭을 안쪽 점선 기준 여백 세 곳(왼쪽 · 그림~기록 · 오른쪽)에 똑같이 나눈다.
       기록 내용(다시 살펴본 문항은 줄이 더 길고 높다)에 따라 달라지므로 CSS 고정값 대신 여기서 계산한다. 값은 rem 이라 창 크기가 바뀌어도 그대로다. */
    const fitReviewArt = () => {
      const holder = app.querySelector(".modal-holder.has-art");
      if (!holder) return;
      const paper = holder.querySelector(".case-paper");
      const split = holder.querySelector(".review-split");
      const main = holder.querySelector(".quiz-main");
      const clue = holder.querySelector(".record-clue");
      const recs = [...holder.querySelectorAll(".rec-group, .rec")];   /* 마지막 상자(주황 테두리)까지 */
      const imgs = [...holder.querySelectorAll(".quiz-art")];
      const arts = holder.querySelector(".quiz-arts");
      if (!paper || !split || !main || !clue || !recs.length || !imgs.length) return;
      if (imgs.some((img) => !img.naturalWidth)) { imgs.forEach((img) => { img.onload = fitReviewArt; }); return; }   /* 그림이 아직이면 읽힌 뒤에 */
      const px = parseFloat(getComputedStyle(document.documentElement).fontSize);   /* 1rem 의 픽셀 */
      const rem = (v) => v / px;
      const topIn = (el) => { let y = 0; while (el && el !== paper) { y += el.offsetTop; el = el.offsetParent; } return y; };
      const groups = recs.filter((el) => el.classList.contains("rec-group"));
      const last = groups.length ? groups[groups.length - 1] : recs[recs.length - 1];   /* 마지막 상자의 바깥 테두리 아래 */
      const H = rem(topIn(last) + last.offsetHeight - topIn(clue));   /* 오른쪽 기록 높이 : 자료 상자 위 ~ 마지막 상자 아래 (테두리 포함) */
      const b = rem(parseFloat(getComputedStyle(imgs[0]).borderTopWidth));   /* 그림 테두리 굵기 */
      const ratios = imgs.map((img) => img.naturalHeight / img.naturalWidth);
      const gap = arts ? rem(parseFloat(getComputedStyle(arts).rowGap) || 0) : 0;
      const ins = getComputedStyle(paper, "::before");
      const dashed = rem(parseFloat(ins.left) + parseFloat(ins.borderLeftWidth));   /* 상자 안쪽 점선까지의 거리 */
      /* 높이 H 를 채우는 그림 폭 (여러 장이면 세로로 쌓은 높이의 합이 H) 와 그 반대 */
      const sumR = ratios.reduce((a, r) => a + r, 0);
      const widthFor = (height) => (height - 2 * b * imgs.length - gap * (imgs.length - 1)) / sumR + 2 * b;
      const heightFor = (width) => (width - 2 * b) * sumR + 2 * b * imgs.length + gap * (imgs.length - 1);
      const apply = (width) => {
        if (arts) { arts.style.width = width + "rem"; arts.style.flexBasis = width + "rem"; }
        else { imgs[0].style.boxSizing = "border-box"; imgs[0].style.width = width + "rem"; imgs[0].style.height = heightFor(width) + "rem"; imgs[0].style.maxHeight = "none"; }
      };
      /* 여백을 0 으로 두고 오른쪽 기록의 본래 폭(한 줄 그대로)을 잰다 */
      paper.style.paddingLeft = "0px"; paper.style.paddingRight = "0px"; split.style.gap = "0px";
      let width = widthFor(H);
      apply(width);
      const inner = rem(paper.clientWidth);
      const mainW = rem(main.offsetWidth);
      const minGap = 2;   /* 여백이 이보다 작아지면 그림을 조금 줄여서라도 한 줄을 지킨다 */
      let m = (inner - width - mainW - 2 * dashed) / 3;
      if (m < minGap) { m = minGap; width = inner - mainW - 2 * dashed - 3 * m; apply(width); }
      paper.style.paddingLeft = (m + dashed) + "rem";
      paper.style.paddingRight = (m + dashed) + "rem";
      split.style.gap = m + "rem";
    };

    const render = () => {
      document.title = `${quiz.lesson} ${quiz.number} · ${quiz.title}`;
      document.body.classList.remove("is-modal-open");
      saveState();

      if (state.screen === "start") {
        app.innerHTML = frame(`
          <div class="cover">
            <div class="cover-stage">
              <canvas class="cover-3d" aria-label="흩어진 픽셀 그림"></canvas>
              <p class="cover-hint3d cover-loading" aria-live="polite">Loading</p>
              <div class="cover-progress" aria-hidden="true"><i></i></div>
            </div>
            <div class="cover-below">
              <div class="cover-below-in">
                <h1 class="cover-title" hidden><b>${escapeHTML(quiz.title)}</b></h1>
                <p class="cover-lead" hidden>${escapeHTML(quiz.shortDescription)}</p>
                <button class="btn btn-sky cover-go" type="button" data-action="start" hidden>색칠 시작하기</button>
              </div>
            </div>
          </div>`, "", "", { cover: true });
        introSetup();
        return;
      }

      introAutoStop();
      if (intro) clearTimeout(intro.idle);
      intro = null;
      if (state.screen === "result") {
        const total = quiz.questions.length;
        const firstTry = quiz.questions.filter((_, index) => state.responses[index]?.correctFirst).length;
        app.innerHTML = frame(`<div class="result-wrap">` + caseFile(`
          <div class="solved">
            <div class="solved-head">
              <div class="solved-art px-art-wrap">${finishedArt()}</div>
              <div class="solved-title">
                <h1>그림 완성!</h1>
                <p class="solved-lead">문제를 모두 풀고 색을 다 칠해 그림을 완성했어요!</p>
                <p class="solved-score">${ICON.check}처음에 바로 얻은 색 <b>${firstTry}</b> / ${total}</p>
              </div>
            </div>
            <div class="record-buttons">
              ${quiz.questions.map((_, index) => {
                const clean = state.responses[index]?.correctFirst;
                return `
                  <button class="record-btn ${clean ? "is-clean" : "is-again"}" type="button" data-action="open-review" data-index="${index}">
                    <span class="record-no px-record-swatch" style="background:${PAINT[colorOf(index)].hex}" aria-hidden="true"></span>
                    <span class="record-txt">${PAINT[colorOf(index)].name} 문제 다시 보기<em>${clean ? "한 번에 찾았어요" : "다시 살펴봤어요"}</em></span>
                    <span class="record-ico">${clean ? ICON.check : ICON.glass}</span>
                  </button>`;
              }).join("")}
            </div>
          </div>`, { tight: true, roomy: true, plain: true })
          + `<button class="btn btn-sky cover-go" type="button" data-action="restart">처음부터 다시</button></div>`
          + reviewModal(), "", "", { cover: true });
        if (state.reviewOpen !== null) {
          fitReviewArt();
          /* 글꼴이 늦게 읽히면 줄 높이가 바뀌므로 읽힌 뒤 한 번 더 맞춘다 */
          document.fonts?.ready?.then(() => { if (state.reviewOpen !== null && app.querySelector(".modal-holder.has-art")) fitReviewArt(); });
        }
        document.body.classList.toggle("is-modal-open", state.reviewOpen !== null);
        if (state.reviewOpen !== null) app.querySelector(".modal-holder")?.focus();
        return;
      }

      /* 그림판 화면 */
      const brushCursor = (hex) => {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 32 32">
          <path d="M27 2 l3 3 L16 19 l-3 -3 Z" fill="#8b5a2b" stroke="#1b2f3f" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M13 16 l3 3 -3 3 -3 -3 Z" fill="#c9ced3" stroke="#1b2f3f" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M10 19 l3 3 C11 27 7 29 3 29 C3 25 5 21 10 19 Z" fill="${hex}" stroke="#1b2f3f" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>`.replace(/\s+/g, " ");
        return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}") 6 66, crosshair`;   /* 72px 붓 · 붓끝(6,66)이 클릭 지점 */
      };
      const done = allPainted();
      const glow = done && state.celebrate === "glow";
      const popup = done && !glow;
      app.innerHTML = frame(`
        <div class="pz-wrap${glow ? " is-celebrate" : ""}">
          ${glow ? '<div class="pz-dim" aria-hidden="true"></div>' : ""}
          <p class="pz-intro">문제를 풀어 색을 얻고, 회색 그림에 색을 칠해요.</p>
          <div class="pz-main">
            ${guideArt()}
            ${canvas(glow)}
            ${done ? "" : palette()}
          </div>
        </div>` + (popup ? completePopup() : pieceModal()), "", "", { puzzle: true });
      state.justPainted = null;
      state.justEarned = null;
      /* 그림판 화면에서는 처음부터 붓 커서 (문제 팝업이 없고 아직 다 칠하지 않았을 때).
         색을 고르기 전에는 붓끝이 회색, 색을 고르면 그 색 */
      const stageEl = app.querySelector(".stage");
      if (stageEl && !done && state.openPiece === null) {
        stageEl.classList.add("is-brush");
        stageEl.style.cursor = brushCursor(state.brush ? PAINT[state.brush].hex : "#cfd6dc");
      }
      document.body.classList.toggle("is-modal-open", state.openPiece !== null || popup);
      if (state.openPiece !== null || popup) app.querySelector(".modal-holder")?.focus();
    };

    app.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      if (button.dataset.action === "modal-keep") return;
      if (button.dataset.action === "open-review") {
        state.reviewOpen = Number(button.dataset.index);
        render();
        return;
      }
      if (button.dataset.action === "close-review") {
        state.reviewOpen = null;
        render();
        return;
      }
      if (button.dataset.action === "open-piece") {
        const index = Number(button.dataset.index);
        if (!quiz.questions[index]) return;
        state.openPiece = index;
        resetQuestion(index);
        render();
        return;
      }
      if (button.dataset.action === "close-piece" || button.dataset.action === "place-piece") {
        closePiece();
        return;
      }
      /* 팔레트에서 색 고르기 (다시 누르면 내려놓기) */
      if (button.dataset.action === "pick-brush") {
        const key = button.dataset.color;
        const qIndex = questionOfColor(key);
        if (qIndex < 0 || !isDone(qIndex)) return;
        state.brush = state.brush === key ? null : key;
        state.paintHint = "";
        render();
        return;
      }
      /* 그림의 구역을 눌렀는데 칠해지지 않았다면 이유를 알려 준다 (칠하기 자체는 아래 붓질 처리에서) */
      if (button.dataset.action === "paint") {
        if (state.openPiece !== null || allPainted()) return;
        const region = REGIONS[Number(button.dataset.region)];
        if (!region || isPainted(region.id)) return;
        state.paintHint = !state.brush
          ? "먼저 팔레트에서 색을 골라요."
          : `이 자리는 ${PAINT[state.brush].name}이 아니에요.\n다른 색을 골라 보세요.`;   /* 두 줄로 */
        refreshPaintInfo();
        return;
      }
      if (button.dataset.action === "start") {
        state.screen = "puzzle";
        state.responses = {};
        state.painted = {};
        state.brush = null;
        state.paintHint = "";
        state.reviewOpen = null;
        state.openPiece = null;
        resetQuestion(0);
        render();
        return;
      }
      /* 처음부터 다시 : 풀이 기록을 비우고 표지로 돌아간다 */
      if (button.dataset.action === "restart") {
        state.screen = "start";
        state.responses = {};
        state.painted = {};
        state.brush = null;
        state.paintHint = "";
        state.reviewOpen = null;
        state.openPiece = null;
        resetQuestion(0);
        render();
        return;
      }
      /* 완성 띠의 ‘풀이 기록 보기’ */
      if (button.dataset.action === "nav-next") {
        if (state.screen !== "puzzle" || !allPainted()) return;
        state.reviewOpen = null;
        finishQuiz();
        return;
      }

      if (state.openPiece === null) return;
      const question = current();
      if (button.dataset.action === "choice" && question.type === "choice" && !state.locked) {
        state.selected = Number(button.dataset.index);
        state.feedback = null;
        render();
      }

      if (button.dataset.action === "confirm-choice" && question.type === "choice" && !state.locked) {
        const selected = state.selected;
        if (selected === null) return;
        const [, correct] = question.choices[selected];
        const rec = record(state.index);
        rec.picked.push(selected);
        if (correct) {
          state.locked = true;
          markSolved();
          state.feedback = { tone: "correct", text: question.correctFeedback };
        } else {
          rec.misses += 1;
          state.wrongChoices.add(selected);
          state.selected = null;
          state.feedback = { tone: "wrong", text: question.incorrectFeedback };
        }
        render();
      }

      if (button.dataset.action === "check-order" && question.type === "order" && !state.locked) {
        if (!state.slots.length || !state.slots.every(Boolean)) return;
        const isCorrect = state.slots.every((step, index) => step === question.correctOrder[index]);
        if (isCorrect) {
          state.locked = true;
          state.wrongSlots = [];
          markSolved();
          state.feedback = { tone: "correct", text: question.correctFeedback };
        } else {
          record(state.index).misses += 1;
          /* 틀린 칸만 표시하고, 그 칸의 카드는 순서 카드 상자로 되돌린다 (맞은 카드는 그대로 둔다) */
          state.wrongSlots = state.slots
            .map((step, index) => (step === question.correctOrder[index] ? -1 : index))
            .filter((index) => index >= 0);
          state.wrongSlots.forEach((index) => { state.slots[index] = null; });
          state.feedback = { tone: "wrong", text: question.incorrectFeedback };
        }
        render();
      }
    });

    const removeDropHighlights = () => {
      app.querySelectorAll(".is-drop-ready").forEach((target) => target.classList.remove("is-drop-ready"));
    };

    /* 끌고 있는 카드를 복제해 화면에 띄운다.
       손끝과 카드 모서리의 거리(dx, dy)를 기억해 두어야 잡은 지점이 어긋나지 않는다. */
    /* 복제본은 무대 밖(body)에 붙으므로 `.slot-pool .drag-card` 같은 자손 선택자가 끊긴다.
       글씨·여백을 지금 화면에서 그대로 옮겨 와야 원래 카드와 같은 모양(한 줄)이 된다. */
    const GHOST_TEXT = ["fontSize", "fontWeight", "lineHeight", "letterSpacing", "whiteSpace", "color", "display", "alignItems", "gap"];
    const GHOST_BOX = ["padding", "minHeight", "borderWidth", "borderStyle", "borderColor", "borderRadius", "backgroundColor"];
    const liftCard = (card, event) => {
      const box = card.getBoundingClientRect();
      const look = window.getComputedStyle(card);
      const ghost = card.cloneNode(true);
      ghost.classList.add("drag-ghost");
      ghost.classList.remove("is-dragging");
      ghost.removeAttribute("data-drag-kind");
      ghost.removeAttribute("data-drop-kind");
      ghost.setAttribute("aria-hidden", "true");
      GHOST_TEXT.forEach((key) => { ghost.style[key] = look[key]; });
      ghost.style.width = card.offsetWidth + "px";   /* 배치 크기 : 화면이 돌아가 있어도 변하지 않는다 */
      if (!card.classList.contains("slot-card")) {
        /* 원래 카드 모양이 있는 카드는 그 모양 그대로 */
        GHOST_BOX.forEach((key) => { ghost.style[key] = look[key]; });
        ghost.style.height = card.offsetHeight + "px";
      }
      /* 칸에 놓인 카드(.slot-card)는 글씨뿐이라 CSS 쪽에서 카드 모양을 입힌다 */
      document.body.appendChild(ghost);
      document.body.classList.add("is-grabbing");
      /* 잡은 지점(dx, dy)은 카드 안 좌표 : 세로 화면에서는 무대가 돌아가 있으므로 축을 바꿔 잰다.
         복제본은 이 지점을 축으로 돌리므로(transform-origin) 손끝에서 벗어나지 않는다 */
      const dx = isRotated() ? event.clientY - box.top : event.clientX - box.left;
      const dy = isRotated() ? box.right - event.clientX : event.clientY - box.top;
      ghost.style.transformOrigin = dx + "px " + dy + "px";
      state.ghost = { node: ghost, dx, dy };
      moveCard(event.clientX, event.clientY);
    };
    const moveCard = (x, y) => {
      const ghost = state.ghost;
      if (!ghost) return;
      /* 퍼즐 조각은 기울이지 않고 조금 키워서 또렷하게 보이게 */
      const piece = ghost.node.classList.contains("pz-earned");
      const turn = isRotated() ? "rotate(90deg) " : "";   /* 세로 화면 : 무대와 같은 방향으로 */
      ghost.node.style.transform = "translate(" + (x - ghost.dx) + "px, " + (y - ghost.dy) + "px) " + turn + (piece ? "scale(1.25)" : "rotate(-3deg) scale(1.05)");
    };
    const dropCard = () => {
      state.ghost?.node.remove();
      state.ghost = null;
      document.body.classList.remove("is-grabbing");
    };

    const clearDrag = () => {
      app.querySelectorAll(".is-dragging").forEach((card) => card.classList.remove("is-dragging"));
      state.dragging = null;
      dropCard();
      removeDropHighlights();
    };
    const dropTargetAt = (x, y, kind) => {
      const target = document.elementFromPoint(x, y)?.closest("[data-drop-kind]");
      return target?.dataset.dropKind === kind ? target : null;
    };
    const finishDrop = (target, drag) => {
      clearDrag();

      const question = current();

      if (drag.kind === "match" && question.type === "match") {
        const item = question.items.find((candidate) => candidate.id === drag.itemId);
        const categoryId = target.dataset.category;
        const inCategory = Object.values(state.matchAssignments)
          .filter((assigned) => assigned === categoryId).length;
        if (!item) return;
        if (inCategory >= 2) {
          state.feedback = { tone: "wrong", text: question.fullFeedback };
          render();
          return;
        }
        if (item.category !== categoryId) {
          record(state.index).misses += 1;
          state.feedback = { tone: "wrong", text: question.incorrectFeedback };
          render();
          return;
        }
        state.matchAssignments[item.id] = categoryId;
        if (Object.keys(state.matchAssignments).length === question.items.length) {
          state.locked = true;
          markSolved();
          state.feedback = { tone: "correct", text: question.correctFeedback };
        } else {
          state.feedback = { tone: "hint", text: question.progressFeedback };
        }
        render();
      }

      if (drag.kind === "slot" && question.type === "order") {
        const step = drag.step;
        if (!step) return;
        const slotIndex = target.dataset.slotIndex === undefined ? null : Number(target.dataset.slotIndex);
        const from = state.slots.indexOf(step);
        if (slotIndex === null) {
          if (from < 0) return;          /* 보기 상자로 되돌리기 */
          state.slots[from] = null;
        } else {
          if (from === slotIndex) return;
          const replaced = state.slots[slotIndex];
          state.slots[slotIndex] = step;
          if (from >= 0) state.slots[from] = replaced;   /* 칸끼리는 자리 맞바꾸기 */
        }
        state.feedback = null;
        state.wrongSlots = [];
        render();
      }
    };

    /* 한 구역을 칠한다 : 화면을 통째로 다시 그리지 않고 그 구역의 칸만 바로 색을 바꾼다 (붓질이 끊기지 않도록) */
    const paintRegion = (region) => {
      if (!region || isPainted(region.id) || region.color !== state.brush) return false;
      state.painted[region.id] = true;
      app.querySelectorAll(`.px-cell[data-region="${region.id}"]`).forEach((cell) => {
        cell.setAttribute("fill", PAINT[region.color].hex);
        cell.classList.add("is-painted", "is-new");
      });
      return true;
    };
    const cellAt = (x, y) => document.elementFromPoint(x, y)?.closest?.(".px-cell") || null;
    const endStroke = () => {
      const stroke = state.stroke;
      if (!stroke) return;
      state.stroke = null;
      if (!stroke.painted) return;
      state.paintHint = "";
      if (allPainted()) {
        /* 다 칠했다 : 주변을 어둡게 하고 그림을 빛나게 한 뒤, 잠시 후 완성 팝업 */
        state.celebrate = "glow";
        setTimeout(() => {
          if (state.celebrate !== "glow") return;
          state.celebrate = "popup";
          render();
        }, 4600);
        render();
        return;
      }
      refreshPaintInfo();
    };

    /* 표지 : 휠을 굴리면 모인다 (아래로 굴리면 모이고, 위로 굴리면 다시 흩어진다) */
    app.addEventListener("wheel", (event) => {
      if (!intro || state.screen !== "start") return;
      event.preventDefault();
      introAutoStop();
      introProgress(event.deltaY > 0 ? .07 : -.07);
    }, { passive: false });
    document.addEventListener("keydown", (event) => {
      if (!intro || state.screen !== "start") return;
      if (event.key === "ArrowDown" || event.key === " ") { event.preventDefault(); introAutoStop(); introProgress(.1); }
      if (event.key === "ArrowUp") { event.preventDefault(); introProgress(-.1); }
    });

    app.addEventListener("pointerdown", (event) => {
      /* 표지 : 위아래로 끌면 모이고, 가로로 끌면 비틀린다 */
      if (intro && event.target.closest?.(".cover-3d") && event.button === 0) {
        introAutoStop();
        cancelAnimationFrame(intro.raf);
        const at = toLocal(event.clientX, event.clientY);
        intro.drag = { pointerId: event.pointerId, x: at.x, y: at.y, p0: intro.p, tilt0: intro.tilt };
        event.target.setPointerCapture?.(event.pointerId);
        event.preventDefault();
        return;
      }
      const cell = event.target.closest?.(".px-cell");
      if (cell && event.button === 0 && state.brush && state.openPiece === null && !allPainted()) {
        const painted = paintRegion(REGIONS[Number(cell.dataset.region)]);
        state.stroke = { pointerId: event.pointerId, painted: painted ? 1 : 0 };
        event.preventDefault();
        return;
      }
      const card = event.target.closest("[data-drag-kind]");
      if (!card || event.button !== 0) return;
      const kind = card.dataset.dragKind;
      if (state.locked) return;
      state.dragging = {
        kind,
        itemId: card.dataset.itemId || null,
        step: card.dataset.step || null,
        pointerId: event.pointerId
      };
      card.classList.add("is-dragging");
      liftCard(card, event);
      card.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    app.addEventListener("pointermove", (event) => {
      if (intro && intro.drag && intro.drag.pointerId === event.pointerId) {
        const d = intro.drag;
        if (!intro.done) {
          const at = toLocal(event.clientX, event.clientY);
          intro.p = Math.min(1, Math.max(0, d.p0 + (at.y - d.y) / 260));
          intro.tilt = d.tilt0 + (at.x - d.x) * .35;
        }
        introDraw();
        return;
      }
      if (state.stroke && state.stroke.pointerId === event.pointerId) {
        const cell = cellAt(event.clientX, event.clientY);
        if (cell && paintRegion(REGIONS[Number(cell.dataset.region)])) state.stroke.painted += 1;
        return;
      }
      const drag = state.dragging;
      if (!drag || drag.pointerId !== event.pointerId) return;
      moveCard(event.clientX, event.clientY);
      removeDropHighlights();
      const target = dropTargetAt(event.clientX, event.clientY, drag.kind);
      if (target) target.classList.add("is-drop-ready");
      event.preventDefault();
    });

    app.addEventListener("pointerup", (event) => {
      if (intro && intro.drag && intro.drag.pointerId === event.pointerId) { intro.drag = null; introSettle(); return; }
      if (state.stroke && state.stroke.pointerId === event.pointerId) { endStroke(); return; }
      const drag = state.dragging;
      if (!drag || drag.pointerId !== event.pointerId) return;
      const target = dropTargetAt(event.clientX, event.clientY, drag.kind);
      if (target) finishDrop(target, drag);
      else clearDrag();
      event.preventDefault();
    });

    app.addEventListener("pointercancel", () => { endStroke(); clearDrag(); });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (state.reviewOpen !== null) {
        state.reviewOpen = null;
        render();
      } else if (state.openPiece !== null) {
        closePiece();
      }
    });
    loadState();
    render();
  };

  if (quizzes[document.body.dataset.quizId]) renderQuiz(quizzes[document.body.dataset.quizId]);
})();
  </script>
</body>
</html>
