/* 색 컨셉 : 하늘색 + 노랑. (퍼즐판 바탕 #DDEFF7 에 맞춤)
   같은 시리즈의 다른 활동(정리2 : 남색 + 청록)과 한눈에 구분되도록 잡았다.
   서류철 크림 베이지 · 정답 초록 · 다시 갈색은 시리즈 공통이라 건드리지 않는다.
   바탕과 상단 띠는 그라데이션 없이 단색으로 채운다. */
:root {
  --ink: #1b2f3f;
  --ink-soft: #4a6578;      /* 서류 위에서 읽히는 따뜻한 갈색 */
  --bark: #2b7fb8;          /* 주 색 : 버튼·라벨·번호칸 */
  --bark-deep: #17507a;     /* 더 진한 주 색 : 버튼 아랫단·제목 */
  --moss: #2e7d5b;          /* 지나온 단서 표시 */
  --sun: #f0c53f;           /* 강조색 : 노랑 */
  --sun-deep: #c79612;
  --desk: #DDEFF7;          /* 바탕(책상) */
  --parch: #c9dfec;
  --paper: #ffffff;
  --note: #eef7fc;          /* 단서 상자 바탕 */
  --sand: #e3f0f8;          /* 연한 모래빛 : 선택지 번호칸 */
  --leaf: #e7f2da;
  --edge: #a9c6d8;
  --ok: #1c7a4e;
  --ok-bg: #e5f3e6;
  --ok-edge: #9ccfae;
  --again: #8a4f15;
  --again-bg: #fdeed6;
  --again-edge: #e2b985;
}

* { box-sizing: border-box; }

body {
  display: grid;
  place-items: center;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  background: #000;          /* 16:9 무대 바깥은 검은 여백 */
  font-family: "Galmuri11", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-synthesis: none;      /* 픽셀 글꼴이 번지지 않도록 가짜 굵게를 만들지 않는다 */
}
/* 픽셀 글꼴은 자간을 줄이면 점이 겹친다 → 화면 안 모든 글자의 자간을 0 으로 */
.stage * { letter-spacing: 0 !important; }
body {
  font-size: 2rem;
  line-height: 1.5;
}

button { font: inherit; cursor: pointer; }
button:focus-visible { outline: .5rem solid var(--sun-deep); outline-offset: .4rem; }
h1, h2, p { margin-top: 0; }
svg text { font-family: inherit; }
.ico { width: 1.1em; height: 1.1em; flex: 0 0 auto; }

/* ── 무대(16:9 캔버스) ───────────────────────── */
.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 160rem;
  height: 90rem;
  overflow: hidden;
  background-color: var(--desk);
  /* 위쪽 빛 번짐(그라데이션)은 걷어내고, 은은한 점무늬만 남긴다 */
  background-image: radial-gradient(rgba(255, 255, 255, .07) .14rem, rgba(0, 0, 0, 0) .15rem);
  background-size: 2.4rem 2.4rem;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  min-height: 7.6rem;
  padding: 0 4rem;
  color: #fff;
  background: #5e3805;
  border-bottom: .6rem solid var(--sun);
}

.brand { display: flex; align-items: center; gap: 1.4rem; }

.brand-mark {
  display: grid;
  width: 5rem;
  height: 5rem;
  place-items: center;
  color: var(--bark-deep);
  background: var(--sun);
  border-radius: 1.5rem;
}

.brand-mark .ico { width: 2.9rem; height: 2.9rem; }
.brand-text { display: grid; line-height: 1.25; }
.brand-text b { font-size: 2.3rem; letter-spacing: -.02em; }
.brand-text em { color: #f0dcbb; font-size: 1.6rem; font-style: normal; font-weight: 700; }

.top-right { display: flex; align-items: center; gap: 1.6rem; }
.case-dots { display: flex; align-items: center; gap: .7rem; }

.case-step {
  display: grid;
  width: 4rem;
  height: 4rem;
  place-items: center;
  color: #f0dcbb;
  background: rgba(255, 255, 255, .12);
  border: .25rem solid rgba(255, 255, 255, .3);
  border-radius: 50%;
  font-size: 1.9rem;
  font-weight: 900;
}

.case-step .ico { width: 2rem; height: 2rem; }
.case-step.is-done { color: #fff; background: var(--moss); border-color: #8ad0b2; }
.case-step.is-now { color: #3d2a00; background: var(--sun); border-color: #fff; }
.case-link { width: 1.8rem; height: .35rem; background: rgba(255, 255, 255, .28); }

/* ── 무대 ───────────────────────────────────── */
.stage-body {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 3rem 4rem 1.6rem;   /* 상단 바 없이 바로 시작하므로 위 여백을 조금 더 둔다 */
}

/* ── 하단 가운데 화면 이동 줄 ────────────────── */
.stage-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.4rem;
  padding: 0 4rem 3.6rem;   /* 아래 여백 36px */
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: .8rem;
  min-height: 5.2rem;
  padding: 0 2.6rem;
  color: #f3dfc0;
  background: rgba(255, 255, 255, .1);
  border: .25rem solid rgba(255, 255, 255, .28);
  border-radius: 1.2rem;
  font-size: 2.1rem;
  font-weight: 800;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}

.nav-btn .ico { width: 2.4rem; height: 2.4rem; }
.nav-btn:hover:not(:disabled) { color: #fff; background: rgba(255, 255, 255, .2); border-color: rgba(255, 255, 255, .52); }
.nav-btn:disabled { cursor: default; opacity: .32; }
.nav-home { color: #3d2a00; background: var(--sun); border-color: #f6e08f; }
.nav-home:hover:not(:disabled) { color: #3d2a00; background: #ffd85e; border-color: #fff; }

/* ── 사건 기록 파일(서류철) : 모든 화면 공통 ───
   시작·문제·결과·팝업 화면 모두 같은 서류철 안에 담긴다.
   ① 이름표(탭) ② 폴더 몸통 ③ 속지 ④ 오른쪽 색인 탭 ⑤ 클립
   ──────────────────────────────────────────── */
.solved { text-align: center; }

/* 속지 첫 줄 : 오른쪽 위 CASE 배지가 앉을 자리만 비워 둔다 */
.sheet-top { min-height: 3.6rem; margin-bottom: 1.2rem; }

/* 캐릭터 원본 이미지(파일에 직접 담김) */
.kid-art { display: block; width: 100%; height: auto; }

.case-file {
  position: relative;
  width: 130rem;
  filter: drop-shadow(0 1.4rem 2.2rem rgba(0, 0, 0, .3));
}

/* 내용이 많은 화면(문제·결과·팝업)은 서류철 여백을 좁힌다 */
.case-file.is-tight .case-tab { height: 4.8rem; font-size: 2.2rem; }
.case-file.is-tight .case-folder { padding: 1.2rem 1rem 1.6rem; }
.case-file.is-tight .case-paper { padding: 3.4rem 2.6rem 3.4rem; }
.modal-bg .case-file.is-plain:not(.is-quiz) .case-paper { min-height: 0; padding: 5.6rem 8rem; }
.case-file.is-tight .case-no { top: 2.8rem; right: 2.6rem; padding: .7rem 2rem; font-size: 2.1rem; }
.case-file.is-tight .case-no .ico { width: 2.4rem; height: 2.4rem; }
.case-file.is-tight .case-index { top: 13rem; }

/* 결과 화면 : 위·아래 여백을 40px 씩 더 줘 서류철 세로폭을 넓힌다 */
.case-file.is-roomy .case-paper { padding-top: 5.8rem; padding-bottom: 6rem; }
.case-file.is-roomy .case-no { top: 2.8rem; }   /* 첫 화면과 같은 28px */
.case-file.is-tight .case-index i { height: 7.4rem; }

/* 오른쪽 색인 탭(폴더 뒤로 살짝 삐져나온 부분) */
.case-index {
  position: absolute;
  z-index: 0;
  top: 17rem;
  right: -3.4rem;
  display: grid;
  gap: 1.4rem;
}

.case-index i {
  display: block;
  width: 7.4rem;
  height: 8.6rem;
  border-radius: 0 1.3rem 1.3rem 0;
}

.case-index i:nth-child(1) { background: #d6e9f5; }
.case-index i:nth-child(2) { background: #9fc9e4; }
.case-index i:nth-child(3) { background: #f2c65a; }
.case-index i:nth-child(4) { background: #2b7fb8; }

/* 파일 이름표 */
.case-tab {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 1.4rem;
  height: 6rem;
  margin-left: 9rem;
  padding: 0 3.6rem;
  color: var(--bark-deep);
  background: #d6e9f5;
  border-radius: 1.6rem 1.6rem 0 0;
  font-size: 2.4rem;
  font-weight: 900;
  letter-spacing: -.02em;
}

.case-tab .ico { width: 3.2rem; height: 3.2rem; color: #17507a; }

/* 폴더 몸통 */
.case-folder {
  position: relative;
  z-index: 1;
  padding: 1.8rem 1.4rem 2.8rem;
  background: linear-gradient(180deg, #e3f0f8, #bcd8ea);
  border-radius: 2.4rem;
}

/* 속지 */
.case-paper {
  position: relative;
  padding: 3.6rem 3rem 3.8rem;
  background: #f4f9fd;
  border-radius: 2rem;
}

.case-paper::before {
  content: "";
  position: absolute;
  inset: 1.1rem;
  border: .25rem dashed #b9d5e6;
  border-radius: 1rem;
  pointer-events: none;
}

.case-watermark svg { display: block; width: 100%; height: auto; }

/* 사건 번호 배지 */
.case-no {
  position: absolute;
  top: 2.8rem;
  right: 3.4rem;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 1.2rem;
  margin: 0;
  padding: 1rem 2.4rem;
  color: var(--bark-deep);
  background: #dcebf5;
  border-radius: 1.3rem;
  font-size: 2.4rem;
  font-weight: 900;
  letter-spacing: .04em;
}

.case-no .ico { width: 2.7rem; height: 2.7rem; }

/* 머리말 */
.case-head { display: flex; align-items: center; gap: 3.6rem; margin-bottom: 2.8rem; padding-right: 20rem; }
.case-kid { position: relative; flex: 0 0 auto; width: 22rem; }
.case-mark { position: absolute; top: 3.6rem; left: -2rem; width: 5.2rem; }

.case-head h1 {
  display: flex;
  align-items: flex-end;
  gap: .8rem;
  margin: 0 0 1.2rem;
  color: var(--bark-deep);
  font-size: 5.6rem;
  line-height: 1.1;
  letter-spacing: -.05em;
}

.case-head h1 b {
  background: linear-gradient(transparent 56%, #fadf8c 56%, #fadf8c 93%, transparent 93%);
}

.case-lead { margin: 0; color: #4a6578; font-size: 2.4rem; font-weight: 700; }

/* 이번 사건 */
.case-brief {
  position: relative;
  overflow: hidden;
  margin-bottom: 2.8rem;
  padding: 2.6rem 2.6rem;
  background: #f4f9fd;
  border: .3rem dashed #7fb6dc;
  border-radius: 1.6rem;
}

.case-watermark { position: absolute; top: 50%; right: 3.4rem; width: 15rem; color: #dcebf5; transform: translateY(-50%); }
.case-brief-label, .case-brief b, .case-brief p { position: relative; }
.case-brief-label { color: #2b7fb8; font-size: 1.9rem; font-weight: 900; }
.case-brief b { display: block; margin: .4rem 0 .6rem; color: var(--bark-deep); font-size: 3.4rem; letter-spacing: -.03em; }
.case-brief p { margin: 0; color: #4a6578; font-size: 2.2rem; font-weight: 700; }

/* 시작 줄 */
.case-go { display: flex; flex-wrap: wrap; align-items: center; gap: 2.6rem; }
.case-go .btn { min-height: 7.2rem; padding: 1.4rem 3.4rem; }

/* ── 버튼 ───────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  min-height: 7.6rem;
  padding: 1.4rem 2.8rem;
  color: #fff;
  background: var(--bark);
  border: 0;
  border-bottom: .7rem solid var(--bark-deep);
  border-radius: 1.4rem;
  font-size: 2.5rem;
  font-weight: 900;
}

.btn:hover:not(:disabled) { filter: brightness(1.09); }
.btn:active:not(:disabled) { transform: translateY(.2rem); border-bottom-width: .4rem; }
.btn:disabled { cursor: default; opacity: .42; }
.btn-sun { color: #3a2800; background: var(--sun); border-bottom-color: #bb8412; }
/* 표지·결과의 큰 버튼 : 배경(하늘색 조각 테두리)에 어울리는 하늘색 */
.btn-sky { color: #fff; background: #4a9fd8; border-bottom-color: #2b7fb8; box-shadow: 0 .8rem 1.8rem rgba(43, 127, 184, .28); }
.btn-sky:hover:not(:disabled) { filter: brightness(1.06); }

/* ── 문제 화면 ──────────────────────────────── */

.clue {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 2.2rem;
  align-items: center;
  margin-bottom: 2rem;
  padding: 1.8rem 2.4rem;
  background: var(--note);
  border: .3rem dashed #5aa6d8;
  border-radius: 1.6rem;
}

.clue-icon {
  display: grid;
  width: 5.4rem;
  height: 5.4rem;
  place-items: center;
  color: #17507a;
  background: #bfe0f5;
  border-radius: 50%;
}

.clue-icon .ico { width: 2.9rem; height: 2.9rem; }
.clue-text { margin: 0; font-size: 2.6rem; font-weight: 800; line-height: 1.4; white-space: pre-line; }

.ask { margin-bottom: 2rem; padding-left: 2.6rem; border-left: .9rem solid var(--bark); }

.ask-label {
  display: inline-flex;
  align-items: center;
  gap: .8rem;
  color: var(--bark);
  font-size: 2rem;
  font-weight: 900;
}

.ask h1 { margin: 0; font-size: 3.9rem; line-height: 1.28; letter-spacing: -.035em; }

.answers { display: grid; gap: 2.4rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.answers-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.pick {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 1.8rem;
  min-height: 10.2rem;
  padding: 1.8rem 2.2rem;
  color: var(--ink);
  background: var(--paper);
  border: .4rem solid #a9c6d8;
  border-radius: 1.8rem;
  font-size: 2.8rem;
  font-weight: 900;
  text-align: left;
  transition: transform .14s ease, border-color .14s ease, background .14s ease;
}

.pick:hover:not(:disabled) { transform: translate(-.3rem, -.3rem); border-color: var(--bark); }
.pick:disabled { cursor: default; }

/* 채점이 끝나면 고르지 않은 선택지는 연하게 눌러 정답만 도드라지게 */
.pick:disabled:not(.is-right):not(.is-again) {
  color: #a3aab0;
  background: #f3f1ec;
  border-color: #d5d2c9;
}

.pick:disabled:not(.is-right):not(.is-again) .pick-tag {
  color: #a3aab0;
  background: #e9e6de;
  border-color: #cfcbc1;
}

.pick-tag {
  display: grid;
  width: 6.2rem;
  height: 6.2rem;
  place-items: center;
  color: var(--bark);
  background: var(--sand);
  border: .3rem solid var(--bark);
  border-radius: 1.6rem;
  font-size: 2.6rem;
}

.pick-mark { display: grid; justify-items: center; gap: .2rem; min-width: 5rem; }
.pick-mark .ico { width: 3.2rem; height: 3.2rem; }
.pick-mark i { font-size: 1.6rem; font-style: normal; font-weight: 900; }
.pick-mark.is-pin .ico { width: 5rem; height: 5rem; }

.pick.is-picked { background: #e8f4fb; border-color: var(--bark); }
.pick.is-picked .pick-tag { color: #fff; background: var(--bark); border-color: var(--bark-deep); }
.pick.is-picked .pick-mark { color: var(--bark); }

.pick.is-right { background: var(--ok-bg); border-color: var(--ok); }
.pick.is-right .pick-tag { color: #fff; background: var(--ok); border-color: #14603c; }
.pick.is-right .pick-mark { color: var(--ok); }

.pick.is-again { background: var(--again-bg); border-color: var(--again-edge); color: var(--again); }
.pick.is-again .pick-tag { color: var(--again); background: #f7ddb8; border-color: #c98a3f; }
.pick.is-again .pick-mark { color: var(--again); }

.act {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1.8rem;
  margin-top: 2.2rem;
}

.act-note { margin: 0; color: var(--ink-soft); font-size: 2.1rem; font-weight: 800; }
.wrap-up { display: flex; flex-wrap: wrap; align-items: center; gap: 1.8rem; margin-top: 1.8rem; }

.verdict {
  flex: 1 1 60rem;
  display: flex;
  align-items: flex-start;
  gap: 1.6rem;
  padding: 1.9rem 2rem;
  border: .3rem solid;
  border-radius: 1.6rem;
}

.verdict strong { display: block; margin-bottom: .2rem; font-size: 2.4rem; }
.verdict p { margin: 0; font-size: 2.1rem; font-weight: 700; line-height: 1.42; white-space: pre-line; }
.verdict .ico { width: 3.2rem; height: 3.2rem; margin-top: .3rem; }
.verdict-ok { color: #14603c; background: var(--ok-bg); border-color: var(--ok-edge); }
.verdict-again { color: var(--again); background: var(--again-bg); border-color: var(--again-edge); }
.verdict-hint { color: #17507a; background: var(--sand); border-color: #a9c6d8; }

/* ── 결과 화면 ──────────────────────────────── */
.solved-stamp { position: absolute; top: 1rem; right: 1rem; width: 10rem; opacity: .92; }

.solved-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  margin-bottom: 3rem;
  text-align: left;
}

.solved-kid { flex: 0 0 auto; width: 19rem; }
.solved-art { display: block; flex: 0 0 auto; width: 30rem; height: auto; border: .5rem solid #fff; border-radius: 1.2rem; box-shadow: 0 .8rem 1.8rem rgba(0, 0, 0, .25); }
.solved h1 { margin: 0 0 .8rem; font-family: "Galmuri14", "Galmuri11", sans-serif; font-size: 5rem; letter-spacing: -.05em; }
.solved-lead { margin: 0 0 1.6rem; color: var(--ink-soft); font-size: 2.4rem; font-weight: 700; }

.solved-score {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
  margin: 0;
  padding: 1rem 2.2rem;
  color: #17507a;
  background: var(--note);
  border: .3rem dashed #5aa6d8;
  border-radius: 1.4rem;
  font-size: 2.2rem;
  font-weight: 800;
}

.solved-score b { color: var(--bark); font-size: 2.8rem; }
.record-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.8rem; }

.record-btn {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 1.4rem;
  padding: 2.2rem 1.6rem;
  color: var(--bark);
  background: var(--paper);
  border: .4rem solid var(--bark);
  border-radius: 1.7rem;
  text-align: left;
  transition: transform .14s ease, background .14s ease;
}

.record-btn:hover { transform: translate(-.3rem, -.3rem); background: var(--sand); }

.record-no {
  display: grid;
  width: 4.4rem;
  height: 4.4rem;
  place-items: center;
  color: #fff;
  background: var(--bark);
  border-radius: 1.3rem;
  font-size: 2.2rem;
  font-weight: 900;
}

.record-txt { font-size: 2.2rem; font-weight: 900; line-height: 1.25; white-space: nowrap; }
.record-txt em { display: block; color: var(--ink-soft); font-size: 1.7rem; font-style: normal; font-weight: 800; }
.record-btn.is-clean .record-ico { color: var(--ok); }
.record-btn.is-again .record-ico { color: var(--again); }
.record-ico .ico { width: 2.8rem; height: 2.8rem; }

/* ── 사건 기록 팝업 ─────────────────────────── */
body.is-modal-open { overflow: hidden; }

.modal-bg {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 3rem;
  background: rgba(10, 40, 60, .62);
}

.modal-holder { text-align: left; }
.modal-holder:focus, .modal-holder:focus-visible { outline: none; }
.modal-bg .case-file { width: 112rem; }
/* 팝업은 아래 화면의 서류철과 겹치므로 색인 탭은 접어 둔다 */
.modal-bg .case-index { display: none; }
/* 무대(90rem)에서 팝업 여백 6rem 과 서류철 껍데기 14.4rem 을 뺀 만큼까지 늘려
   스크롤바가 생기지 않게 한다. overflow 는 만약을 위한 안전장치로만 남긴다. */
.modal-scroll { max-height: 69.6rem; overflow: auto; padding-right: .6rem; }


.record-badge {
  display: inline-flex;
  align-items: center;
  gap: .7rem;
  padding: .5rem 1.4rem;
  border: .25rem solid;
  border-radius: 99rem;
  font-size: 1.8rem;
  font-weight: 900;
}

.record-badge .ico { width: 2rem; height: 2rem; }
.record-badge.is-clean { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-edge); }
.record-badge.is-again { color: var(--again); background: var(--again-bg); border-color: var(--again-edge); }

.record-clue {
  margin-bottom: 1.8rem;
  padding: 1.4rem 1.8rem;
  background: var(--note);
  border: .3rem dashed #5aa6d8;
  border-radius: 1.4rem;
}

.record-clue p { margin: 0; font-size: 2.1rem; font-weight: 800; white-space: pre-line; }

.record-ask {
  margin: 0 0 2rem;
  color: var(--bark-deep);
  font-size: 2.9rem;
  line-height: 1.35;
  letter-spacing: -.03em;
}

.record-rows { display: grid; gap: 1.6rem; margin: 0; }

/* 같은 성격의 줄끼리 카드로 묶는다 */
.rec-group {
  margin: 0;
  padding: 1.4rem 2rem;
  border: .25rem solid;
  border-radius: 1.2rem;
}

.rec-group.is-pick { background: #eef5fa; border-color: #cfe3f1; }
.rec-group.is-ok { background: var(--ok-bg); border-color: var(--ok-edge); }
.rec-group.is-no { background: var(--again-bg); border-color: var(--again-edge); }

.rec {
  display: grid;
  grid-template-columns: 15rem minmax(0, 1fr);
  gap: 1.6rem;
  align-items: baseline;
  padding: .9rem 0;
  font-size: 2.1rem;
}

.rec + .rec { border-top: .2rem dashed rgba(40, 80, 110, .22); }
.rec dt { font-size: 1.8rem; font-weight: 900; letter-spacing: .01em; opacity: .78; }
.rec dd { margin: 0; font-weight: 800; line-height: 1.45; }
.rec.has-badge dd { display: flex; align-items: center; justify-content: space-between; gap: 1.6rem; }
.rec.has-badge dd > span { min-width: 0; }
.rec.has-badge dd .record-badge { flex: 0 0 auto; }
.rec-group.is-pick dt, .rec-group.is-pick dd { color: #2e4658; }
.rec-group.is-ok dt, .rec-group.is-ok dd { color: #14603c; }
.rec-group.is-no dt, .rec-group.is-no dd { color: var(--again); }

.modal-done {
  display: block;
  width: 100%;
  min-height: 7rem;
  margin-top: 2.4rem;
  color: #fff;
  background: var(--bark);
  border: 0;
  border-bottom: .7rem solid var(--bark-deep);
  border-radius: 1.6rem;
  font-size: 2.4rem;
  font-weight: 900;
}

.modal-done:hover { filter: brightness(1.09); }

/* ── 끌어 놓기 문항(다른 차시 공용) ─────────── */
.match-layout { display: grid; gap: 1.8rem; }
.interaction-help { margin: 0 0 1.4rem; color: var(--ink-soft); font-size: 2rem; font-weight: 800; }
.drag-pool { padding: 2rem; background: var(--note); border: .3rem dashed #5aa6d8; border-radius: 1.6rem; }
.drag-pool-heading, .match-zone-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; color: var(--bark); font-size: 2rem; font-weight: 900; }
.drag-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem; margin-top: 1.4rem; }
.drag-card, .order-card { user-select: none; -webkit-user-select: none; touch-action: none; background: var(--paper); border: .3rem solid #b9d5e6; border-radius: 1.6rem; font-size: 2.1rem; font-weight: 800; cursor: grab; }
.drag-card { display: flex; gap: 1rem; min-height: 11rem; padding: 1.6rem; }
.match-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.4rem; }
.match-zone { min-height: 20rem; display: flex; flex-direction: column; padding: 1.6rem; background: var(--paper); border: .4rem dashed #b9d5e6; border-radius: 1.6rem; }
.placed-card-list { display: grid; align-content: start; gap: 1rem; margin-top: 1.2rem; }
.placed-card { display: flex; gap: .8rem; padding: 1rem; color: #14603c; background: var(--ok-bg); border: .15rem solid var(--ok-edge); border-radius: 1rem; font-size: 1.8rem; font-weight: 800; }
.placed-check { display: grid; width: 2.2rem; height: 2.2rem; flex: 0 0 auto; place-items: center; color: #fff; background: var(--ok); border-radius: 50%; font-size: 1.4rem; }
.order-list { display: grid; gap: 1.4rem; }
.order-card { display: grid; grid-template-columns: 4.2rem 2.2rem minmax(0, 1fr) auto; align-items: center; gap: 1.4rem; padding: 1.6rem 1.8rem; }
.order-number { display: grid; width: 4rem; height: 4rem; place-items: center; color: #fff; background: var(--bark); border-radius: 1.2rem; font-weight: 900; }
.drag-handle { color: var(--bark); font-weight: 900; letter-spacing: -.2rem; }
.drag-card-note { color: var(--ink-soft); font-size: 1.7rem; font-weight: 800; white-space: nowrap; }
.empty-drop, .pool-complete { margin: 1.2rem 0 0; color: var(--ink-soft); font-size: 1.8rem; font-weight: 700; text-align: center; }
.is-dragging { opacity: .45; }
.is-drop-ready { background: #e8f4fb; border-color: var(--bark); }

/* ── 순서 맞추기 문항 ────────────────────────
   위에 1~4번 칸을 두고, 아래 보기 상자의 카드를 끌어다 채운다.
   네 칸이 모두 차야 ‘순서 확인하기’가 열리고, 놓은 카드는 다시 끌어 자리를 바꿀 수 있다.
   내용이 900px 무대를 넘지 않도록 카드 칸(왼쪽)과 설명·판정 상자(오른쪽)를 좌우로 나눈다.
   ──────────────────────────────────────────── */
.order-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 40rem;
  gap: 2.8rem;
  align-items: stretch;
}

/* 확인 버튼은 오른쪽 칸 맨 아래에 붙인다.
   그래야 버튼 아래 여백이 다른 문제 화면(정답 확인하기)과 똑같이 속지 여백만 남는다. */
.order-side { display: flex; flex-direction: column; min-width: 0; }
.order-side .wrap-up { margin-top: auto; margin-bottom: 0; }
.order-side .act { flex-direction: column; align-items: stretch; gap: 1.2rem; margin-top: auto; }

/* 1~4번 칸 */
.slot-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.4rem; }

.slot-box {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: .6rem;
  min-height: 6.4rem;
  padding: 1rem;
  background: var(--paper);
  border: .4rem dashed #b9d5e6;
  border-radius: 1.6rem;
  transition: border-color .14s ease, background .14s ease;
}

.slot-no {
  display: grid;
  width: 2.6rem;
  height: 2.6rem;
  place-items: center;
  color: #fff;
  background: var(--bark);
  border-radius: .9rem;
  font-size: 1.6rem;
  font-weight: 900;
}

.slot-empty { margin: 0; color: var(--ink-soft); font-size: 1.7rem; font-weight: 700; opacity: .72; }

/* 카드 글씨는 어느 카드든 한 줄로 — 그에 맞춰 칸 너비를 잡아 두었다 */
.slot-card {
  margin: 0;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  font-size: 1.8rem;
  font-weight: 900;
  line-height: 1.4;
  white-space: nowrap;
  cursor: grab;
}

.slot-card:active { cursor: grabbing; }
.slot-box.is-filled { background: #e8f4fb; border-style: solid; border-color: var(--bark); }
.slot-box.is-filled .slot-no { color: #3d2a00; background: var(--sun); }
.slot-box.is-wrong { background: var(--again-bg); border-style: solid; border-color: var(--again-edge); }
.slot-box.is-wrong .slot-no { background: var(--again); }
.slot-box.is-wrong .slot-card, .slot-box.is-wrong .slot-empty { color: var(--again); opacity: 1; }
.slot-box.is-right { background: var(--ok-bg); border-style: solid; border-color: var(--ok); }
.slot-box.is-right .slot-no { background: var(--ok); }
.slot-box.is-right .slot-card { color: #14603c; }

/* 아래 보기 상자 */
.order-main .drag-pool { margin-top: 1.8rem; padding: 1.6rem; }
.slot-pool { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.4rem; min-height: 5.6rem; margin-top: 1.2rem; }
.slot-pool .drag-card { min-height: 0; gap: .6rem; padding: 1.2rem; font-size: 1.8rem; line-height: 1.4; white-space: nowrap; }

/* 사건 번호 배지 자리(.sheet-top)·단서 상자·질문의 여백은 다른 문제 화면과 똑같이 둔다.
   (여기를 줄이면 CASE 배지가 노란 단서 상자를 덮는다)
   모자란 높이는 오른쪽 설명·판정 상자 칸에서만 아낀다. */
.case-file.is-order .interaction-help { margin-bottom: 1rem; font-size: 1.9rem; white-space: nowrap; }
.case-file.is-order .drag-pool-heading { font-size: 1.8rem; }
.case-file.is-order .btn { min-height: 6.4rem; font-size: 2.2rem; }
.case-file.is-order .verdict { padding: 1rem 1.4rem; }
.case-file.is-order .verdict strong { font-size: 1.9rem; }
.case-file.is-order .verdict p { font-size: 1.7rem; }

/* ── 끌고 있는 카드 ─────────────────────────
   원래 카드는 자리에 흐리게 남겨 두고, 복제본이 손끝을 따라온다.
   복제본은 pointer-events 를 꺼야 놓을 자리를 가리지 않는다.
   ──────────────────────────────────────────── */
.drag-ghost {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 90;
  margin: 0;
  opacity: .96;
  pointer-events: none;
  box-shadow: 0 1.6rem 2.6rem rgba(0, 0, 0, .34);
  will-change: transform;
}

/* 칸에 놓인 카드는 글씨만 있으므로 복제본에 카드 모양을 입힌다 */
.drag-ghost.slot-card {
  box-sizing: content-box;
  padding: 1.2rem 1.4rem;
  background: var(--paper);
  border: .3rem solid var(--bark);
  border-radius: 1.6rem;
}

.is-dragging { opacity: .28; }
body.is-grabbing, body.is-grabbing * { cursor: grabbing; }

/* ── 그림 퍼즐 활동 ───────────────────────────
   표지·결과 화면은 퍼즐 그림 위에 흰 막을 깔아 글씨가 잘 보이게 하고,
   문제 화면은 15조각 퍼즐판 + 아래쪽 빠진 조각 3개로 꾸민다.
   그림은 문서에 한 번만 심어 두고(<defs><image>) 조각마다 <use>로 끌어다 쓴다.
   ──────────────────────────────────────────── */
.pz-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* 표지·결과 : 알록달록 퍼즐 조각 테두리 배경 + 옅은 흰 막 */
.stage.is-cover::before, .stage.is-puzzle::before,
.stage.is-cover::after, .stage.is-puzzle::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
/* 그림은 화면을 채우는 크기(cover)의 1.1배로, 가운데 기준으로 키운다 */
.stage.is-cover::before, .stage.is-puzzle::before { background: var(--puzzle-bg) center / cover no-repeat #DDEFF7; }
/* 표지·퍼즐판·결과 모두 같은 흰 막(70%) */
.stage.is-cover::after, .stage.is-puzzle::after { background: rgba(255, 255, 255, .6); }
.stage.is-cover > *, .stage.is-puzzle > * { position: relative; z-index: 1; }

/* 흰 막 위에서는 하단 이동 버튼도 진한 색으로 */
.stage.is-cover .nav-btn { color: var(--bark-deep); background: rgba(255, 255, 255, .82); border-color: #7fb6dc; }
.stage.is-cover .nav-btn:hover:not(:disabled) { color: var(--bark-deep); background: #fff; border-color: var(--bark); }
.stage.is-cover .nav-home { color: #3d2a00; background: var(--sun); border-color: #e4b825; }
.stage.is-cover .nav-home:hover:not(:disabled) { background: #ffd85e; border-color: var(--bark); }

/* 표지 */
.cover { position: relative; display: grid; justify-items: center; gap: 0; width: 108rem; text-align: center; }
/* 표지에서는 위아래 여백을 같게 해 그림이 화면 정중앙에 온다 */
.stage.is-cover .stage-body { padding-top: 6rem; padding-bottom: 0; }   /* 위아래 여백 합은 그대로, 내용 전체를 30px 아래로 */
/* 표지의 3D 픽셀 모으기 판 */
.cover-stage {
  position: relative;
  width: 52rem;
  height: 44rem;
  background: #e8f1f8;
  border: .6rem solid var(--px-ink);
  box-shadow: 1rem 1rem 0 var(--px-shade);
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.cover-stage:active { cursor: grabbing; }
.cover-3d { display: block; width: 100%; height: 100%; }
/* 안내 문구 : 판 위(제목 자리)에 둔다 */
.cover-hint3d {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 3.2rem);   /* 그림과의 간격 : 12px → 32px */
  transform: translateX(-50%);
  margin: 0;
  padding: 1.2rem 3rem;   /* 상자 높이 약 20px 커짐 (글씨 2.2 → 3rem 포함) */
  color: #1f3a4d;
  background: rgba(255, 255, 255, .92);
  border: .4rem solid var(--px-ink);
  box-shadow: .5rem .5rem 0 var(--px-shade);
  font-size: 3rem;
  font-weight: 800;
  white-space: nowrap;
}
.cover-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 1rem; background: rgba(27, 47, 63, .15); }
.cover-progress i { display: block; height: 100%; width: 0; background: var(--bark); }   /* 전환 효과 없이 그림과 같은 순간에 움직인다 */
.cover-loading { padding: 0; background: none; border: 0; box-shadow: none; font-size: 4.6rem; font-family: "Galmuri14", "Galmuri11", sans-serif; }   /* 상자 없이 글자만, 크게 */
.cover-loading::after { content: ""; position: absolute; left: 100%; top: 0; text-align: left; animation: cover-dots 1.2s steps(1) infinite; }   /* 점은 글자 오른쪽에 따로 두어 Loading 자체가 가운데에 온다 */
@keyframes cover-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.cover.is-ready .cover-hint3d { display: none; }   /* 그림이 다 모이면 Loading 문구가 사라진다 */
.cover.is-ready .cover-progress { display: none; }
.cover .is-appear { animation: cover-rise .9s steps(8) both; }
@keyframes cover-rise {
  from { opacity: 0; transform: translateY(2.4rem); }
  to { opacity: 1; transform: none; }
}
/* 완성 문구가 물러나는 연출 : 위로 살짝 떠오르며 사라진다 */
.cover .is-vanish { animation: cover-vanish .6s steps(6) both; }
@keyframes cover-vanish {
  from { opacity: 1; transform: none; }
  to { opacity: 0; transform: translateY(-2.4rem); }
}
.cover.is-ready .cover-stage { animation: pz-glow 1.2s ease-out both; cursor: default; }
/* 다 모이기 전에는 시작 단추와 완성 문구를 감춘다 (hidden 속성이 display 규칙에 지지 않도록) */
.cover-ready[hidden] { display: none !important; }
.cover-title[hidden], .cover-lead[hidden] { display: block !important; visibility: hidden; }
.cover-go[hidden] { display: inline-flex !important; visibility: hidden; }
/* 판 아래 글 자리 : 처음엔 높이 0. 다 모이면 1초에 걸쳐 펼쳐지며 그림이 위로 올라가고,
   그 뒤로는 높이가 고정돼 문구가 바뀌어도 그림이 움직이지 않는다 */
.cover-below { position: relative; display: grid; grid-template-rows: 0fr; width: 100%; transition: grid-template-rows 2s cubic-bezier(.3, .7, .2, 1); }   /* 그림이 2초에 걸쳐 천천히 떠오른다 */
.cover.is-ready .cover-below { grid-template-rows: 1fr; }
/* 넘침을 자르지 않는다 : 단추의 픽셀 그림자와 떠오르는 연출이 아래에서 잘려 걸린 것처럼 보이지 않게. 아래 여백은 그림자 자리 */
.cover-below-in { display: grid; justify-items: center; gap: 1.2rem; min-height: 0; padding: 3.2rem 0 1rem; }   /* 그림 ↔ 제목 간격 : 12px → 32px */
/* 완성 문구는 판 바로 아래에 붙어 있어 판과 함께 올라간다 */
.cover-ready { position: absolute; top: 5.2rem; left: 0; right: 0;   /* 그림 ↔ 완성 문구 간격 : 32px → 52px */ display: flex; justify-content: center; margin: 0; color: #1f3a4d; font-size: 3.2rem; font-weight: 800; text-shadow: .3rem .3rem 0 #fff; }
.cover-ready b { color: var(--bark); }

.cover-kicker {
  display: inline-flex;
  align-items: center;
  gap: .9rem;
  margin: 0;
  padding: .7rem 2.2rem;
  color: #fff;
  background: var(--bark-deep);
  border-radius: 99rem;
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: .06em;
}

.cover-kicker .ico { width: 2.2rem; height: 2.2rem; }

.cover-title {
  margin: 0;
  color: var(--bark-deep);
  font-family: "Galmuri14", "Galmuri11", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-weight: 900;
  font-size: 6.4rem;
  line-height: 1.1;
  letter-spacing: -.05em;
  text-shadow: 0 .3rem 0 #fff, 0 0 2.6rem rgba(255, 255, 255, .95);
}

.cover-lead { margin: 0 0 .4rem; color: #1b2f3f; font-size: 2.8rem; font-weight: 800; text-shadow: 0 0 1.4rem #fff, 0 0 .4rem #fff; }

.cover-brief {
  width: 80rem;
  margin-top: 1rem;
  padding: 2.2rem 3rem;
  background: rgba(255, 255, 255, .88);
  border: .3rem dashed #7fb6dc;
  border-radius: 1.8rem;
  box-shadow: 0 1rem 2.6rem rgba(0, 40, 70, .18);
}

.cover-brief b { display: block; margin: .4rem 0 .6rem; color: var(--bark-deep); font-size: 3.6rem; letter-spacing: -.03em; }
.cover-brief p { margin: 0; color: #4a6578; font-size: 2.3rem; font-weight: 700; }

.cover-hint {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
  margin: 0;
  padding: .8rem 2rem;
  color: #17507a;
  background: rgba(255, 255, 255, .7);
  border-radius: 99rem;
  font-size: 2.1rem;
  font-weight: 800;
}

.cover-hint i { display: inline-block; width: 2.2rem; height: 2.2rem; background: var(--sun); border: .25rem solid var(--bark-deep); border-radius: .5rem; transform: rotate(-8deg); }
.cover-hint i + i { transform: rotate(6deg); }
.cover-go { min-height: 8.4rem; margin-top: .4rem; padding: 1.6rem 4.4rem; font-size: 3rem; }

/* 퍼즐판 화면 : 바탕은 연한 하늘색(#DDEFF7) */
.stage.is-puzzle { background: #DDEFF7; background-image: none; }
/* 퍼즐판 화면 : 위(안내 문장 위)·아래(퍼즐판 아래) 여백을 같게 */
.stage.is-puzzle .stage-body { padding: 2.4rem 4rem; }   /* 그림과 흰 막은 위의 ::before / ::after 가 맡는다 */

/* 퍼즐판 */
.pz-wrap { --pz-w: 100rem; display: grid; justify-items: center; gap: 1.4rem; }
/* 퍼즐판 + 오른쪽 얻은 조각 상자 */
.pz-main { display: flex; align-items: stretch; justify-content: center; gap: 4rem; transform: translateX(-1.5rem); }   /* 완성본 · 그림판 · 팔레트를 한 덩어리로 가운데 정렬 + 왼쪽 15px */
/* 결과 화면 : 결과 박스 + 처음부터 다시 버튼 (세로 가운데 정렬) */
.result-wrap { display: grid; justify-items: center; gap: 4.7rem; }   /* 처음부터 다시 단추를 15px 더 아래로 */
.result-wrap .cover-go { margin-top: 0; }
.result-wrap .case-file { width: 130rem; }   /* 갈무리11 기준 : 다시 보기 카드 글씨 한 줄 */
.result-wrap .case-file.is-plain .case-paper { border: .6rem solid var(--bark); }   /* 바깥 테두리를 진하게 */   /* 결과 박스 : 다시 보기 카드 세 장이 한 줄로 들어가는 폭 */
.pz-intro { margin: 0 0 .4rem; color: var(--bark-deep); font-size: 5.2rem; font-weight: 900; letter-spacing: -.02em; text-shadow: 0 0 1.4rem #fff, 0 0 .4rem #fff; }

.pz-board {
  position: relative;
  width: var(--pz-w);
  aspect-ratio: 16 / 9;
  background: #DDEFF7;
  border: .7rem solid #ffffff;
  border-radius: 1rem;
  box-shadow: 0 1.4rem 2.8rem rgba(0, 0, 0, .45), inset 0 0 0 .3rem #2b7fb8;
}

.pz-piece, .pz-hole { position: absolute; margin: 0; padding: 0; }
.pz-piece { z-index: 2; pointer-events: none; }
.pz-piece.is-found { z-index: 3; }
.pz-piece.is-snap { animation: pz-snap .75s cubic-bezier(.2, 1.3, .4, 1) both; }

@keyframes pz-snap {
  0% { transform: translateY(26rem) scale(1.35) rotate(-8deg); opacity: 0; }
  55% { opacity: 1; }
  100% { transform: none; opacity: 1; }
}

.pz-hole { z-index: 1; background: none; border: 0; cursor: pointer; }
.pz-hole-shape { fill: rgba(15, 8, 0, .62); stroke: var(--sun); stroke-width: 4; stroke-dasharray: 16 10; stroke-linejoin: round; transition: fill .16s ease; }
.pz-hole:hover .pz-hole-shape, .pz-hole:focus-visible .pz-hole-shape { fill: rgba(240, 197, 63, .38); }

.pz-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.pz-loose .pz-svg { height: auto; }
.pz-edge { fill: none; stroke: rgba(30, 15, 0, .5); stroke-width: 3; stroke-linejoin: round; }

/* 조각 번호 */
.pz-no {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 2;
  display: grid;
  width: 6rem;
  height: 6rem;
  place-items: center;
  color: #3d2a00;
  background: var(--sun);
  border: .4rem solid #fff;
  border-radius: 50%;
  font-size: 3rem;
  font-weight: 900;
  line-height: 1;
  box-shadow: 0 .6rem 1.4rem rgba(0, 0, 0, .38);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.pz-hole .pz-no { animation: pz-pulse 1.6s ease-in-out infinite; }
/* 순서 없이 풀므로 번호 배지는 쓰지 않는다 — 구멍은 점선 테두리와 어두운 바탕만으로 알린다 */

@keyframes pz-pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.14); }
}

/* 아래쪽 빠진 조각 상자 */
.pz-tray {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  width: var(--pz-w);
  min-height: 19.4rem;
  padding: 1rem 2.6rem;
  background: rgba(255, 255, 255, .55);
  border: .3rem dashed rgba(60, 100, 130, .4);
  border-radius: 1.6rem;
}

.pz-tray-note { display: grid; flex: 0 0 auto; gap: .5rem; color: #1f3a4d; text-align: left; white-space: nowrap; }
.pz-tray-note strong { font-size: 2.7rem; letter-spacing: -.02em; }
.pz-tray-note strong b { color: #2b7fb8; }
.pz-tray-note span { color: #3f5d70; font-size: 1.8rem; font-weight: 800; line-height: 1.5; }
.pz-loose-row { display: flex; align-items: center; gap: 1.4rem; }

.pz-loose {
  position: relative;
  width: calc(var(--pz-w) * var(--bw) * .52);
  padding: 0;
  background: none;
  border: 0;
  transform: rotate(var(--tilt, 0deg));
  filter: drop-shadow(0 .8rem 1.2rem rgba(0, 0, 0, .5));
  transition: transform .18s ease, filter .18s ease;
}

.pz-loose:hover, .pz-loose:focus-visible { transform: rotate(0deg) translateY(-.6rem) scale(1.07); filter: drop-shadow(0 1.6rem 2rem rgba(0, 0, 0, .55)); }
.pz-loose:focus-visible { outline: .5rem solid var(--sun); outline-offset: .6rem; border-radius: 1rem; }

.pz-loose-slot {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: .5rem;
  width: calc(var(--pz-w) * var(--bw) * .52);
  aspect-ratio: 1;
  color: #2e7d5b;
  border: .3rem dashed rgba(60, 100, 130, .35);
  border-radius: 1.4rem;
  font-size: 1.8rem;
  font-weight: 900;
}

.pz-loose-slot .ico { width: 3.2rem; height: 3.2rem; }

/* 다 맞춘 순간 : 주변을 어둡게, 퍼즐판은 빛나게 */
.pz-wrap.is-celebrate { position: relative; }
.pz-dim { position: absolute; inset: -50rem; z-index: 20; background: rgba(3, 16, 30, .9); animation: pz-fade 2s ease .5s both; }
@keyframes pz-fade { from { opacity: 0; } to { opacity: 1; } }
.pz-wrap.is-celebrate .pz-main { position: relative; z-index: 30; }
.pz-wrap.is-celebrate .pz-intro { display: none; }   /* 안내 문장을 치워 빛나는 그림이 화면 정중앙(가로·세로)에 오게 */
.pz-board.is-glow { animation: pz-glow 2.6s ease-out .9s both; }


/* 완성 팝업 : 배경막은 연출과 같은 어둡기, 상자는 1.4초에 걸쳐 천천히 떠오른다 */
.modal-bg.pz-pop-bg { background: rgba(3, 16, 30, .9); }
.pz-pop-holder { animation: pz-pop-in 1.4s ease-out both; }
@keyframes pz-pop-in {
  from { opacity: 0; transform: translateY(2.4rem) scale(.96); }
  to { opacity: 1; transform: none; }
}
.pz-pop-holder .case-file { width: 88rem; }
.pz-pop-holder .case-file.is-plain .case-paper { border: .6rem solid var(--bark); }   /* 바깥 테두리를 진하게 */
.pz-done-pop { display: grid; justify-items: center; gap: 1.6rem; padding: 1rem 0; text-align: center; }
.pz-done-pop h2 { margin: 0; color: var(--bark-deep); font-family: "Galmuri14", "Galmuri11", sans-serif; font-size: 6rem; line-height: 1.15; letter-spacing: -.04em; }
.pz-done-pop p { margin: 0; color: #2e4658; font-size: 2.6rem; font-weight: 800; line-height: 1.45; }
.pz-done-pop .cover-go { margin-top: 1.4rem; }

/* 퍼즐 완성 띠 */
.pz-complete {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  width: var(--pz-w);
  min-height: 19.4rem;
  padding: 1.6rem 3.2rem;
  color: #17507a;
  background: #fff;
  border: .5rem solid var(--bark);
  border-radius: 1.8rem;
  box-shadow: 0 1.2rem 2.4rem rgba(0, 0, 0, .35);
  animation: pz-pop .5s cubic-bezier(.2, 1.3, .4, 1) both;
}

@keyframes pz-pop {
  from { transform: scale(.86); opacity: 0; }
  to { transform: none; opacity: 1; }
}

.pz-complete > div { flex: 1 1 auto; min-width: 0; }
.pz-complete h2 { margin: 0; font-size: 4.2rem; line-height: 1.15; letter-spacing: -.04em; white-space: nowrap; }
.pz-complete p { margin: .4rem 0 0; font-size: 2.1rem; font-weight: 800; line-height: 1.4; }
.pz-complete .btn { flex: 0 0 auto; }

/* 문제 팝업·결과 화면 — 서류철 모양(이름표·색인 탭·점선) 없이 둥근 네모 상자 하나로 */
/* 고르기 문제 : 정답 설명(최대 34자)과 색 받기 단추가 한 줄에 들어가는 최소 폭 */
.modal-bg .case-file.is-quiz { width: 135rem; }   /* 갈무리9 기준 : 정답 설명 한 줄 */
/* 순서 문제 : 정답 설명(36자)과 색 받기 단추가 한 줄에 들어가는 최소 폭 */
.modal-bg .case-file.is-quiz.is-order { width: 139rem; }
/* 문제 팝업 : 가로는 좁게, 위아래 여백은 똑같이 넉넉하게 (닫기는 바깥 어두운 곳을 누르거나 Esc) */
/* 문제 팝업의 글씨는 Pretendard (픽셀 글꼴 대신) */
.modal-bg .case-file.is-quiz, .modal-bg .case-file.is-quiz .btn, .modal-bg .case-file.is-quiz button { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
/* 풀이 다시 보기 팝업도 문제 팝업과 같은 글씨 */
/* 다시 보기 팝업만 문제 팝업과 같은 글꼴 — 그림 완성 팝업(.pz-pop-holder)은 픽셀 글꼴 그대로 */
.modal-bg .modal-holder:not(.pz-pop-holder) .case-file.is-plain:not(.is-quiz), .modal-bg .modal-holder:not(.pz-pop-holder) .case-file.is-plain:not(.is-quiz) button { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
.modal-bg .case-file.is-quiz .case-paper {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 2.8rem;
  min-height: 0;
  padding: 6rem 8.65rem;   /* 좌우 : 안쪽 점선(1.4rem + 선 .25rem) 안에서 7rem 이 남도록 */
}
.modal-bg .case-file.is-quiz.is-order .case-paper { gap: 2rem; padding: 5rem 8rem; }
/* 좁아진 폭에 맞춰 순서 문제는 카드 칸(위)과 판정·확인 버튼(아래)을 세로로 쌓는다 */
.modal-bg .case-file.is-quiz .order-layout { grid-template-columns: minmax(0, 1fr); gap: 1.6rem; }
.modal-bg .case-file.is-quiz .order-side .wrap-up,
.modal-bg .case-file.is-quiz .order-side .act { margin-top: 0; }
.modal-bg .case-file.is-quiz .order-side .act { align-items: flex-end; }
/* 보기 글씨는 한 줄로 — 좁아진 팝업에 맞춰 글자와 여백을 조금 줄인다 */
.modal-bg .case-file.is-quiz .pick { gap: 1.4rem; padding: 1.6rem 1.8rem; font-size: 2.4rem; }
.modal-bg .case-file.is-quiz .pick-tag { width: 5.6rem; height: 5.6rem; font-size: 2.4rem; }
.modal-bg .case-file.is-quiz .pick-label { white-space: nowrap; }
.case-file.is-plain .case-index,
.case-file.is-plain .case-tab { display: none; }
.case-file.is-plain .case-folder { padding: 0; background: none; border-radius: 0; }
.case-file.is-plain .case-paper { padding: 3.6rem 3.6rem 3.6rem; background: #f4f9fd; border: .5rem solid #bcd8ea; border-radius: 3.2rem; }
/* 안쪽 점선은 그대로 두되 모서리를 바깥 테두리에 맞춰 둥글게 */
.case-file.is-plain .case-paper::before { inset: 1.4rem; border-width: .3rem; border-radius: 2.2rem; }
.case-file.is-plain.is-roomy .case-paper { padding: 4.4rem 3.6rem; }

/* 아래쪽 상자 둘 : 빠진 조각(누르기) · 얻은 조각(끌기) */
.pz-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; width: var(--pz-w); }

.pz-box {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: .8rem;
  min-height: 19rem;
  padding: 1.2rem 1.6rem 1.2rem;
  background: rgba(255, 255, 255, .8);   /* 알록달록 배경 위에서 글씨가 읽히도록 */
  border: .3rem dashed rgba(60, 100, 130, .4);
  border-radius: 1.6rem;
}

.pz-box.is-earned {
  width: 24rem;
  min-height: 0;
  padding: 1.4rem 1.4rem 1.6rem;
  background: rgba(255, 255, 255, .88);
  border-color: rgba(43, 127, 184, .55);
}
.pz-box.is-earned .pz-box-head { white-space: normal; }
.pz-box.is-earned .pz-box-head strong { font-size: 2.4rem; }
.pz-box.is-earned .pz-box-head span { font-size: 1.6rem; line-height: 1.35; }
.pz-box.is-earned .pz-box-row { flex-direction: column; justify-content: center; gap: 1.2rem; min-height: 0; }
.pz-box-head { display: grid; gap: .2rem; color: #1f3a4d; text-align: left; white-space: nowrap; }
.pz-box-head strong { font-size: 2.3rem; letter-spacing: -.02em; }
.pz-box-head strong b { color: #2b7fb8; }
.pz-box-head span { color: #3f5d70; font-size: 1.6rem; font-weight: 800; }
.pz-box-hint { color: #b3402f; font-style: normal; white-space: pre-line; }   /* 줄바꿈 문자를 그대로 줄바꿈으로 */
.pz-box-row { display: flex; align-items: center; justify-content: center; gap: 1.2rem; min-height: 12.4rem; }
.pz-box .pz-loose, .pz-box .pz-loose-slot { width: calc(var(--pz-w) * var(--bw) * .46); }
.pz-loose-slot.is-empty { color: #8fa6b6; font-size: 3rem; border-color: rgba(60, 100, 130, .25); }
.pz-loose-slot.is-placed { color: #2e7d5b; }

/* 얻은 조각 : 끌 수 있다 */
.pz-earned { cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
.pz-earned:active { cursor: grabbing; }
.pz-earned.is-new { animation: pz-pop .5s cubic-bezier(.2, 1.3, .4, 1) both; }
.pz-earned.is-dragging { opacity: .28; }

/* 끌고 있는 조각 복제본 — 손끝을 따라 화면 위에 떠서 움직인다.
   .pz-loose 의 position:relative 보다 뒤에 두어야 화면(fixed)에 고정된다. */
body > .drag-ghost.pz-earned {
  position: fixed;
  left: 0;
  top: 0;
  margin: 0;
  opacity: 1;
  transform-origin: center;
  /* 네모 상자처럼 보이던 상자 그림자·배경·테두리를 모두 빼고 조각 그림만 남긴다 */
  background: transparent;
  border: 0;
  outline: 0;
  box-shadow: none;
  filter: none;
  transition: none;
  animation: none;
}

/* 조각을 구멍 위로 가져가면 자리를 밝혀 준다 */
.pz-hole.is-wait { cursor: default; }
/* 이미 푼 자리(조각을 얻은 자리) : 노란 점선·노란 강조 없이. 조각을 끌어 올렸을 때만 하늘색으로 */
.pz-hole.is-wait .pz-hole-shape { stroke: rgba(255, 255, 255, .75); }
.pz-hole.is-wait:hover .pz-hole-shape { fill: rgba(15, 8, 0, .62); }
.pz-hole.is-wait.is-drop-ready .pz-hole-shape { fill: rgba(191, 224, 245, .6); stroke: #fff; }
.pz-hole.is-drop-ready .pz-hole-shape { fill: rgba(240, 197, 63, .55); stroke: #fff; }

.quiz-box-tag {
  display: inline-flex;
  align-items: center;
  gap: .8rem;
  margin: 0 0 1.8rem;
  padding: .6rem 1.8rem;
  color: #fff;
  background: var(--bark);
  border-radius: 99rem;
  font-size: 2rem;
  font-weight: 900;
}

.quiz-box-tag .ico { width: 2.2rem; height: 2.2rem; }

.modal-close {
  position: absolute;
  top: 2.4rem;
  right: 2.6rem;
  z-index: 3;
  display: grid;
  width: 4.8rem;
  height: 4.8rem;
  place-items: center;
  color: #fff;
  background: var(--bark);
  border: 0;
  border-radius: 50%;
  font-size: 2.4rem;
  font-weight: 900;
  line-height: 1;
}

.modal-close:hover { filter: brightness(1.12); }
.pz-done-row { flex-wrap: nowrap; justify-content: space-between; align-items: center; gap: 1.8rem; margin-top: 2.2rem; }
.pz-done-row .verdict { flex: 1 1 auto; min-width: 0; padding: 1.4rem 1.8rem; }
.pz-done-row .btn { flex: 0 0 auto; }
.modal-bg .case-file.is-quiz .order-side .pz-done-row { flex-direction: row; align-items: flex-end; justify-content: space-between; margin-top: 0; }
  

/* ==========================================================================
   문제 팝업 · 풀이 다시 보기 팝업 — '문제 화면·결과 팝업 디자인 가이드' 값 적용
   (포스트잇 종이 그림과 그에 딸린 여백값은 넣지 않는다. 색은 이 파일의 하늘색 컨셉을 따른다.)
   ========================================================================== */
/* 질문 : 점선 상자, 왼쪽 세로 띠 없음 */
.modal-bg .case-file.is-quiz .ask {
  margin: 0;
  padding: 2.4rem 3.4rem;
  background: var(--note);
  border: .3rem dashed #5aa6d8;
  border-left: .3rem dashed #5aa6d8;
  border-radius: 1.6rem;
}
.modal-bg .case-file.is-quiz .ask h1 { margin: 0; font-size: 4.6rem; line-height: 1.28; letter-spacing: -.035em; font-weight: 900; white-space: nowrap; }

.modal-bg .case-file.is-quiz.is-order .ask h1 { font-size: 3.8rem; }
.modal-bg .case-file.is-quiz [data-action="place-piece"] { min-height: 7.6rem; padding: 1.25rem 5.2rem; font-size: 3.2rem; }

/* 자료 : 돋보기 + 글, 상자 없음 */
.modal-bg .case-file.is-quiz .clue {
  gap: 2rem;
  margin-bottom: 0;
  padding: 0;
  background: none;
  border: 0;
}
.modal-bg .case-file.is-quiz .clue-icon { width: 4.8rem; height: 4.8rem; color: #17507a; background: #bfe0f5; }
.modal-bg .case-file.is-quiz .clue-icon .ico { width: 2.6rem; height: 2.6rem; }
.modal-bg .case-file.is-quiz .clue-text { font-size: 2.5rem; font-weight: 800; line-height: 1.4; }

/* 선택지 */
.modal-bg .case-file.is-quiz .answers { gap: 2.6rem; }
.modal-bg .case-file.is-quiz .pick {
  gap: 1.3rem;
  min-height: 8.2rem;
  padding: 1.2rem 1.9rem;
  border: .4rem solid #9aa9b4;
  border-radius: 1.8rem;
  font-size: 2.6rem;
}
.modal-bg .case-file.is-quiz .pick.is-picked { border-color: var(--bark); }
.modal-bg .case-file.is-quiz .pick.is-right { border-color: var(--ok); }
.modal-bg .case-file.is-quiz .pick.is-again { border-color: var(--again-edge); }
.modal-bg .case-file.is-quiz .pick:disabled:not(.is-right):not(.is-again) { border-color: #d5d2c9; }
.modal-bg .case-file.is-quiz .pick-tag {
  width: 5rem;
  height: 5rem;
  color: var(--bark);
  background: #dceaf4;
  border: .3rem solid var(--bark);
  border-radius: 1.5rem;
  font-size: 2.2rem;
}
.modal-bg .case-file.is-quiz .pick.is-picked .pick-tag { color: #fff; background: var(--bark); }
.modal-bg .case-file.is-quiz .pick.is-right .pick-tag { color: #fff; background: var(--ok); border-color: #14603c; }
.modal-bg .case-file.is-quiz .pick.is-again .pick-tag { color: #fff; background: var(--again); border-color: #5e3408; }   /* 틀린 보기 : 알파벳 칸도 주황 계열 (바탕 #fdeed6 보다 진하게) */
.modal-bg .case-file.is-quiz .pick-mark { min-width: 4.2rem; }
.modal-bg .case-file.is-quiz .pick-mark .ico { width: 2.8rem; height: 2.8rem; }
.modal-bg .case-file.is-quiz .pick-mark i { font-size: 1.6rem; line-height: 1.1; }
.modal-bg .case-file.is-quiz .pick-mark.is-pin .ico { width: 5rem; height: 5rem; }

/* 단추 줄 */
.modal-bg .case-file.is-quiz .act { gap: 3.3rem; margin-top: 0; }
.modal-bg .case-file.is-quiz .act-note { font-size: 2.3rem; font-weight: 800; }
.modal-bg .case-file.is-quiz .wrap-up { align-items: flex-end; gap: 3.3rem; margin-top: 0; }
.modal-bg .case-file.is-quiz .btn { min-height: 7.6rem; padding: 1.4rem 3.2rem; border-radius: 1.4rem; font-size: 3rem; }
.modal-bg .case-file.is-quiz .pz-done-row { gap: 3.3rem; margin-top: 0; align-items: flex-end; }
/* 아래 줄(확인 단추 · 판정 상자 · 판정 + 색 받기)은 모두 같은 높이 → 상자가 뜨든 안 뜨든 팝업 크기가 같다 */
.modal-bg .case-file.is-quiz .act,
.modal-bg .case-file.is-quiz .wrap-up,
.modal-bg .case-file.is-quiz .pz-done-row { min-height: 15.2rem; }
.modal-bg .case-file.is-quiz .act { align-items: flex-end; }   /* 확인 단추와 '색 받기' 단추가 같은 자리(줄 아래쪽)에 온다 */

/* 해설 상자 */
.modal-bg .case-file.is-quiz .verdict { flex: 1 1 48rem; box-sizing: border-box; min-height: 15.2rem; align-items: center; gap: 3.1rem; padding: 2.6rem 3.5rem; border-width: .3rem; border-radius: 1.6rem; }   /* 내용을 세로 가운데에 → 위아래 여백이 같다 */
.modal-bg .case-file.is-quiz .verdict .ico { margin-top: 0; }
.modal-bg .case-file.is-quiz .verdict strong { margin-bottom: .4rem; font-size: 2.7rem; }
.modal-bg .case-file.is-quiz .verdict p { font-size: 2.3rem; font-weight: 700; line-height: 1.42; }
.modal-bg .case-file.is-quiz .verdict .ico { width: 3.2rem; height: 3.2rem; margin-top: .3rem; }
.modal-bg .case-file.is-quiz .pz-done-row .verdict { padding: 2.6rem 3.5rem; }

/* 순서 문제 안의 글씨도 같은 비율로 */
.modal-bg .case-file.is-quiz .interaction-help { font-size: 2.3rem; }

/* ── 풀이 다시 보기 팝업 ── */
.modal-bg { padding: 2rem; background: rgba(9, 30, 50, .62); }
.modal-scroll { max-height: none; overflow: visible; padding-right: 1rem; }
.record-clue {
  display: flex;
  align-items: center;
  min-height: 7.1rem;
  margin-bottom: 2.72rem;   /* 닫기 단추 위 여백과 같게 */
  padding: 1.675rem 1.8rem;
  border-radius: 1.4rem;
}
.record-clue p { margin: 0; font-size: 2.1rem; font-weight: 800; }
.record-ask { margin: 0 0 2.72rem; font-size: 3.8rem; line-height: 1.35; letter-spacing: -.03em; }
.record-rows { gap: .8rem; }
.rec-group { padding: 1rem 2rem; }
/* 순서 문제(흰색) 풀이의 초록 상자 : 줄 간격을 5px 더 넓힌다 (기준 화면 1rem = 10px) */
.record.is-order .rec-group.is-ok dd { line-height: calc(1.45em + .5rem); }
.rec { padding: .5rem 0; }
.modal-done {
  display: block;
  width: fit-content;
  min-height: 5.6rem;
  margin: 2.72rem auto 0;
  padding: .8rem 4.2rem;
  border-bottom-width: .6rem;
  border-radius: 1.4rem;
  font-size: 2.4rem;
}


/* ==========================================================================
   픽셀 컨셉 — 각진 모서리 · 굵은 단색 테두리 · 흐림 없는 그림자 · 픽셀 버튼
   (글꼴은 갈무리11 / 갈무리14, 배경은 저해상도 그림을 확대해 픽셀이 보이게)
   ========================================================================== */
:root { --px-ink: #1b2f3f; --px-shade: rgba(27, 47, 63, .32); }

/* 둥근 모서리 → 각진 모서리 (퍼즐 조각 SVG 는 그대로) */
.stage *:not(svg):not(svg *), .drag-ghost { border-radius: 0 !important; }
/* 문제 팝업 : 그림(svg)을 뺀 모든 상자를 둥근 네모로 (위 각지게 하는 규칙의 예외) */
.stage .modal-bg .case-file.is-quiz,
.stage .modal-bg .case-file.is-quiz *:not(svg):not(svg *) { border-radius: 1.6rem !important; }
.stage .modal-bg .case-file.is-quiz .case-paper { border-radius: 3.6rem !important; }   /* 안쪽 점선(2.2rem + 1.4rem)과 같은 곡률 */
.stage .modal-bg .case-file.is-quiz .case-tab { border-radius: 1.6rem 1.6rem 0 0 !important; }
.stage .modal-bg .case-file.is-quiz .case-no { border-radius: 1.3rem !important; }
.stage .modal-bg .case-file.is-quiz .pick { border-radius: 1.8rem !important; }
.stage .modal-bg .case-file.is-quiz .pick-tag { border-radius: 1.5rem !important; }
.stage .modal-bg .case-file.is-quiz .clue-icon { border-radius: 1.4rem !important; }
/* 파랑 · 남색 문제의 자료 그림은 각지게 (위 '팝업 안 모두 둥글게' 규칙보다 앞세운다) */
.stage .modal-bg .case-file.is-quiz .quiz-art,
.stage .modal-bg .case-file.is-quiz .quiz-arts,
.stage .modal-bg .case-file .quiz-art,
.stage .modal-bg .case-file .quiz-arts { border-radius: 0 !important; }
.stage .modal-bg .case-file.is-quiz .btn { border-radius: 1.4rem !important; }
.stage .modal-bg .case-file.is-quiz .slot-no { border-radius: .9rem !important; }
.stage .modal-bg .case-file.is-quiz .order-number { border-radius: 1.2rem !important; }
.stage .modal-bg .case-file.is-quiz .placed-card { border-radius: 1rem !important; }
.stage .modal-bg .case-file.is-quiz .placed-check { border-radius: .6rem !important; }
/* 끌고 있는 카드 복제본(무대 밖에 붙는다)도 같은 모서리 */
.drag-ghost.slot-card, .drag-ghost.drag-card, .drag-ghost.order-card { border-radius: 1.6rem !important; }

/* 그림판 : 얻은 색 · 칠한 곳 상자도 둥근 네모 */
.stage .px-palette-head, .stage .px-progress { border-radius: 1.6rem !important; }

/* 결과 화면 : 픽셀 그림과 '처음부터 다시' 단추만 각진 채로 두고 나머지는 둥근 네모 */
.stage .result-wrap,
.stage .result-wrap *:not(svg):not(svg *) { border-radius: 1.6rem !important; }
/* 큰 결과 상자는 둥근 네모 (안쪽 점선과 같은 곡률 맞춤) */
.stage .result-wrap .case-paper { border-radius: 3.6rem !important; }
.stage .result-wrap .case-paper::before { border-radius: 2.2rem !important; }
.stage .result-wrap .case-tab { border-radius: 1.6rem 1.6rem 0 0 !important; }
.stage .result-wrap .record-no { border-radius: .8rem !important; }
.stage .result-wrap .record-badge { border-radius: 99rem !important; }
.stage .result-wrap .solved-art, .stage .result-wrap .cover-go { border-radius: 0 !important; }   /* 픽셀 그림 · 처음부터 다시 단추는 그대로 */

/* 결과 화면에서 여는 '풀이 다시 보기' 팝업도 둥근 네모 */
.stage .modal-bg .modal-holder:not(.pz-pop-holder) .case-file:not(.is-quiz) .case-paper { border-radius: 3.6rem !important; }
.stage .modal-bg .modal-holder:not(.pz-pop-holder) .case-file:not(.is-quiz) .case-tab { border-radius: 1.6rem 1.6rem 0 0 !important; }
.stage .modal-bg .record,
.stage .modal-bg .record *:not(svg):not(svg *),
.stage .modal-bg .modal-done, .stage .modal-bg .case-file .modal-done { border-radius: 1.6rem !important; }   /* 닫기 단추는 둥글게 (그림 문항은 상자 밖에 있어 따로 잡는다) */
.stage .modal-bg .record .record-badge { border-radius: 99rem !important; }
.stage .modal-bg .record .rec { border-radius: 0 !important; }   /* 줄 사이 점선은 곧게 (모서리가 둥글면 점선 끝이 휜다) */
/* 팔레트의 물감 자리는 구멍에 맞춰 둥글게 (위 각지게 하는 규칙의 예외) */
.stage .px-well, .stage .px-swatch { border-radius: 50% !important; }
.stage .px-well-name { border-radius: .6rem !important; }

/* 배경 : 픽셀 확대 */
.stage.is-cover::before, .stage.is-puzzle::before { image-rendering: auto; }

/* 큰 상자(문제 팝업 · 다시 보기 · 결과 · 완성 팝업) */
.case-file { filter: none; }
.case-file.is-plain .case-paper { border: .6rem solid var(--px-ink); box-shadow: 1.2rem 1.2rem 0 var(--px-shade); }
.case-file.is-plain .case-paper::before { border: .3rem dashed rgba(27, 47, 63, .35); }
.result-wrap .case-file.is-plain .case-paper,
.pz-pop-holder .case-file.is-plain .case-paper { border: .6rem solid var(--px-ink); }

/* 글 상자 */
.modal-bg .case-file.is-quiz .ask { background: #fff; border: .4rem solid var(--px-ink); box-shadow: .6rem .6rem 0 var(--px-shade); }
.modal-bg .case-file.is-quiz .clue-icon { border: .4rem solid var(--px-ink); box-shadow: .4rem .4rem 0 var(--px-shade); }
.record-clue, .drag-pool, .solved-score { background: #fff; border: .4rem solid var(--px-ink); }
.rec-group { border-width: .4rem; }
.rec-group.is-pick { border-color: var(--px-ink); }
.rec + .rec { border-top: .3rem dashed rgba(27, 47, 63, .3); }

/* 선택지 · 카드 · 칸 */
.modal-bg .case-file.is-quiz .pick { border: .5rem solid var(--px-ink); box-shadow: .6rem .6rem 0 var(--px-shade); }
.modal-bg .case-file.is-quiz .pick:hover:not(:disabled) { transform: translate(-.3rem, -.3rem); box-shadow: .9rem .9rem 0 var(--px-shade); }
.modal-bg .case-file.is-quiz .pick.is-picked { border-color: var(--bark); }
.modal-bg .case-file.is-quiz .pick.is-right { border-color: var(--ok); }
.modal-bg .case-file.is-quiz .pick.is-again { border-color: var(--again); }
.modal-bg .case-file.is-quiz .pick-tag { border: .4rem solid var(--px-ink); }
.slot-box { border: .4rem dashed var(--px-ink); }
.slot-box.is-filled, .slot-box.is-right, .slot-box.is-wrong { border-style: solid; }
.drag-card, .order-card { border: .4rem solid var(--px-ink); box-shadow: .5rem .5rem 0 var(--px-shade); }
.drag-ghost.slot-card { border: .4rem solid var(--px-ink); box-shadow: .5rem .5rem 0 var(--px-shade); }
.verdict { border-width: .5rem; box-shadow: .6rem .6rem 0 var(--px-shade); }
.verdict-ok { border-color: var(--ok); }
.verdict-again { border-color: var(--again); }

/* 픽셀 버튼 : 단색 채움 + 굵은 테두리 + 딱 떨어지는 그림자, 누르면 내려앉는다 */
.btn, .modal-done {
  border: .5rem solid var(--px-ink);
  border-bottom-width: .5rem;
  box-shadow: .8rem .8rem 0 var(--px-ink);
  transition: transform .06s steps(2), box-shadow .06s steps(2);
}
.btn:hover:not(:disabled), .modal-done:hover { filter: none; transform: translate(-.2rem, -.2rem); box-shadow: 1rem 1rem 0 var(--px-ink); }
.btn:active:not(:disabled), .modal-done:active { transform: translate(.6rem, .6rem); border-bottom-width: .5rem; box-shadow: .2rem .2rem 0 var(--px-ink); }
.btn:disabled { box-shadow: .8rem .8rem 0 var(--px-shade); }
.btn-sky { box-shadow: .8rem .8rem 0 var(--px-ink); }
.cover-go { box-shadow: 1rem 1rem 0 var(--px-ink); }

/* 표지 · 퍼즐판 화면 글씨 : 흰 픽셀 그림자 */
.cover-title { text-shadow: .6rem .6rem 0 #fff; }
.cover-lead, .pz-intro { text-shadow: .4rem .4rem 0 #fff; }

/* 퍼즐판 · 얻은 조각 상자 */
.pz-board { border: .8rem solid var(--px-ink); box-shadow: .8rem .8rem 0 var(--px-shade); }
.pz-box { background: rgba(255, 255, 255, .92); border: .5rem solid var(--px-ink); box-shadow: .8rem .8rem 0 var(--px-shade); }
.pz-box.is-earned { background: rgba(255, 255, 255, .92); border-color: var(--px-ink); }
.pz-loose-slot { border: .4rem dashed rgba(27, 47, 63, .45); }
.pz-box-hint { color: var(--again); }

/* 결과 화면 */
.record-btn { border: .5rem solid var(--px-ink); box-shadow: .8rem .8rem 0 var(--px-shade); }
.record-btn:hover { transform: translate(-.3rem, -.3rem); box-shadow: 1.1rem 1.1rem 0 var(--px-shade); }
.record-no { border: .3rem solid var(--px-ink); }
.solved-art { border: .5rem solid var(--px-ink); box-shadow: .8rem .8rem 0 var(--px-shade); }
.record-badge { border-width: .3rem; }

/* 다 맞춘 순간의 빛 : 계단식으로 번지는 픽셀 빛 */
@keyframes pz-glow {
  from { border-color: var(--px-ink); box-shadow: .8rem .8rem 0 var(--px-shade); }
  to { border-color: #fff3b0; box-shadow: 0 0 0 1.2rem rgba(255, 236, 140, .9), 0 0 0 2.6rem rgba(255, 214, 80, .55), 0 0 0 4.2rem rgba(255, 214, 80, .25); }
}


/* ── 자료 그림이 있는 문제 팝업 : 왼쪽 그림 + 오른쪽 내용 ── */
.quiz-split { display: flex; align-items: stretch; gap: 7rem; min-height: 0; }   /* 그림과 내용 사이 = 점선 안쪽 여백(7rem) */
.quiz-art {
  flex: 0 0 36rem;   /* 세로 비율(3:4) 그대로, 상자 안 높이(약 48rem)에 맞춘 폭 */
  width: 36rem;
  align-self: flex-start;
  height: auto;
  background: #fff;
  border: .5rem solid var(--px-ink);
  box-shadow: .8rem .8rem 0 var(--px-shade);
}
.quiz-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 2rem; }   /* 자료가 두 줄이라 간격을 조금 줄여 상자 높이를 다른 문제와 맞춘다 */
/* 오른쪽 칸이 좁으므로 보기 카드는 조금 작게 만들어 A · B 를 한 줄에 둔다 */
.quiz-split .answers { gap: 1.6rem; }
.modal-bg .case-file.is-quiz .quiz-split .pick { gap: .8rem; padding: 1.2rem 1.2rem; font-size: 2.1rem; }
.modal-bg .case-file.is-quiz .quiz-split .pick-tag { width: 4.6rem; height: 4.6rem; font-size: 2rem; }
.modal-bg .case-file.is-quiz .quiz-split .pick-mark { min-width: 3.6rem; }
.quiz-split .pz-done-row { flex-wrap: wrap; }
.quiz-split .pz-done-row .verdict { flex: 1 1 100%; }
.quiz-split .pz-done-row .btn { margin-left: auto; }
/* 판정 상자(정답이에요!/다시 살펴볼까요?)의 위아래 여백을 줄여, 상자가 나타나도 팝업 세로폭이 커지지 않게 (그림 높이 안) */
.modal-bg .case-file.is-quiz .quiz-split .verdict { min-height: 0; padding-top: 1.7rem; padding-bottom: 1.7rem; }

/* 그림이 두 장인 문항 : 왼쪽에 세로로 쌓는다. 두 장 높이의 합이 상자 안 높이(약 48rem)를 넘지 않는 폭 */
.quiz-arts { flex: 0 0 33rem; width: 33rem; display: flex; flex-direction: column; gap: 1.6rem; align-self: flex-start; }
.quiz-arts .quiz-art { flex: none; width: 100%; height: auto; max-height: none; align-self: auto; }
.review-split .quiz-arts { flex: 0 0 22rem; }

/* 다시 보기 팝업의 좌우 나눔 : 오른쪽은 글이 한 줄로 들어가는 만큼만, 왼쪽 그림은 남는 폭·높이 안에서 비율대로 */
.modal-holder.has-art .case-file { width: 135rem; }   /* 그림이 있는 문항의 다시 보기는 문제 팝업과 같은 폭 */
.review-split { align-items: flex-start; }
.review-split .quiz-art { flex: 0 1 auto; width: auto; max-width: 100%; max-height: 48rem; min-width: 0; align-self: flex-start; }
.review-split .quiz-main { flex: 0 0 auto; width: max-content; max-width: 100%; display: block; }
.review-split .record-clue p, .review-split .record-ask, .review-split .rec dt, .review-split .rec dd > span { white-space: nowrap; }
.review-split .modal-done { margin-left: auto; margin-right: auto; }
/* 파랑 다시 보기 : 그림 두 장의 높이 합(간격 포함)이 오른쪽 기록 높이(48.04rem)와 같아지는 폭 */
/* 여백은 안쪽 점선(1.4rem + 선 .25rem = 1.65rem) 기준 : 점선~그림 = 그림~기록 = 기록~점선 */
.modal-holder.art-rain .case-file.is-plain .case-paper { padding-left: 8.3rem; padding-right: 8.3rem; }
.modal-holder.art-rain .review-split { gap: 6.65rem; }
.modal-holder.art-rain .review-split .quiz-arts { flex: 0 0 32.4rem; width: 32.4rem; }
/* 남색 다시 보기 : 좌우 여백을 6rem 으로 줄이고, 그림 높이를 오른쪽 기록 높이에 맞춘다 (비율 유지) */
.modal-holder.art-book .case-file.is-plain .case-paper { padding-left: 6.55rem; padding-right: 6.55rem; }
.modal-holder.art-book .review-split { gap: 4.85rem; }
.modal-holder.art-book .review-split .quiz-art { box-sizing: border-box; height: 48.04rem; width: auto; max-height: none; }

/* ── 모바일 : 세로로 들어도 무조건 가로 화면 ───────
   세로 화면(폭 1024px 이하)에서는 무대(#app)를 시계 방향으로 90° 돌려 가로로 보여 준다.
   배율(1rem)도 가로·세로를 바꿔 계산해 돌린 뒤의 화면에 꽉 차게 한다.
   손끝 좌표는 스크립트의 toLocal() 이 무대 기준으로 바꿔 준다. */
@media (orientation: portrait) and (max-width: 1024px) {
  html { font-size: min(0.625vh, 1.1111vw); font-size: min(0.625dvh, 1.1111vw); }
  body { display: block; }
  #app {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vh;
    width: 100dvh;
    height: 100vw;
    display: grid;
    place-items: center;
    transform: translateX(100vw) rotate(90deg);
    transform-origin: 0 0;
  }
}

/* ── 픽셀 색칠 그림판 · 팔레트 ─────────────── */
.px-canvas {
  position: relative;
  width: 60rem;
  height: 60rem;
  padding: 2rem;
  background: #f4f9fd;
  border: .8rem solid var(--px-ink);
  box-shadow: .8rem .8rem 0 var(--px-shade);
}
.px-svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
/* 그림 바깥 왼쪽 위에 두는 완성본 미리보기 */
.px-guide {
  align-self: flex-start;   /* 흐름 안에 두어 가운데 정렬에 함께 들어간다 */
  display: grid;
  justify-items: center;
  gap: .4rem;
  width: 17rem;
  margin: 0;
  padding: 1rem 1rem 1.2rem;
  background: rgba(255, 255, 255, .94);
  border: .4rem solid var(--px-ink);
  box-shadow: .5rem .5rem 0 var(--px-shade);
  pointer-events: none;
}
.px-guide-art { display: block; width: 100%; height: auto; }
.px-guide figcaption { color: #3f5d70; font-size: 1.7rem; font-weight: 900; }
.px-cell { cursor: pointer; }
.px-cell:hover { opacity: .78; }
.px-cell.is-painted { cursor: default; }
.px-cell.is-painted:hover { opacity: 1; }
/* 색을 고른 상태 : 화면 안 모든 곳(팔레트 색·단추 포함)에서 붓 커서 (무대에 inline 으로 넣은 커서를 물려받는다) */
.stage.is-brush *, .stage.is-brush button, .stage.is-brush .px-well, .stage.is-brush .px-cell, .stage.is-brush .px-cell.is-painted { cursor: inherit !important; }
.px-cell.is-new { animation: px-pop .3s steps(3) both; }
.px-cell:active { opacity: .6; }
@keyframes px-pop { from { opacity: 0; } to { opacity: 1; } }
.px-canvas.is-glow { animation: pz-glow 2.6s ease-out .9s both; }

.px-palette { display: grid; grid-template-rows: auto auto auto; gap: 1.2rem; width: 34rem; }
.px-palette-head {
  display: grid;
  gap: .5rem;
  padding: 1rem 1.4rem;
  color: #1f3a4d;
  background: rgba(255, 255, 255, .92);
  border: .4rem solid var(--px-ink);
  box-shadow: .8rem .8rem 0 var(--px-shade);   /* 그림(.px-canvas) 그림자와 같은 두께 */
}
.px-palette-head strong { font-size: 2.4rem; }
.px-palette-head strong b { color: var(--bark); }
.px-palette-head span { display: block; min-height: 2.7em; font-size: 1.6rem; line-height: 1.35; color: #3f5d70; }   /* 두 줄 안내(색이 맞지 않을 때) 높이로 고정 */

/* 둥근 판 : 픽셀 SVG 위에 물감 자리를 얹는다 */
.px-board { position: relative; width: 100%; aspect-ratio: 22 / 20; filter: drop-shadow(0 .6rem 1.2rem rgba(0, 30, 60, .2)); }
.px-board-svg { display: block; width: 100%; height: 100%; }
.px-well {
  position: absolute;
  display: block;
  box-sizing: border-box;
  width: 7.26rem;    /* 구멍 바깥 지름(47/220 × 34rem)과 같게 */
  height: 7.26rem;
  /* 중심을 구멍에 맞춘다 : transform 대신 여백으로 (등장 애니메이션이 transform 을 지워도 자리가 흔들리지 않게) */
  margin: -3.63rem 0 0 -3.63rem;
  padding: 0;
  background: none;
  border: 0;
  font: inherit;
  cursor: pointer;
  transition: transform .06s steps(2);
}
.px-well:hover { transform: scale(1.06); }
.px-well.is-new { animation: pz-pop .5s both; }
.px-swatch {
  display: grid;
  place-items: center;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  background: #cfd6dc;
  border: .46rem solid #b9bcc0;   /* 구멍 테두리와 같은 두께·색 */
  border-radius: 50%;
  box-shadow: inset 0 .3rem .5rem rgba(0, 0, 0, .12);
}
.px-well.is-active .px-swatch { border-color: var(--bark); box-shadow: 0 0 0 .4rem #fff, 0 0 0 .8rem var(--bark), inset 0 .3rem .5rem rgba(0, 0, 0, .12); }
.px-well.is-locked .px-swatch { background: transparent; border-color: transparent; box-shadow: none; }
.px-well.is-locked:hover .px-swatch { box-shadow: 0 0 0 .4rem rgba(59, 130, 246, .35); }
.px-swatch b { color: #6b7a88; font-size: 3rem; }

  <script>
(() => {

  const lockLandscape = () => { try { screen.orientation?.lock?.("landscape")?.catch?.(() => {}); } catch (e) { /* 지원 안 함 */ } };
  document.addEventListener("pointerdown", lockLandscape, { once: true });
  const quizzes = window.QUIZZES || {};
  const completionKey = "ai-ethics-html-quiz-completion";

  const ICON = {

    pin: `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5v-7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M6.6 3.4h10.8l-1.5 7 2.6 3.1H5.5l2.6-3.1z" fill="currentColor"/></svg>`,
